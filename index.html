<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>11월 17일 경찰 암기 데일리 퀴즈</title>
<style>
  :root {
    --bg-page: #f2f4f7;
    --bg-card: #ffffff;
    --text-main: #111827;
    --text-sub: #4b5563;
    --text-muted: #9ca3af;
    --primary: #2563eb;
    --primary-bg: #eff6ff;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --border: #e5e7eb;
    --radius-card: 20px;
    --radius-btn: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg-page);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    max-width: 520px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px 14px 4px;
  }
  .header h1 {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .score-badge {
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
  }
  .progress-wrap {
    width: 100%;
    height: 7px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .progress-bar {
    height: 100%;
    background: var(--primary);
    width: 25%;
    transition: width 0.3s ease;
  }
  .quiz-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 24px 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
  }
  .badge-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cat-badge {
    background: var(--primary-bg);
    color: var(--primary);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
  }
  .cat-badge.review {
    background: #fef3c7;
    color: #b45309;
  }
  .q-num {
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
  }
  .question-body {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.55;
    color: var(--text-main);
    word-break: keep-all;
    min-height: 85px;
    padding-top: 4px;
  }
  .choice-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 8px;
  }
  .btn-ox {
    padding: 18px 0;
    font-size: 26px;
    font-weight: 900;
    border-radius: var(--radius-btn);
    border: 2px solid var(--border);
    background: #ffffff;
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.12s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    user-select: none;
  }
  .btn-ox:active { transform: scale(0.95); opacity: 0.85; }
  .btn-ox.correct {
    background: var(--success-bg) !important;
    border-color: var(--success) !important;
    color: var(--success) !important;
  }
  .btn-ox.wrong {
    background: var(--danger-bg) !important;
    border-color: var(--danger) !important;
    color: var(--danger) !important;
  }
  .explanation-card {
    display: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 14px;
    line-height: 1.55;
    animation: fadeIn 0.2s ease;
  }
  .explanation-card.correct {
    background: var(--success-bg);
    border: 1.5px solid rgba(22, 163, 74, 0.3);
  }
  .explanation-card.wrong {
    background: var(--danger-bg);
    border: 1.5px solid rgba(220, 38, 38, 0.3);
  }
  .exp-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-weight: 800;
    font-size: 15px;
  }
  .explanation-card.correct .exp-header { color: var(--success); }
  .explanation-card.wrong .exp-header { color: var(--danger); }
  .schedule-badge {
    font-size: 11px;
    font-weight: 700;
    background: #ffffff;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid currentColor;
  }
  .exp-content {
    color: var(--text-sub);
    font-weight: 500;
    word-break: keep-all;
  }
  .btn-next {
    display: none;
    background: var(--primary);
    color: #ffffff;
    font-size: 16px;
    font-weight: 800;
    padding: 16px;
    border-radius: var(--radius-btn);
    border: none;
    cursor: pointer;
    text-align: center;
    margin-top: auto;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    transition: opacity 0.15s ease;
  }
  .btn-next:active { opacity: 0.85; }

  .complete-box {
    display: none;
    text-align: center;
    padding: 30px 10px 10px 10px;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation: fadeIn 0.3s ease;
  }
  .complete-icon { font-size: 52px; }
  .complete-title { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
  .complete-desc { font-size: 14px; color: var(--text-sub); line-height: 1.5; margin-bottom: 8px; }
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    margin-bottom: 12px;
  }
  .stat-card {
    background: var(--bg-page);
    border-radius: 12px;
    padding: 16px 12px;
  }
  .stat-card .val { font-size: 26px; font-weight: 900; color: var(--primary); }
  .stat-card .lbl { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-top: 4px; }
  .wrong-review-box {
    width: 100%;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 12px;
    padding: 14px;
    text-align: left;
    margin-bottom: 12px;
  }
  .wrong-review-title {
    font-size: 13px;
    font-weight: 800;
    color: var(--danger);
    margin-bottom: 8px;
  }
  .wrong-review-item {
    font-size: 12px;
    color: #7f1d1d;
    line-height: 1.45;
    padding: 6px 0;
    border-bottom: 1px dashed #fca5a5;
  }
  .wrong-review-item:last-child { border-bottom: none; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body ontouchstart="">

<div class="header">
  <h1>📝 오늘의 암기 퀴즈</h1>
  <div class="score-badge" id="score-badge">진행 1 / 12</div>
</div>

<div class="progress-wrap">
  <div class="progress-bar" id="p-bar" style="width: 25%;"></div>
</div>

<div class="quiz-card" id="quiz-card">
  <!-- Active Question Area -->
  <div id="play-area">
    <div class="badge-row">
      <span class="cat-badge" id="cat-text">경찰학 · 법령 형식 [FSRS 신규]</span>
      <span class="q-num" id="q-num">1 / 12</span>
    </div>

    <div class="question-body" id="q-text">
      경찰관 직무집행법(경직법)의 위임 사항 중 복제에 관한 사항은 행정안전부령으로 정하고, 그 외 대다수 사항은 대통령령으로 정한다.
    </div>

    <div class="choice-grid" id="choice-grid">
      <button type="button" class="btn-ox" id="btn-o" onclick="choose('O')">⭕️ O</button>
      <button type="button" class="btn-ox" id="btn-x" onclick="choose('X')">❌ X</button>
    </div>

    <div class="explanation-card" id="exp-card">
      <div class="exp-header">
        <span id="exp-title">정답입니다!</span>
        <span class="schedule-badge" id="schedule-badge" style="display:none;">내일 점심 재출제 큐에 저장</span>
      </div>
      <div class="exp-content" id="exp-body">해설 내용</div>
    </div>

    <button type="button" class="btn-next" id="btn-next" onclick="goNext()">다음 문제로 ➔</button>
  </div>

  <!-- Complete Screen -->
  <div class="complete-box" id="complete-box">
    <div class="complete-icon" id="res-icon">🎯</div>
    <div class="complete-title" id="res-title">오늘의 12문제 완료!</div>
    <div class="complete-desc" id="res-desc">수고하셨습니다! 틀린 문제는 내일 점심 1시 퀴즈에 자동 재출제됩니다.</div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="val" id="res-correct">0</div>
        <div class="lbl">정답</div>
      </div>
      <div class="stat-card">
        <div class="val" id="res-wrong">0</div>
        <div class="lbl">오답 (내일 재출제)</div>
      </div>
    </div>

    <div class="wrong-review-box" id="wrong-box" style="display:none;">
      <div class="wrong-review-title">📌 내일 점심 1시에 다시 도전할 오답 목록</div>
      <div id="wrong-list"></div>
    </div>

    <button type="button" class="btn-next" id="btn-copy-result" style="display:block; background:#374151; margin-bottom:8px;" onclick="copyResult()">📋 결과 복사하기</button>
    <button type="button" class="btn-next" style="display:block;" onclick="restart()">처음부터 다시 풀기 ↺</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    cat: "경찰학 · 청탁금지법 과태료 [어제 오답 복습]",
    isReview: true,
    q: "청탁금지법상 제3자를 통하여 부정청탁을 한 자는 2천만원 이하의 과태료에, 제3자를 위하여 부정청탁을 한 일반인은 1천만원 이하의 과태료에 처한다.",
    ans: "X",
    point: "제3자를 위한 부정청탁: 공직자등 3천 / 일반인 2천 / 제3자를 통한 자 1천",
    exp: "제3자를 위하여 부정청탁을 한 공직자등은 3천만원 이하, 일반인은 2천만원 이하, 제3자를 통하여 부정청탁을 한 자는 1천만원 이하의 과태료입니다!"
  },
  {
    cat: "경찰학 · 행정행위 효력 소멸 [어제 오답 복습]",
    isReview: true,
    q: "적법하게 성립한 행정행위라도 기간 만료나 목적 달성, 대상의 멸실 등 법정 사유가 발생하면 행정청의 별도 의사표시 없이 당연히 효력이 소멸하는데, 이를 '철회'라 한다.",
    ans: "X",
    point: "실효(법정사유·당연소멸) vs 철회(후발사유·별도 의사표시·장래효)",
    exp: "행정청의 별도 의사표시 없이 법정 사유로 당연히 소멸하는 것은 '실효'입니다! '철회'는 사후 사유로 장래를 향해 효력을 소멸시키는 별도의 처분입니다."
  },
  {
    cat: "경찰학 · 생명·신체·재산 [FSRS 신규]",
    isReview: false,
    q: "112 신고 접수·처리, 감금된 자의 구호, 범죄피해자 구조청구권은 모두 '생명·신체·재산'을 보호 법익으로 포함한다.",
    ans: "X",
    point: "112·감금구호·범죄피해자구조 → 생명·신체만 (재산 X)",
    exp: "112 신고 접수·처리, 감금된 자의 구호, 범죄피해자 구조청구권, 사람을 직접 통제·억제하는 행위는 '생명·신체'만 포함하고 '재산'은 빠집니다! (장소·공간 수색이나 기본 임무 조항엔 재산 포함)"
  },
  {
    cat: "경찰학 · 경찰활동 모델 [FSRS 신규]",
    isReview: false,
    q: "Eck & Spelman의 문제지향적 경찰활동(SARA 모델)은 조사(Scanning) → 분석(Analysis) → 대응(Response) → 평가(Assessment)의 4단계로 진행되며 반복 사건의 근본 원인 해결에 집중한다.",
    ans: "O",
    point: "문제지향적 경찰활동(SARA): 조사-분석-대응-평가",
    exp: "정확합니다! SARA 모델은 반복되는 범죄·무질서 사건의 근본 원인 해결에 집중하는 문제지향적 경찰활동입니다."
  },
  {
    cat: "경찰학 · 경찰윤리 [FSRS 신규]",
    isReview: false,
    q: "Delattre가 강조한 '역할 한계' 원칙에 따르면, 경찰관이 빈민가 주민에게 연탄을 배달해 주는 등 본연의 직무를 넘어선 온정주의적 행동은 권장된다.",
    ans: "X",
    point: "역할 한계(Delattre): 직무 범위를 벗어난 과도한 온정주의 경계",
    exp: "틀렸습니다! 경찰의 고유 권한과 역할 한계를 준수해야 하므로, 본연의 직무를 벗어난 과도한 온정주의(예: 연탄 배달 등)는 역할 한계 일탈에 해당합니다."
  },
  {
    cat: "경찰학 · 행정행위 성질 [FSRS 신규]",
    isReview: false,
    q: "행정행위의 성질 중 '허가'는 법규허가가 인정되지 않고 신청 없는 허가는 가능하지만, '특허'는 법규특허는 가능하되 신청 없는 특허는 인정되지 않는다.",
    ans: "O",
    point: "허가(법규X·무신청O·수정X) vs 특허(법규O·무신청X·수정X)",
    exp: "정확합니다! 하명은 법규하명 O, 허가는 법규허가 X·신청 없는 허가 O, 특허는 법규특허 O·신청 없는 특허 X, 인가는 법규·수정·무신청 모두 X입니다."
  },
  {
    cat: "경찰학 · 사회계약론 [FSRS 신규]",
    isReview: false,
    q: "로크(Locke)의 사회계약론에 따르면 자연상태는 만인의 만인에 대한 투쟁 상태이므로, 국민은 모든 권리를 전부 양도해야 하며 저항권은 인정되지 않는다.",
    ans: "X",
    point: "홉스(전부양도·저항권X) vs 로크(일부양도·저항권O)",
    exp: "그것은 홉스(Hobbes)입니다! 로크는 자연상태에서 자연법이 지배하나 시비 기준·집행력이 결여되었다고 보아 권리를 '일부 양도(신탁)'하고 저항권과 정부해산권을 인정합니다."
  },
  {
    cat: "형소법 · 재체포·재구속 제한 [FSRS 신규]",
    isReview: false,
    q: "체포·구속적부심사 결정에 의하여 석방된 피의자라도, 수사기관이 다른 중요한 증거를 발견하면 동일한 범죄사실로 재차 체포·구속할 수 있다.",
    ans: "X",
    point: "적부심 석방 후: 도망 또는 죄증인멸 외 재체포·재구속 불가",
    exp: "틀렸습니다! 다른 중요한 증거 발견 시 재체포·재구속은 영장체포/수사기관 구속의 일반 제한이고, 적부심 석방 후에는 오직 '도망하거나 죄증을 인멸한 경우'에만 동일한 범죄사실로 재체포·재구속할 수 있습니다."
  },
  {
    cat: "형소법 · 불복 체계 [FSRS 신규]",
    isReview: false,
    q: "증거보전 청구 기각결정에 대해서는 3일 이내에 항고할 수 있으며, 체포·구속적부심사의 기각 및 석방 결정에 대해서는 항고할 수 없다.",
    ans: "O",
    point: "증거보전 기각(3일 내 항고) / 적부심 결정(항고 불가)",
    exp: "정확합니다! 증거보전 청구 기각결정은 3일 내 항고가 가능하고, 적부심 기각·석방 결정, 영장 발부·기각 재판, 구속기간 연장 불허가 등은 항고가 불가합니다."
  },
  {
    cat: "형소법 · 청문과 공청회 [FSRS 신규]",
    isReview: false,
    q: "행정절차법상 청문은 개최 10일 전까지 당사자에게 통지해야 하고, 공청회는 원칙적으로 개최 14일 전까지 통지해야 한다.",
    ans: "O",
    point: "청문 당사자 10일 전(주재자 7일 전) / 공청회 14일 전(예외 7일)",
    exp: "정확합니다! 청문은 당사자 10일 전·청문주재자 7일 전 통지, 공청회는 14일 전(예외 7일 전), 입법예고는 법령 40일(자치법규 20일)·행정예고 20일 이상입니다."
  },
  {
    cat: "형법 총론 · 책임과 미수 [FSRS 신규]",
    isReview: false,
    q: "형법상 불능미수와 친족상도례(일부)는 형을 임의적으로 감경 또는 면제할 수 있으나, 장애미수는 임의적 감경만 가능하고 면제할 수는 없다.",
    ans: "O",
    point: "임의적 감면(불능미수·친족상도례) vs 임의적 감경(장애미수·인질상해해방)",
    exp: "정확합니다! 중지미수는 '필요적 감면', 농아자·심신미약·방조범은 '필요적 감경', 불능미수·과실범 자수·친족상도례는 '임의적 감면', 장애미수·인질상해 해방은 '임의적 감경'입니다."
  },
  {
    cat: "형법 총론 · 긴급피난과 정당방위 [FSRS 신규]",
    isReview: false,
    q: "정당방위는 자기 또는 타인의 개인적 법익뿐만 아니라 국가적·사회적 법익을 보호하기 위해서도 허용된다.",
    ans: "X",
    point: "정당방위(개인적 법익만) vs 긴급피난(개인·사회·국가적 법익 모두)",
    exp: "틀렸습니다! 정당방위는 원칙적으로 자기 또는 타인의 '개인적 법익'에 한하고, 국가적·사회적 법익까지 폭넓게 보호 가능한 것은 '긴급피난'입니다."
  }
];

let cur = 0;
let correctCount = 0;
let wrongItems = [];
let answered = false;

function loadQuestion() {
  if (cur >= QUESTIONS.length) {
    showResult();
    return;
  }
  answered = false;
  const item = QUESTIONS[cur];

  const catBadge = document.getElementById('cat-text');
  catBadge.innerText = item.cat;
  if (item.isReview) {
    catBadge.className = 'cat-badge review';
  } else {
    catBadge.className = 'cat-badge';
  }

  document.getElementById('q-num').innerText = `${cur + 1} / ${QUESTIONS.length}`;
  document.getElementById('q-text').innerText = item.q;
  document.getElementById('score-badge').innerText = `진행 ${cur + 1} / ${QUESTIONS.length}`;
  document.getElementById('p-bar').style.width = `${((cur + 1) / QUESTIONS.length) * 100}%`;

  const btnO = document.getElementById('btn-o');
  const btnX = document.getElementById('btn-x');
  btnO.className = 'btn-ox';
  btnX.className = 'btn-ox';
  btnO.disabled = false;
  btnX.disabled = false;

  document.getElementById('exp-card').style.display = 'none';
  document.getElementById('schedule-badge').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
}

function choose(pick) {
  if (answered) return;
  answered = true;

  const item = QUESTIONS[cur];
  const isRight = (pick === item.ans);

  const btnO = document.getElementById('btn-o');
  const btnX = document.getElementById('btn-x');
  btnO.disabled = true;
  btnX.disabled = true;

  if (pick === 'O') {
    btnO.classList.add(isRight ? 'correct' : 'wrong');
  } else {
    btnX.classList.add(isRight ? 'correct' : 'wrong');
  }

  const expCard = document.getElementById('exp-card');
  const expTitle = document.getElementById('exp-title');
  const expBody = document.getElementById('exp-body');
  const schedBadge = document.getElementById('schedule-badge');

  expCard.style.display = 'block';
  expBody.innerText = item.exp;

  if (isRight) {
    correctCount++;
    expCard.className = 'explanation-card correct';
    expTitle.innerText = `⭕️ 정답입니다! (${item.point})`;
    schedBadge.style.display = 'none';
  } else {
    wrongItems.push(item);
    expCard.className = 'explanation-card wrong';
    expTitle.innerText = `❌ 오답입니다! (정답: ${item.ans})`;
    schedBadge.style.display = 'inline-block';
  }

  const btnNext = document.getElementById('btn-next');
  btnNext.style.display = 'block';
  if (cur === QUESTIONS.length - 1) {
    btnNext.innerText = '결과 보기 ➔';
  } else {
    btnNext.innerText = '다음 문제로 ➔';
  }
}

function goNext() {
  cur++;
  loadQuestion();
}

function showResult() {
  document.getElementById('play-area').style.display = 'none';
  const compBox = document.getElementById('complete-box');
  compBox.style.display = 'flex';

  document.getElementById('res-correct').innerText = `${correctCount}개`;
  document.getElementById('res-wrong').innerText = `${wrongItems.length}개`;

  const resIcon = document.getElementById('res-icon');
  const resTitle = document.getElementById('res-title');

  if (correctCount === QUESTIONS.length) {
    resIcon.innerText = '💯';
    resTitle.innerText = `${QUESTIONS.length}/${QUESTIONS.length} 전원 만점 마스터!`;
  } else {
    resIcon.innerText = '🎯';
    resTitle.innerText = `${QUESTIONS.length}문제 중 ${correctCount}문제 정답!`;
  }

  const wrongBox = document.getElementById('wrong-box');
  const wrongList = document.getElementById('wrong-list');
  if (wrongItems.length > 0) {
    wrongBox.style.display = 'block';
    wrongList.innerHTML = wrongItems.map((w, idx) => `
      <div class="wrong-review-item">
        <strong>${idx + 1}. [${w.cat}]</strong><br>
        ${w.q}<br>
        👉 <em>정답: ${w.ans} (${w.point})</em>
      </div>
    `).join('');
  } else {
    wrongBox.style.display = 'none';
  }
}

function restart() {
  cur = 0;
  correctCount = 0;
  wrongItems = [];
  document.getElementById('play-area').style.display = 'block';
  document.getElementById('complete-box').style.display = 'none';
  loadQuestion();
}

function copyResult() {
  let text = '';
  if (wrongItems.length === 0) {
    text = '오늘 퀴즈 다 맞음!';
  } else {
    text = `오늘 퀴즈 ${wrongItems.length}개 오답: ` + wrongItems.map(w => w.cat).join(', ');
  }
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('btn-copy-result');
    btn.innerText = '✅ 복사 완료! 대화창에 붙여넣기 해 주세요';
    setTimeout(() => {
      btn.innerText = '📋 결과 복사하기';
    }, 2500);
  }).catch(() => {
    alert(text);
  });
}

// Initial render
loadQuestion();
</script>
</body>
</html>
