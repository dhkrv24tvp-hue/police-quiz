<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헌법 최판 전 지문 O/X 퀴즈</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#16181d; --sub:#6b7280; --line:#e5e7eb;
  --brand:#1f4fd8; --brand-soft:#e8eeff; --ok:#0f7b4f; --ok-soft:#e6f5ee;
  --no:#c0392b; --no-soft:#fdecea; --warn:#b8860b; --gold:#f6c343;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px; line-height:1.62; -webkit-text-size-adjust:100%;
  padding-bottom:80px;
}
header{
  position:sticky; top:0; z-index:50; background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--line);
}
.hwrap{max-width:860px;margin:0 auto;padding:10px 14px 8px}
.htop{display:flex;align-items:center;gap:10px}
h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 small{font-weight:600;color:var(--sub);font-size:11.5px;margin-left:6px}
.btn{
  border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:10px;
  padding:6px 10px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.bar{height:6px;background:#e9ecf2;border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f6bff,#5b8cff);transition:width .25s}
.stats{display:flex;gap:12px;font-size:12px;color:var(--sub);flex-wrap:wrap;align-items:center}
.stats b{color:var(--ink);font-size:13px}
.controls{max-width:860px;margin:0 auto;padding:8px 14px 10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:12.5px;
  font-weight:700;color:var(--sub);cursor:pointer;white-space:nowrap;
}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.searchrow{display:flex;gap:6px}
input[type=search]{
  flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;
  background:#fff;color:var(--ink);outline:none;font-family:inherit;
}
input[type=search]:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
main{max-width:860px;margin:0 auto;padding:4px 12px 40px}
.grouphead{
  position:sticky; top:96px; z-index:20; margin:16px 0 8px; padding:7px 12px;
  background:linear-gradient(180deg,#eef1f8,#e8ecf7); border:1px solid #dde2ee; border-radius:10px;
  font-size:12.5px; font-weight:800; color:#33406b; letter-spacing:-.01em;
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px 12px;
  margin:0 0 10px; box-shadow:0 1px 2px rgba(16,24,40,.04); scroll-margin-top:150px;
}
.card.var{
  margin-left:14px; border-left:4px solid #b9932f; background:#fffdf7;
  border-radius:0 14px 14px 0; padding-left:12px;
}
.card.var .q{font-size:15px}
.card.flash{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 1px 2px rgba(16,24,40,.04)}}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.num{
  font-weight:900;font-size:12.5px;color:#fff;background:#2b3445;border-radius:7px;padding:3px 8px;letter-spacing:.02em;
}
.num.d2{background:#6b3fa0}
.num.sup{background:#0f7d8c}
.num.var{background:#8a6d1f}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;border:1px solid var(--line);color:var(--sub);background:#fafbfc}
.tag.mk{background:#f3f6ff;border-color:#dbe4ff;color:#33406b;font-weight:700}
.tag.sec{background:#f3f6ff;border-color:#dbe4ff;color:#33406b;font-weight:700}
.q{font-size:15.5px;letter-spacing:-.01em;word-break:keep-all}
.ox{display:flex;gap:8px;margin-top:11px}
.ox button{
  flex:1;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:11px 0;
  font-size:16px;font-weight:900;cursor:pointer;color:#8b93a3;letter-spacing:.06em;
}
.ox button:active{transform:scale(.98)}
.ox button.o.sel{background:var(--brand);border-color:var(--brand);color:#fff}
.ox button.x.sel{background:#3a3f4b;border-color:#3a3f4b;color:#fff}
.ox.locked button{cursor:default;opacity:.55}
.ox.locked button.sel{opacity:1}
.fb{margin-top:11px;border-top:1px dashed var(--line);padding-top:10px;display:none}
.fb.show{display:block}
.fb .verdict{font-weight:900;font-size:14.5px;display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.fb .verdict.ok{color:var(--ok)}
.fb .verdict.no{color:var(--no)}
.pill{border-radius:99px;padding:2px 9px;font-size:12px;font-weight:900}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--no-soft);color:var(--no)}
.pill.dec{background:#fff7e3;color:#8a6d1f;border:1px solid #f2dfae;font-weight:800}
.fb p{margin:6px 0 0;font-size:14px;color:#2b3040;letter-spacing:-.01em}
.fb .cs{margin-top:8px;font-size:12.5px;color:var(--sub);font-weight:700}
.fb .cs b{background:#f3f4f6;border-radius:6px;padding:2px 8px}
.empty{color:var(--sub);text-align:center;padding:50px 10px;font-size:14px}
footer{max-width:860px;margin:0 auto;padding:10px 16px 30px;color:#9aa1ad;font-size:11.5px;text-align:center}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:99;
  background:#1b1f27;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;max-width:90vw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
@media (max-width:520px){
  .q{font-size:15px}
  h1{font-size:14.5px}
  .grouphead{top:92px}
  .card.var{margin-left:8px;padding-left:10px}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="htop">
      <h1>헌법 최판 전 지문 O/X<small id="hsub"></small></h1>
      <button class="btn" id="btnWrong">오답만</button>
      <button class="btn" id="btnReset">초기화</button>
    </div>
    <div class="bar"><i id="pbar"></i></div>
    <div class="stats">
      <span>진행 <b id="sProg">0/0</b></span>
      <span>정답 <b id="sRight">0</b></span>
      <span>오답 <b id="sWrong">0</b></span>
      <span>정답률 <b id="sRate">-</b></span>
    </div>
  </div>
</header>

<div class="controls">
  <div class="row" id="fSrc">
    <button class="chip on" data-v="all">전체</button>
    <button class="chip" data-v="d1">헌법 최판 3개년+보충</button>
    <button class="chip" data-v="d2">26년 2차대비 최판특강</button>
  </div>
  <div class="row" id="fPart">
    <button class="chip on" data-v="all">모든 문항</button>
    <button class="chip" data-v="본문">원지문</button>
    <button class="chip" data-v="변형">변형지문</button>
    <button class="chip" data-v="보충">보충페이지</button>
  </div>
  <div class="searchrow">
    <input type="search" id="q" inputmode="text" placeholder="번호로 찾기 (예: 54, 54-2, 보충 6)">
    <button class="btn" id="btnGo">찾기</button>
  </div>
</div>

<main id="list"></main>
<footer>출처: 2026년 1월 중순 최신판례 보충 · 경찰 헌법도약 최근 3개년 헌법판례정리 · 2026년 일반경찰 2차대비 최신판례특강 정리자료</footer>
<div class="toast" id="toast"></div>

<script>
const DATA = [{"id":"c1s-001","no":"보충 001","src":"d1","part":"보충","sec":"2026년 1월 최신판례 보충","tag":"인용(위헌확인)","q":"국가보안법위반 혐의로 체포되어 교도소에 구금된 청구인을 위해 변호인이 토요일 18:30경 청구인의 체포적부심사 준비를 위한 변호인 접견을 신청하였으나, '국가공무원 복무규정' 제9조에 따른 근무시간이 아니며 사전 예약도 하지 않았고 체포적부심사가 휴일에 이루어지는 경우 수용자를 미리 법원에 출석시켜 변호인의 조력을 받을 수 있도록 하고 있음을 이유로 위 신청을 거부한 것은 청구인의 변호인의 조력을 받을 권리를 침해한다.","a":"O","e":"체포된 피의자는 48시간 이내에 구속영장이 청구되거나 석방되므로 체포 당일 변호인의 조력을 받는 것이 특히 긴요하다. 방어권 행사에 불이익이 초래되었으므로 변호인의 조력을 받을 기회가 충분히 보장된 채 단지 특정 시점에 접견이 이루어지지 못한 경우(헌재 2011.5.26. 2009헌마341)와 구별된다. 침해의 최소성과 법익의 균형성을 충족하지 못하여 과잉금지원칙에 반한다.","c":"헌재 2026.1.29. 2023헌마370","o":0},{"id":"c1s-006","no":"보충 006","src":"d1","part":"보충","sec":"2026년 1월 최신판례 보충","tag":"위헌","q":"임기만료에 따른 비례대표국회의원선거에서 전국 유효투표총수의 100분의 3 이상을 득표한 정당에 대해서만 비례대표국회의원의석을 배분하도록 하는 공직선거법 제189조 제1항 제1호(저지조항)는 헌법에 위반된다.","a":"O","e":"우리나라는 저지조항을 통해 원내 군소정당의 난립을 막고 다수세력을 형성할 필요성이 적고, 저지조항이 폐지되더라도 군소정당이 난립할 우려는 크지 않다. 반면 저지조항은 저지선을 넘지 못한 정당에 대한 투표를 사표로 만들어 투표의 성과가치와 저지선을 넘지 못한 정당을 차별하며, 사표를 증대시켜 선거의 비례성 약화를 초래하고 정치적 다양성과 정치과정의 개방성을 훼손할 가능성이 크다. 따라서 합리적 이유 없이 투표가치를 왜곡하고 선거의 대표성을 훼손하여 평등선거원칙에 위배되어 선거권, 피선거권, 평등권을 침해한다.","c":"헌재 2026.1.29. 2020헌마956 등","o":1},{"id":"c1-001","no":"001","src":"d1","part":"본문","sec":"법치주의","tag":"합헌","q":"헌법재판소가 성인대상 성범죄자에 대하여 10년 동안 일률적으로 의료기관에의 취업제한 등을 하는 규정에 대하여 위헌결정을 한 뒤, 개정법 시행일 전까지 성인대상 성범죄로 형을 선고받아 그 형이 확정된 사람에 대해서는 형의 종류 또는 형량에 따라 기간 차등을 두어 의료기관에의 취업 등을 제한하는 「아동·청소년의 성보호에 관한 법률」 부칙 제5조 제1호는 신뢰보호원칙에 위배되지 아니한다.","a":"O","e":"종전 규정에 대한 위헌결정으로 생긴 법적 공백을 메우면서, 형이 확정된 사람에 대하여 형의 종류·형량에 따라 취업제한 기간을 차등하여 부과하는 것은 예상할 수 있었던 것이고, 취업제한은 장래의 위험을 방지하기 위한 것이어서 침해되는 신뢰이익이 크지 않다. 아동·청소년을 성범죄로부터 보호하려는 공익적 가치가 크고, 개정법 시행 후 취업제한대상자나 그 법정대리인이 이의신청·취업제한기간 변경·면제 신청을 할 수 있어 불이익이 최소화되어 있으므로 신뢰보호원칙에 위배되지 않는다.","c":"헌재 2023.5.25. 2020헌바45","o":2},{"id":"c1-002","no":"002","src":"d1","part":"본문","sec":"법치주의","tag":"합헌","q":"공익법인이 유예기간이 지난 후에도 보유기준을 초과하여 주식을 보유하는 경우 10년을 초과하지 않는 범위에서 매년 가산세를 부과하도록 정한 「상속세 및 증여세법」 제78조 제4항 중 제49조 제1항 제2호에 관한 부분은 신뢰보호원칙에 반한다.","a":"X","e":"입법자는 공익법인에 출연한 내국법인 주식 중 증여세과세가액에 산입하지 않는 한도기준을 낮추고, 유예기간 경과 후까지 기준을 초과하여 보유하는 경우에는 가산세를 부과하도록 법을 개정하였다. 관련 규정의 개정 경과에 비추어 공익사업 운영자가 제도의 시행과정에서 발생하는 문제점을 제거하기 위한 추가적 법률개정이 필요할 수 있음을 충분히 예상할 수 있었으므로 법률의 존속에 대한 신뢰이익의 보호가치는 크다고 할 수 없는 반면, 조세회피와 부의 세습을 방지하려는 공익은 막중하다. 따라서 신뢰보호원칙에 반하지 않는다(결론은 '반하지 않는다').","c":"헌재 2023.7.20. 2019헌바223","o":3},{"id":"c1-003","no":"003","src":"d1","part":"본문","sec":"법치주의","tag":"기각","q":"수신자 정수업무를 지정받은 자가 수신료를 징수하는 때, 그 고유업무와 관련된 고지행위와 결합하여 이를 행해서는 안 된다고 규정한 「방송법 시행령」 조항은 수신료의 구체적인 고지방법에 관한 규정인바, 이를 법률에서 직접 정하지 않았다고 하여 의회유보원칙에 위반된다고 볼 수 없다.","a":"O","e":"심판대상조항은 수신료의 구체적인 고지방법에 관한 규정이고, 이는 수신료의 부과·징수에 관한 본질적인 요소로서 법률에 직접 규정할 사항이 아니므로 법률에서 직접 정하지 않았다고 하여 의회유보원칙에 위반된다고 볼 수 없다. 방송법 제65조, 제67조 제2항에 따라 수신료 징수업무를 위탁하는 경우 구체적인 시행방법을 규정하고 있는 점에 비추어 시행령의 한계를 일탈하였다고 볼 수 없다.","c":"헌재 2024.5.30. 2023헌마820","o":4},{"id":"c1-004","no":"004","src":"d1","part":"본문","sec":"법치주의","tag":"합헌","q":"성폭력범죄를 저지르면 벌금형이 확정된 체육지도자의 자격을 필요적으로 취소하도록 개정된 국민체육진흥법 조항은 헌법에 위반된다.","a":"X","e":"이 사건 부칙조항은 진행 중인 사실 내지 법률관계에 대한 규율로 헌법상 원칙적으로 금지되는 진정소급입법에 해당하지 않는다. 개정 전 국민체육진흥법에 따르면 체육지도자가 성폭력범죄로 벌금형이 확정되더라도 최대 6개월의 자격정지처분만 내려질 수 있을 뿐이므로 자격이 취소되지 않을 것이라는 기대를 가질 수 있었지만, 성폭력범죄에 대한 벌금형 확정에도 자격을 취소하지 않는 것이 오히려 예외적인 것으로서 그러한 신뢰는 헌법상 보호가치 있는 신뢰라고 보기 어렵다. 따라서 신뢰보호원칙에 위배되지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.8.29. 2023헌바73","o":5},{"id":"c1-004V","no":"004-2","src":"d1","part":"변형","sec":"법치주의","tag":"변형지문","q":"성폭력범죄를 저지르면 벌금형이 확정된 체육지도자의 자격을 필요적으로 취소하도록 개정된 「국민체육진흥법」 조항을 개정법 시행 후 발생한 자격취소사유부터 적용하도록 한 같은 법 부칙 제4조 중 해당 부분은 개정법 시행일을 기준으로 하여 성폭력범죄로 이미 벌금형이 확정된 체육지도자와 그렇지 않은 체육지도자를 합리적인 이유 없이 달리 취급하는 것이므로 평등원칙에 위반된다.","a":"X","e":"이 사건 부칙조항은 진행 중인 사실 내지 법률관계에 대한 규율로 진정소급입법에 해당하지 않고, 개정법 시행 후 발생한 자격취소사유부터 적용하도록 한 것은 개정법 시행일을 기준으로 성폭력범죄로 이미 벌금형이 확정된 체육지도자와 그렇지 않은 자를 달리 취급하는 것이지만 그 차별에 합리적인 이유가 있으므로 평등원칙에 위반되지 않는다(원자료 표시 (×)).","c":"헌재 2024.8.29. 2023헌바73","o":6},{"id":"c1-005","no":"005","src":"d1","part":"본문","sec":"법치주의","tag":"합헌","q":"'특정경제범죄 가중처벌 등에 관한 법률'로 처벌되는 상습사기범죄 중 특정사기범죄의 범죄행위에 의하여 피해자로부터 취득한 재산 또는 그 재산의 보유·처분에 의하여 얻은 재산을 몰수·추징의 대상이 되는 범죄피해재산으로 규정한 '부패재산의 몰수 및 회복에 관한 특례법' 관련 규정은 진정소급입법에 해당하지 않고, 신뢰보호원칙에 위반되지 않는다.","a":"O","e":"이 사건 부칙조항은 이미 종료된 사실관계 또는 법률관계를 사후적으로 규율하는 것이 아니라 현재 진행 중인 사실관계, 즉 특정사기범죄를 저지르는 범인이 그로 인한 범죄피해재산을 보유하고 있고 이에 관한 수사나 재판이 진행 중인 상태에서 피해자가 사법상 청구권을 행사하여 이를 회복하는 것이 심히 곤란하다고 인정되는 경우에 해당 범죄피해재산을 몰수·추징할 수 있도록 한 것이다. 따라서 진정소급입법에 해당하지 않고, 특정사기범죄를 저지른 범인이 갖는 신뢰보다 더 크므로 신뢰보호원칙에도 위반되지 않는다.","c":"헌재 2025.7.17. 2020헌바524","o":7},{"id":"c1-006","no":"006","src":"d1","part":"본문","sec":"법치주의","tag":"합헌","q":"부모의 가업을 승계한 경우 증여세 과세특례를 규정한 구 조세특례제한법 제30조의6 제1항 중 '대통령령으로 정하는 바에 따라 가업을 승계한 경우'에 관한 부분 및 '가업을 승계하지 않으면 증여세 과세특례를 배제하는' 구 조세특례제한법 관련 규정들은 의회유보원칙과 포괄위임금지원칙에 위반되지 않는다.","a":"O","e":"수증자의 구체적인 가업승계 방식은 경제상황이나 기업환경의 변화 등을 고려하여 규율할 필요가 있는 세부적·기술적 사항이므로 입법자 스스로 규율하여야 할 본질적 사항이라고 보기 어렵고 하위법령에의 위임의 필요성이 인정된다. 가업 회사의 소유권 이전 외에 경영권의 이전까지 요구하고 있는 점, 일정기간 가업에 종사한 후 대표이사로 취임하는 것이 중소기업에서의 경영권 이전의 대표적인 모습인 점 등을 고려하면 대통령령에 위임한 것을 충분히 예측할 수 있다.","c":"헌재 2025.7.17. 2020헌바557","o":8},{"id":"c1-007","no":"007","src":"d1","part":"본문","sec":"국적","tag":"합헌","q":"직계존속이 외국에서 영주할 목적 없이 체류한 상태에서 출생한 자는 병역의무를 해소한 경우에만 국적이탈을 신고할 수 있도록 하는 구 국적법 제12조 제3항은 명확성원칙에 위반되지 않고, 국적이탈의 자유를 제한하지만 침해하지 않는다.","a":"O","e":"선천적 복수국적자가 자신의 의지와 관계없이 복수국적을 취득하게 되는 것은 헌법 제13조 제3항이 정한 '침족의 행위와 본인 간에 실질적으로 의미 있는 아무런 관련성을 인정할 수 없음에도 불구하고 오로지 침족이라는 사유 그 자체만으로 불이익한 처우를 가하는 경우'에 적용된다. 복수국적의 선천적 취득과 이로 인한 국적이탈의 문제는 헌법상 평등원칙(현저한 차별)의 규율 대상이라고 볼 수 없다. 심판대상조항은 국적이탈의 자유를 제한하지만 거주·이전의 자유에 대한 제한은 가하지 않고, 입법목적의 정당성·수단의 적합성·침해의 최소성·법익의 균형성을 갖추어 침해하지 않는다.","c":"헌재 2023.3.23. 2019헌바462","o":9},{"id":"c1-007V1","no":"007-2","src":"d1","part":"변형","sec":"국적","tag":"변형지문","q":"직계존속이 외국에서 영주할 목적 없이 체류한 상태에서 출생한 자는 병역의무를 해소한 경우에만 국적이탈을 신고할 수 있도록 하는 구 「국적법」 제12조 제3항은 헌법상 진정소급입법원칙의 규율 대상이다.","a":"X","e":"심판대상조항은 장래의 국적이탈 신고에 적용되는 것으로서 진정소급입법의 문제가 아니며, 선천적 복수국적자의 국적이탈의 자유를 제한하는 조항이 문제된다(원자료 표시 (×)).","c":"헌재 2023.3.23. 2019헌바462","o":10},{"id":"c1-007V2","no":"007-3","src":"d1","part":"변형","sec":"국적","tag":"변형지문","q":"직계존속이 외국에서 영주할 목적 없이 체류한 상태에서 출생한 자는 병역의무를 해소한 경우에만 국적이탈을 신고할 수 있도록 하는 구 「국적법」 제12조 제3항은 출입국 등 거주·이전 그 자체에 제한을 가하고 있으므로, 출입국에 관련하여 그 출생자의 거주·이전의 자유가 침해되는지 여부가 문제된다.","a":"X","e":"심판대상조항은 국적이탈의 자유를 제한할 뿐 출입국 등 거주·이전 그 자체에 제한을 가하고 있지 않으므로, 거주·이전의 자유가 아니라 국적이탈의 자유가 침해되는지 여부가 문제된다(원자료 표시 (×)).","c":"헌재 2023.3.23. 2019헌바462","o":11},{"id":"c1-008","no":"008","src":"d1","part":"본문","sec":"국적","tag":"합헌","q":"복수국적자가 외국에 주소가 있는 경우에만 국적이탈을 신고할 수 있도록 하는 국적법 제14조 제1항 본문은 명확성원칙에 위반되지 않고, 국적이탈의 자유를 제한하지만 침해하지 않는다.","a":"O","e":"'외국에 주소가 있는 경우'라는 요건은 국적이탈 신고 당시 외국에 생활의 근거를 두고 있는지를 의미하는 것으로 충분히 예측 가능하고, 복수국적자의 국적이탈의 자유를 제한하지만 그 제한은 입법목적에 부합하는 합리적인 범위 내의 것으로 침해하지 않는다.","c":"헌재 2023.2.23. 2020헌바603","o":12},{"id":"c1-009","no":"009","src":"d1","part":"본문","sec":"조약과 국제법규","tag":"각하","q":"자유권규약을 포함한 국제인권규범은 국내법체계상 법률적 효력을 가질 뿐이므로, 우리 헌법에서 명시적으로 입법위임을 하고 있거나 우리 헌법의 해석상 입법의무가 발생하는 경우가 아니라면 국제인권규범이 명시적으로 입법을 요구하고 있거나 그 해석상 국가의 기본권보장의무가 인정되는 경우라고 하더라도 곧바로 국가의 입법의무가 도출된다고 볼 수 없다.","a":"O","e":"자유권규약 등 국제인권규범은 국내법체계상 법률적 효력을 가질 뿐이고, 헌법에서 명시적으로 입법위임을 하거나 헌법 해석상 입법의무가 발생하는 경우가 아니면 곧바로 국가의 입법의무가 도출된다고 볼 수 없다. 따라서 이에 관한 청구는 허용되지 않는다.","c":"헌재 2024.1.25. 2020헌바475 등","o":13},{"id":"c1-009V","no":"009-2","src":"d1","part":"변형","sec":"조약과 국제법규","tag":"변형지문","q":"'시민적 및 정치적 권리에 관한 국제규약'(이하 '자유권규약')은 국내법체계상 법률적 효력을 가지므로, 헌법에서 명시적으로 입법위임을 하고 있거나 우리 헌법의 해석상 입법의무가 발생하는 경우가 아니라도, 자유권규약이 명시적으로 입법을 요구하고 있거나 그 해석상 국가의 기본권보장의무가 인정되는 경우에는 곧바로 국가의 입법의무가 도출된다.","a":"X","e":"국제인권규범은 국내법체계상 법률적 효력을 가질 뿐이므로, 헌법에서 명시적으로 입법위임을 하거나 헌법 해석상 입법의무가 발생하지 않는 한, 규약이 명시적으로 입법을 요구하거나 그 해석상 기본권보장의무가 인정되더라도 곧바로 국가의 입법의무가 도출된다고 볼 수 없다(원자료 표시 (×)).","c":"헌재 2024.1.25. 2020헌바475 등","o":14},{"id":"c1-010","no":"010","src":"d1","part":"본문","sec":"책임과 형벌간의 비례원칙","tag":"위헌","q":"허위재무제표작성죄와 허위감사보고서작성죄에 대하여 배수벌금을 규정하면서도, '그 위반행위로 얻은 이익 또는 회피한 손실액이 없거나 산정하기 곤란한 경우'에 관한 벌금 상한액을 규정하지 아니한 것은 ① 명확성의 원칙에 위배되지 않지만 ② 책임과 형벌 간의 비례원칙에 위배된다.","a":"O","e":"벌금 상한액에 관한 규정이 없어 법관의 양형에 맡겨져 있으나 명확성원칙에 위배되지는 않는다. 그러나 '그 위반행위로 얻은 이익 또는 회피한 손실액이 없거나 산정하기 곤란한 경우'에 관한 벌금 상한액을 규정하지 않음으로써, 회사의 규모나 위반행위의 내용 등과 무관하게 법정형의 상한이 사실상 무한정 확장될 수 있어 책임과 형벌 간의 비례원칙에 위배된다.","c":"헌재 2024.7.18. 2022헌가6","o":15},{"id":"c1-011","no":"011","src":"d1","part":"본문","sec":"책임과 형벌간의 비례원칙","tag":"위헌","q":"주거침입강제추행죄 및 주거침입준강제추행죄에 대하여 무기징역 또는 7년 이상의 징역에 처하도록 한 '성폭력범죄의 처벌 등에 관한 특례법' 관련규정은 책임과 형벌 간의 비례원칙에 위배된다.","a":"O","e":"주거침입죄와 강제추행·준강제추행죄는 모두 행위 유형이 매우 다양한데, 결합되었다고 하여 행위 태양의 다양성이 사라지는 것은 아니므로 법정형의 폭은 개별적으로 각 행위의 불법성에 맞는 처벌을 할 수 있는 범위로 정할 필요가 있다. 그런데 심판대상조항은 법정형의 하한을 '징역 7년'으로 정하고 있어, 다른 법률상 감경사유가 없는 한 법관이 정상참작감경을 하더라도 주거침입의 기회에 행해진 준강제추행의 경우에는 징역 3년 6월 이상의 중형에 처할 수밖에 없어 형벌개별화의 가능성이 극도로 제한된다. 법정형의 하한을 일률적으로 높게 책정하여 경미한 준강제추행의 경우까지 모두 엄하게 처벌하는 것은 책임주의에 반하고, 그 법정형이 형벌 본래의 목적과 기능을 달성함에 있어 필요한 정도를 일탈하였다.","c":"헌재 2023.2.23. 2021헌가9 등","o":16},{"id":"c1-012","no":"012","src":"d1","part":"본문","sec":"책임과 형벌간의 비례원칙","tag":"합헌","q":"야간주거침입절도죄의 미수범이 준강제추행죄를 범한 경우 무기징역 또는 7년 이상의 징역에 처하도록 한 '성폭력범죄의 처벌 등에 관한 특례법' 조항은 헌법에 위반된다.","a":"X","e":"야간주거침입절도죄의 미수범이 준강제추행죄를 범한 경우를 무기징역 또는 7년 이상의 징역에 처하도록 한 조항은, 그 행위의 불법성·책임의 중대성에 비추어 책임과 형벌 간의 비례원칙에 위배된다고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.2.23. 2022헌가2","o":17},{"id":"c1-013","no":"013","src":"d1","part":"본문","sec":"책임과 형벌간의 비례원칙","tag":"합헌","q":"누구든지 선박의 감항성의 결함을 발견한 때에는 신고하도록 하고 선박소유자, 선장 또는 선박직원이 신고의무를 위반한 경우 처벌하는 것은 죄형법정주의의 명확성원칙에 위배되지 않고, 책임과 형벌 간의 비례원칙에 위배되지 않는다.","a":"O","e":"신고의무의 주체와 대상, 위반행위의 내용이 충분히 예측 가능하여 명확성원칙에 위배되지 않고, 선박의 안전과 해상 인명·재산 보호라는 공익에 비추어 형벌의 범위가 책임에 상응하므로 책임과 형벌 간의 비례원칙에도 위배되지 않는다.","c":"헌재 2024.5.30. 2020헌바234","o":18},{"id":"c1-014","no":"014","src":"d1","part":"본문","sec":"책임과 형벌간의 비례원칙","tag":"합헌","q":"회계관계직원의 국고손실을 처벌하는 '특정범죄 가중처벌 등에 관한 법률'상 조항(국고에 손실을 입힐 것을 알면서 그 직무에 관하여 형법 제355조 제1항 횡령의 죄를 범한 경우)은 명확성원칙에 위배되지 않고, 형벌체계상의 균형을 잃어 평등원칙에 위배된다고 할 수 없다.","a":"O","e":"구성요건이 충분히 명확하여 명확성원칙에 위배되지 않고, 형법상 횡령죄 등 관련 범죄와의 형벌체계를 비교하여 볼 때 그 법정형이 현저히 불균형하다고 볼 수 없어 평등원칙에 위배된다고 할 수 없다.","c":"헌재 2024.4.25. 2021헌바21 등","o":19},{"id":"c1-015","no":"015","src":"d1","part":"본문","sec":"책임과 형벌간의 비례원칙","tag":"합헌","q":"공연한 방법으로 상관을 모욕한 사람을 처벌하는 군형법 제64조 제2항은 헌법에 위반된다.","a":"X","e":"군조직의 특성상 상관을 모욕하는 행위는 개인의 인격적 법익에 대한 침해를 넘어 군기를 문란하게 하는 행위로서 군조직의 위계질서를 파괴할 위험성이 크므로 죄질과 책임이 가볍지 않다. 심판대상조항은 징역이나 금고형의 하한을 두지 않고 있어 1개월부터 3년까지 다양한 기간의 형을 선고할 수 있고, 정상참작감경을 하지 않더라도 징역이나 금고형의 집행유예를 선고하거나 형의 선고를 유예할 수 있다. 따라서 책임과 형벌 간의 비례원칙에 위반된다고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.8.29. 2022헌가7 등","o":20},{"id":"c1-015V","no":"015-2","src":"d1","part":"변형","sec":"책임과 형벌간의 비례원칙","tag":"변형지문","q":"공연한 방법으로 상관을 모욕한 사람을 처벌하는 「군형법」 조항은 법관이 징역형이나 금고형 외에 벌금형을 선택할 수 없도록 하여 형벌의 개별화원칙에 부응하지 못하고 있으므로 형벌과 책임 간의 비례원칙에 위배된다.","a":"X","e":"법정형으로 징역형이나 금고형만 규정하고 있더라도 그 하한이 없어 다양한 기간의 형을 선고할 수 있고 집행유예·선고유예도 가능하므로, 벌금형을 선택할 수 없다는 이유만으로 형벌의 개별화원칙에 부응하지 못한다거나 책임과 형벌 간의 비례원칙에 위배된다고 볼 수 없다(원자료 표시 (×)).","c":"헌재 2024.8.29. 2022헌가7 등","o":21},{"id":"c1-016","no":"016","src":"d1","part":"본문","sec":"책임과 형벌간의 비례원칙","tag":"합헌","q":"폭행이나 협박으로 강제추행을 한 사람을 1년 이상의 유기징역에 처하도록 규정한 조항은 법정형으로 징역형만을 규정하고 있으나 형벌과 책임 간의 비례원칙에 위배되지 않는다.","a":"O","e":"법정형으로 징역형만을 규정하고 있더라도 그 하한이 1년 이상으로서 다양한 형량을 선고할 수 있고, 강제추행죄의 보호법익과 행위의 불법성에 비추어 징역형만을 규정한 것이 형벌과 책임 간의 비례원칙에 위배된다고 볼 수 없다.","c":"헌재 2024.8.29. 2022헌가7 등","o":22},{"id":"c1-017","no":"017","src":"d1","part":"본문","sec":"책임과 형벌간의 비례원칙","tag":"기각","q":"병역의무의 이행으로 인한 불이익한 처우를 금지하는 헌법 제39조 제2항과 관련하여, 병역의무를 이행 중인 군인이 복무하는 동안 군형법의 적용을 받는 것은 국방의 의무를 이행하는 중에 병역 군사상 범죄에 대하여 형벌이라는 제재를 받는 것이므로 병역의무의 이행으로 인한 불이익에 해당한다고 할 수 없다.","a":"O","e":"병역의무를 이행 중인 군인이 복무하는 동안 군형법의 적용을 받는 것은 국방의 의무를 이행하는 중에 군사상 범죄에 대하여 형벌이라는 제재를 받는 것으로서, 병역의무의 이행으로 인한 불이익한 처우에 해당한다고 할 수 없으므로 헌법 제39조 제2항에 위반되지 않는다.","c":"헌재 2025.5.29. 2022헌바209","o":23},{"id":"c1-018","no":"018","src":"d1","part":"본문","sec":"책임과 형벌간의 비례원칙","tag":"합헌","q":"항거불능 상태를 이용하여 추행을 한 자는 1년 이상의 유기징역에 처하도록 규정한 군형법 제92조의4 준강간, 준강제추행 조항은 법정형으로 징역형만을 규정하고 있으나 형벌과 책임 간의 비례원칙에 위배되지 않는다.","a":"O","e":"법정형으로 징역형만을 규정하고 있더라도 하한이 1년 이상이어서 다양한 형량의 선고가 가능하고, 준강간·준강제추행죄의 보호법익과 불법성에 비추어 징역형만을 규정한 것이 책임과 형벌 간의 비례원칙에 위배된다고 볼 수 없다.","c":"헌재 2025.6.27. 2025헌바97","o":24},{"id":"c1-019","no":"019","src":"d1","part":"본문","sec":"국가형벌권의 한계","tag":"합헌","q":"수탁자가 신탁재산을 고유재산으로 하거나 이에 관하여 권리를 취득하는 것을 금지한 구 신탁법 해당 조항은 신탁회사 및 신탁업자의 영업의 자유와 계약의 자유를 각각 제한함으로써 기본권 경합을 야기한다.","a":"O","e":"심판대상조항은 신탁회사 및 신탁업자의 영업의 자유와 신탁계약의 당사자인 위탁자·수익자의 계약의 자유를 각각 제한하여 기본권 경합을 야기하나, 과잉금지원칙에 위배되지 않아 합헌이다.","c":"헌재 2018.3.29. 2016헌바468","o":25},{"id":"c1-020","no":"020","src":"d1","part":"본문","sec":"정당의 자유","tag":"합헌·기각","q":"① 등록을 정당의 설립요건으로 정한 것 ② 정당방상 등록된 정당이 아니면 정당이라는 명칭을 사용하지 못하게 하는 정당명칭사용금지조항 ③ 정당은 수도에 소재하는 중앙당과 5 이상의 특별시·광역시·도에 각각 소재하는 시·도당을 갖추어야 한다고 정한 것 ④ 시·도당은 1천인 이상의 당원을 가져야 한다고 정한 것은 헌법에 위반된다.","a":"X","e":"정당의 등록·명칭·조직 요건은 정당의 난립을 방지하고 정당의 조직과 활동을 민주적으로 보장하기 위한 것으로, 결사의 자유나 정당활동의 자유를 침해한다고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.9.26. 2021헌가23 등","o":26},{"id":"c1-021","no":"021","src":"d1","part":"본문","sec":"지방자치","tag":"","q":"감사대상의 확장 내지 추가가 허용된다.","a":"O","e":"광역자치단체의 기초자치단체에 대한 자치사무 감사에서 감사대상의 확장 내지 추가는 허용된다고 보아야 한다.","c":"헌재 2023.3.23. 2020헌바5","o":27},{"id":"c1-022","no":"022","src":"d1","part":"본문","sec":"지방자치","tag":"","q":"광역자치단체가 기초자치단체의 자치사무에 대한 감사에 착수하기 위해서는 감사대상을 특정하여야 하며, 특정된 감사대상을 사전에 통보할 것까지 요구된다고 볼 수는 없다.","a":"O","e":"감사 착수에 감사대상의 특정은 필요하지만, 특정된 감사대상을 사전에 통보할 것까지 요구된다고 볼 수는 없다.","c":"헌재 2023.3.23. 2020헌바5","o":28},{"id":"c1-022V","no":"022-2","src":"d1","part":"변형","sec":"지방자치","tag":"변형지문","q":"광역자치단체 B가 기초자치단체 A의 자치사무에 대한 감사에 착수하기 위해서는 감사대상을 특정하고, 특정된 감사대상을 A에게 사전 통보해야 한다.","a":"X","e":"감사 착수에는 감사대상의 특정이 필요하지만, 특정된 감사대상을 사전에 통보할 것까지 요구된다고 볼 수는 없다(원자료 표시 (×)).","c":"헌재 2023.3.23. 2020헌바5","o":29},{"id":"c1-023","no":"023","src":"d1","part":"본문","sec":"지방자치","tag":"","q":"개정된 구 「지방자치법」의 취지와 공유수면과 매립지의 성질상 차이 등을 종합하여 볼 때, 신생 매립지는 구 「지방자치법」 제4조 제3항에 따라 같은 조 제1항이 처음부터 배제되어 종전의 관할구역의 연관성이 단절되고, 행정자치부장관의 결정이 확정됨으로써 비로소 관할 지방자치단체가 정해지며, 그 전까지 해당 매립지는 어느 지방자치단체에도 속하지 않는다.","a":"O","e":"신생 매립지는 종전 관할구역과의 연관성이 단절되어 어느 지방자치단체에도 속하지 않고, 행정자치부장관의 결정이 확정됨으로써 비로소 관할 지방자치단체가 정해진다.","c":"헌재 2024.3.28. 2021헌바57","o":30},{"id":"c1-024","no":"024","src":"d1","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"위헌","q":"임신 32주 이전에 태아의 성별을 고지하는 것을 금지하는 의료법 조항은 낙태로 나아갈 의도가 없는 부모까지 규제하여 기본권을 제한하는 과도한 입법으로 인권을 침해한다.","a":"O","e":"태아의 성별 고지 금지는 태아의 생명 보호라는 목적의 정당성은 인정되나, 태아의 생명을 위협하는 행위를 방지하는 데 필요한 범위를 넘어 성별 고지를 일률적으로 금지하여 침해의 최소성과 법익의 균형성을 상실하였으므로 임신부와 그 배우자의 자기결정권 등 인권을 침해한다.","c":"헌재 2024.2.28. 2022헌바356 등","o":31},{"id":"c1-024V","no":"024-2","src":"d1","part":"변형","sec":"인간의 존엄과 가치·행복추구권","tag":"변형지문","q":"태아의 성별고지 행위는 그 자체로 태아를 포함하여 누구에게도 해가 되는 행위가 아니지만, 보다 풍요롭고 행복한 가족생활을 영위하도록 하기 위해 진료과정에서 얻게 된 태아에 대한 성별정보를 낙태방지를 위하여 임신 32주 이전에는 고지하지 못하도록 금지하여야 할 이유가 있다.","a":"X","e":"태아의 성별 고지를 임신 32주 이전에 일률적으로 금지하는 것은 낙태로 나아갈 의도가 없는 부모까지 규제하는 과도한 입법으로서 기본권을 침해한다. 즉 금지하여야 할 이유가 있다고 볼 수 없다(원자료 표시 (×)).","c":"헌재 2024.2.28. 2022헌바356 등","o":32},{"id":"c1-025","no":"025","src":"d1","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"기각","q":"어린이 보호구역에서 제한속도 준수의무 또는 안전운전의무를 위반하여 어린이를 상해에 이르게 한 경우 1년 이상 15년 이하의 징역 또는 500만 원 이상 3천만 원 이하의 벌금에, 사망에 이르게 한 경우 무기 또는 3년 이상의 징역에 처하도록 한 '특정범죄 가중처벌 등에 관한 법률' 제5조의13은 명확성원칙에 위배되지 않고, 운전자의 일반적 행동자유권을 제한하지만 침해하지 않는다.","a":"O","e":"구성요건이 충분히 명확하고, 어린이의 생명·신체를 보호하기 위한 입법목적의 정당성과 수단의 적합성이 인정되며 침해의 최소성과 법익의 균형성도 갖추었으므로 일반적 행동자유권을 침해하지 않는다.","c":"헌재 2023.3.23. 2020헌바460 등","o":33},{"id":"c1-025V","no":"025-2","src":"d1","part":"변형","sec":"인간의 존엄과 가치·행복추구권","tag":"변형지문","q":"어린이 보호구역에서 제한속도 준수의무 또는 안전운전의무를 위반하여 어린이를 상해에 이르게 한 경우 1년 이상 15년 이하의 징역 또는 500만 원 이상 3천만 원 이하의 벌금에, 사망에 이르게 한 경우 무기 또는 3년 이상의 징역에 처하도록 한 '특정범죄 가중처벌 등에 관한 법률' 제5조의13은 운전자의 일반적 행동자유권을 침해한다.","a":"X","e":"명확성원칙에 위배되지 않고, 일반적 행동자유권을 제한하지만 과잉금지원칙에 위배되어 침해한다고 볼 수 없다(원자료 표시 (×)).","c":"헌재 2023.3.23. 2020헌바460 등","o":34},{"id":"c1-026","no":"026","src":"d1","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"합헌","q":"음주운전 금지규정을 위반한 사람이 다시 이를 위반하여 운전면허 정지 사유에 해당된 경우 운전면허를 필요적으로 취소하도록 규정한 구 도로교통법 규정은 일반적 행동자유권 및 직업의 자유를 제한하지만 침해하지 않고, 평등원칙에도 위배되지 않는다.","a":"O","e":"음주운전의 위험성과 재범 위험에 비추어 필요적 취소는 입법목적에 부합하고 침해의 최소성·법익의 균형성을 갖추었으며, 다른 위반행위와의 차별에도 합리적 이유가 있어 평등원칙에 위배되지 않는다.","c":"헌재 2023.6.29. 2020헌바182 등","o":35},{"id":"c1-027","no":"027","src":"d1","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"합헌","q":"후천성면역결핍증(에이즈) 감염인이 혈액이나 체액으로 다른 사람에게 전파매개행위를 하는 것을 금지하고 이를 위반한 자를 3년 이하의 징역에 처하도록 한 「후천성면역결핍증 예방법」 조항은 감염인의 사생활의 비밀과 자유 및 일반적 행동자유권을 제한하지만 침해하지 않고, 명확성원칙에도 위배되지 않는다.","a":"O","e":"에이즈의 감염 경로와 치명성 등에 비추어 타인의 생명·신체를 보호하기 위한 전파매개행위 금지는 입법목적의 정당성과 수단의 적합성이 있고, 침해의 최소성과 법익의 균형성을 갖추어 기본권을 침해하지 않으며 그 구성요건도 명확하다.","c":"헌재 2023.10.26. 2019헌가30","o":36},{"id":"c1-027V1","no":"027-2","src":"d1","part":"변형","sec":"인간의 존엄과 가치·행복추구권","tag":"변형지문","q":"의료인이 자신의 환자에게 후천성면역결핍증(에이즈)을 감염시키지 않기 위한 정당한 방어조치를 취하지 아니한 채 진료행위를 한 경우에만 처벌하고, 성적 접촉 등 다른 전파 경로로 감염시키는 행위는 처벌하지 않는 것은 전파매개행위 금지조항의 내용이 지나치게 협소하여 감염인의 기본권을 침해한다.","a":"X","e":"전파매개행위 금지조항은 감염인 자신뿐 아니라 타인의 생명·신체를 보호하기 위한 것으로 그 내용이 협소하여 기본권을 침해한다고 볼 수 없다(원자료 표시 (×)).","c":"헌재 2023.10.26. 2019헌가30","o":37},{"id":"c1-027V2","no":"027-3","src":"d1","part":"변형","sec":"인간의 존엄과 가치·행복추구권","tag":"변형지문","q":"후천성면역결핍증(에이즈) 감염인이 전파매개행위를 하여 타인을 감염시킨 경우 3년 이하의 징역에 처하도록 한 「후천성면역결핍증 예방법」 조항에 대하여 헌법재판소는 감염인의 사생활의 비밀과 자유를 과도하게 제한하여 헌법에 위반된다고 결정하였다.","a":"X","e":"감염인의 사생활의 비밀과 자유 및 일반적 행동자유권을 제한하지만 침해하지 않는다고 보아 합헌결정을 하였다(원자료 표시 (×)).","c":"헌재 2023.10.26. 2019헌가30","o":38},{"id":"c1-028","no":"028","src":"d1","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"기각","q":"단기법무장교의 의무복무기간을 장교에 임용된 날부터 기산하도록 한 것은 단기법무장교의 일반적 행동자유권 및 평등권을 침해하지 않는다.","a":"O","e":"의무복무기간의 기산점을 임용일로 정한 것은 군법무관의 복무 확보를 위한 것으로 합리적 이유가 있어 일반적 행동자유권이나 평등권을 침해하지 않는다.","c":"헌재 2024.3.28. 2020헌마1401 등","o":39},{"id":"c1-029","no":"029","src":"d1","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"합헌","q":"학원의 교습비 등 반환사유 및 반환금액을 정한 「학원의 설립·운영 및 과외교습에 관한 법률」 제18조 제1항 교육비 반환조항은 학원설립·운영자의 계약의 자유를 제한하지만 침해하지 않는다.","a":"O","e":"학습자의 보호를 위하여 반환사유와 반환금액을 정한 것은 입법목적의 정당성과 수단의 적합성이 인정되고, 침해의 최소성과 법익의 균형성도 갖추어 계약의 자유를 침해하지 않는다.","c":"헌재 2021헌바74","o":40},{"id":"c1-029V","no":"029-2","src":"d1","part":"변형","sec":"인간의 존엄과 가치·행복추구권","tag":"변형지문","q":"학원의 교습비 등 반환사유 및 반환금액을 정한 「학원의 설립·운영 및 과외교습에 관한 법률」 제18조 제1항 교육비 반환조항은 학원설립·운영자의 계약의 자유를 과도하게 제한하여 침해한다.","a":"X","e":"계약의 자유를 제한하지만 학습자 보호라는 공익에 비추어 침해의 최소성과 법익의 균형성을 갖추었으므로 침해한다고 볼 수 없다(원자료 표시 (×)).","c":"헌재 2021헌바74","o":41},{"id":"c1-030","no":"030","src":"d1","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"합헌","q":"근로계약을 체결할 때에 근로조건을 명시하도록 하고 이를 위반한 사용자를 500만 원 이하의 벌금에 처하도록 한 「근로기준법」 조항은 사용자의 계약의 자유와 직업의 자유를 제한하지만 침해하지 않는다.","a":"O","e":"근로조건의 명시를 통해 근로자의 권리를 보호하려는 입법목적의 정당성과 수단의 적합성이 있고, 침해의 최소성과 법익의 균형성도 갖추어 침해하지 않는다.","c":"헌재 2025.11.27. 2022헌바154","o":42},{"id":"c1-031","no":"031","src":"d1","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"합헌","q":"중대재해가 발생한 때에 사업주로 하여금 중대재해의 내용 등을 고용노동부장관에게 보고하도록 규정한 것은 사업주의 일반적 행동의 자유를 제한하지만 침해하지 않는다.","a":"O","e":"중대재해의 신속한 파악과 재발 방지를 위한 입법목적의 정당성과 수단의 적합성이 인정되고 침해의 최소성·법익의 균형성을 갖추었으므로 일반적 행동의 자유나 양심의 자유를 침해하지 않는다.","c":"헌재 2025.2.27. 2021헌바111","o":43},{"id":"c1-032","no":"032","src":"d1","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"합헌","q":"채무자가 이자제한법상 최고이자율을 초과하는 이자를 임의로 지급한 경우 그 초과부분은 원본에 충당되고 남은 금액이 있는 때에는 채권자에게 그 반환을 청구할 수 있도록 규정한 「이자제한법」 조항은 채권자의 계약의 자유와 재산권을 제한하지만 침해하지 않는다.","a":"O","e":"과도한 이자로부터 채무자를 보호하려는 입법목적의 정당성과 수단의 적합성이 인정되고, 초과이자의 반환을 허용하는 것이 침해의 최소성과 법익의 균형성을 갖추어 침해하지 않는다.","c":"헌재 2025.2.27. 2023헌바143","o":44},{"id":"c1-033","no":"033","src":"d1","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"합헌","q":"「금융실명거래 및 비밀보장에 관한 법률」상 법원의 제출명령에 따라 거래정보등을 알게 된 자는 그 알게 된 거래정보등을 그 목적 외의 용도로 이용하여서는 아니 된다고 규정한 것은 그 자의 일반적 행동자유권을 제한하지만 침해하지 않는다.","a":"O","e":"금융거래정보의 목적 외 이용을 금지함으로써 정보주체의 프라이버시와 거래의 안전을 보호하려는 것으로, 일반적 행동자유권을 제한하지만 과잉금지원칙에 위배되어 침해한다고 볼 수 없다.","c":"헌재 2025.4.10. 2019헌바519","o":45},{"id":"c1-034","no":"034","src":"d1","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"기각","q":"후보자 등록 신청 시 벌금 100만 원 이상의 범죄경력을 제출하도록 하는 관련규정은 후보자의 인격권과 개인정보자기결정권을 제한하지만 침해하지 않는다.","a":"O","e":"유권자의 알권리와 후보자 검증이라는 공익에 비추어 후보자의 인격권·개인정보자기결정권을 제한하지만 침해의 최소성과 법익의 균형성을 갖추어 침해하지 않는다.","c":"헌재 2025.9.25. 2021헌마356","o":46},{"id":"c1-035","no":"035","src":"d1","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"기각","q":"장성급 지휘권은 장교의 외출·외박 지역을 제한할 수 있다고 규정한 것은 장교의 일반적 행동의 자유 및 거주·이전의 자유를 제한하지만 침해하지 않는다.","a":"O","e":"군의 지휘체계와 부대 관리의 필요성에 비추어 외출·외박 지역을 제한하는 것은 필요한 범위 내의 것으로 기본권을 침해하지 않는다.","c":"헌재 2025.11.27. 2021헌마1280","o":47},{"id":"c1-036","no":"036","src":"d1","part":"본문","sec":"평등권","tag":"위헌","q":"내국인 근로자의 사망으로 인한 유족급여·장의비를 받을 수 있는 유족의 범위와 관련하여 국내에 거주하는 외국인 유족은 원칙적으로 제외하고, 국내에 거주하지 아니하는 외국인 유족 중 일정한 자만 포함하는 것은 평등원칙에 위반된다.","a":"O","e":"외국인 근로자와 내국인 근로자의 유족은 근로자의 사망이라는 점에서 동일한 비교집단에 속함에도, 국내 거주 여부에 따라 유족급여 수급권을 달리 취급하는 것은 합리적 이유가 없는 차별로서 평등원칙에 위반된다(심사기준: 자의금지원칙).","c":"헌재 2023.3.23. 2020헌바471","o":48},{"id":"c1-037","no":"037","src":"d1","part":"본문","sec":"평등권","tag":"위헌","q":"특별교통수단에 있어서 표준휠체어만을 기준으로 휠체어 고정설비의 안전기준을 정하고 있는 것은 합리적 이유 없이 표준휠체어를 이용할 수 있는 장애인과 표준휠체어를 이용할 수 없는 장애인을 달리 취급하여 평등권을 침해한다.","a":"O","e":"비장애인과 장애인, 표준휠체어 이용 장애인과 비표준휠체어 이용 장애인은 특별교통수단 이용에 관한 한 본질적으로 동일한 집단임에도 표준휠체어만을 기준으로 안전기준을 정하여 비표준휠체어 이용 장애인의 이동권을 사실상 박탈하는 것은 합리적 이유 없는 차별이다(심사기준: 자의금지원칙).","c":"헌재 2023.5.25. 2019헌마1234","o":49},{"id":"c1-038","no":"038","src":"d1","part":"본문","sec":"평등권","tag":"위헌","q":"구 「군사법원법」상 비용보상청구권의 제척기간을 무죄판결이 확정된 날부터 6개월 이내로 규정한 것은 헌법에 위반된다.","a":"O","e":"무죄판결을 받은 피고인이 비용보상을 청구할 수 있는 기간을 확정일부터 6개월로 짧게 제한하면 권리구제의 실효성이 상실되므로, 재판청구권(내지 평등권)을 침해하여 헌법에 위반된다. 헌법재판소는 5인의 평등권 침해 의견과 함께 이 조항의 위헌성을 지적하였다.","c":"헌재 2023.8.31. 2020헌바252","o":50},{"id":"c1-039","no":"039","src":"d1","part":"본문","sec":"평등권","tag":"헌재판례","q":"내국인등과 달리 보험료 납부단위인 '세대'의 인정범위를 가입자와 그의 배우자 및 미성년 자녀로 한정한 것은 외국인들의 평등권을 침해하지 않지만, 내국인등과 달리 보험료를 체납한 경우에는 다음 달부터 공고로 보험급여를 제한하는 것은 외국인들의 평등권을 침해한다.","a":"O","e":"세대의 인정범위를 한정한 부분은 외국인의 생활관계의 특수성을 고려한 것으로 합리적 이유가 있으나, 내국인과 달리 1회의 체납만으로 다음 달부터 공고로 보험급여를 제한하는 것은 체납 횟수·금액·경제적 사정을 전혀 고려하지 않은 것으로 합리적 이유 없는 차별이다.","c":"헌재 2023.9.26. 2019헌마1165","o":51},{"id":"c1-039V","no":"039-2","src":"d1","part":"변형","sec":"평등권","tag":"변형지문","q":"보험료 체납 횟수와 경제적 사정 등을 전혀 고려하지 않고 예외 없이 1회의 보험료 체납만으로도 보험급여를 제한하고 있는 것은 외국인 지역가입자의 평등권을 합리적 이유 없이 침해한다.","a":"O","e":"내국인에게는 체납 후 일정한 유예를 두고 공고하도록 하면서 외국인에게는 1회 체납만으로 다음 달부터 급여를 제한하는 것은 합리적 이유 없는 차별로서 평등권을 침해한다(원자료 표시 (○)).","c":"헌재 2023.9.26. 2019헌마1165","o":52},{"id":"c1-040","no":"040","src":"d1","part":"본문","sec":"평등권","tag":"인용(위헌)","q":"외국인만으로 구성된 가구 중 영주권자 및 결혼이민자만을 긴급재난지원금 지급대상에 포함시키고 난민인정자를 제외한 것은 난민인정자인 청구인들의 평등권을 침해한다.","a":"O","e":"난민인정자는 대한민국에서의 생활의 근거를 두고 있는 점에서 영주권자·결혼이민자와 본질적으로 같으므로, 이들을 지급대상에서 제외하는 것은 합리적 이유 없는 차별로서 평등권을 침해한다.","c":"헌재 2024.3.28. 2020헌마1079","o":53},{"id":"c1-041","no":"041","src":"d1","part":"본문","sec":"평등권","tag":"헌법불합치","q":"분할연금 지급사유가 발생한 날부터 분할연금을 지급하도록 경과규정을 둠으로써, 개정 전에 이혼한 배우자에게는 분할연금을 지급하지 않게 된 부분은 합리적 이유 없는 차별로서 평등원칙에 위반된다.","a":"O","e":"개정법 시행 전에 이혼한 배우자는 분할연금을 받을 수 없게 되어, 시행 후 이혼한 배우자와 합리적 이유 없이 차별받게 되므로 평등원칙에 위반된다. 국회는 개정 전에 이혼한 배우자에게도 분할연금을 지급하는 내용으로 법을 개정하여야 한다.","c":"헌재 2024.5.30. 2019헌가29","o":54},{"id":"c1-042","no":"042","src":"d1","part":"본문","sec":"평등권","tag":"헌법불합치","q":"병원, 치과병원, 종합병원과 달리 정신병원에 대하여 한의사를 두어 한의과 진료과목을 추가로 설치·운영할 수 있는 규정을 두지 아니한 것은 정신병원 개설자의 평등권을 침해한다.","a":"O","e":"정신병원도 한의과 진료가 가능한 의료기관임에도 다른 병원들과 달리 한의사 배치·한의과 진료과목 개설을 허용하지 않는 것은 합리적 이유 없는 차별이다.","c":"헌재 2025.1.23. 2021헌마886","o":55},{"id":"c1-043","no":"043","src":"d1","part":"본문","sec":"평등권","tag":"헌법불합치","q":"국가유공자의 유족 중 보상을 받을 자녀의 순위를 정함에 있어 협의로 지정되거나 주로 부양한 자녀가 없는 경우 나이가 많은 자녀를 선순위 유족으로 정하는 국가유공자법 제13조 제2항 제3호 전단 중 '자녀 중 나이가 많은 사람을 선순위자로 정하는 부분'은 평등원칙에 위반되지 않는다.","a":"X","e":"나이만을 기준으로 선순위 유족을 정하면 자녀들 사이의 부양·간병 등 실질적 기여를 반영하지 못하여, 합리적 이유 없는 차별로서 평등원칙에 위반된다(원자료 결론은 '위반된다').","c":"헌재 2025.4.10. 2024헌가12 등","o":56},{"id":"c1-044","no":"044","src":"d1","part":"본문","sec":"평등권","tag":"합헌","q":"우편을 이용한 접근금지를 피해자보호명령에 포함시키지 아니한 구 「가정폭력범죄의 처벌 등에 관한 특례법」 제55조의2 제1항은 가정폭력 피해자의 평등권을 침해한다.","a":"X","e":"입법자는 피해자 보호의 방법과 범위를 형성할 재량이 있고, 우편을 이용한 접근금지를 포함하지 않았다고 하여 피해자를 합리적 이유 없이 차별한다고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.2.23. 2019헌바43","o":57},{"id":"c1-045","no":"045","src":"d1","part":"본문","sec":"평등권","tag":"기각","q":"집합제한 조치로 발생한 손실을 보상하는 규정을 두지 않은 구 「감염병의 예방 및 관리에 관한 법률」 규정은 집합제한 조치를 받은 사람들의 평등권을 침해하지 않는다.","a":"O","e":"집합제한 조치는 감염병 확산 방지를 위한 것이고, 그로 인한 손실에 대한 보상 여부는 입법자가 형성할 사항으로, 보상규정이 없다고 하여 합리적 이유 없는 차별이라고 볼 수 없다.","c":"헌재 2023.6.29. 2020헌마1669","o":58},{"id":"c1-045V","no":"045-2","src":"d1","part":"변형","sec":"평등권","tag":"변형지문","q":"집합제한 조치로 발생한 손실을 보상하는 규정을 두지 않은 구 「감염병의 예방 및 관리에 관한 법률」 규정은 집합제한 조치를 받은 사람들의 평등권을 침해한다.","a":"X","e":"보상규정을 두지 않았다고 하여 합리적 이유 없는 차별로 볼 수 없으므로 평등권을 침해하지 않는다(원자료 표시 (×)).","c":"헌재 2023.6.29. 2020헌마1669","o":59},{"id":"c1-046","no":"046","src":"d1","part":"본문","sec":"평등권","tag":"기각","q":"집합금지조치로 인한 손실을 보상하는 규정을 두고 있지 않은 구 「감염병의 예방 및 관리에 관한 법률」 제70조 제1항은 실내체육시설을 운영하는 청구인들의 평등권을 침해한다.","a":"X","e":"집합금지조치는 감염병 확산 방지를 위한 불가피한 조치이고, 그 손실보상 여부는 입법형성의 범위에 속하므로 평등권 침해라고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.8.29. 2021헌마175","o":60},{"id":"c1-047","no":"047","src":"d1","part":"본문","sec":"평등권","tag":"기각","q":"동물약국 개설자가 수의사 또는 수산질병관리사의 처방전 없이 판매할 수 없는 동물용의약품을 규정한 조항이 동물약국 개설자의 직업수행의 자유를 침해하는지 여부를 판단하는 이상, 평등권 침해 여부에 관하여는 따로 판단하지 아니하였다.","a":"O","e":"동물약국 개설자의 직업수행의 자유 침해 여부를 판단한 이상, 평등권 침해 여부는 별도로 판단하지 않는다.","c":"헌재 2023.6.29. 2021헌마199","o":61},{"id":"c1-048","no":"048","src":"d1","part":"본문","sec":"평등권","tag":"기각","q":"내국인 및 영주(F-5)·결혼이민(F-6)의 체류자격을 가진 외국인과 달리 외국인 지역가입자에 대하여 납부할 월별 보험료의 하한을 전년도 전체 가입자의 평균을 고려하여 정하는 것은 외국인 지역가입자의 평등권을 침해하지 않는다.","a":"O","e":"체류자격에 따라 소득 파악이 어려운 외국인 지역가입자에게 보험료 하한을 두는 것은 보험재정의 건전성과 형평을 위한 것으로 합리적 이유가 있다.","c":"헌재 2023.9.26. 2019헌마1165","o":62},{"id":"c1-048V","no":"048-2","src":"d1","part":"변형","sec":"평등권","tag":"변형지문","q":"내국인 및 영주(F-5)·결혼이민(F-6)의 체류자격을 가진 외국인과 달리 외국인 지역가입자에 대하여 납부할 월별 보험료의 하한을 전년도 전체 가입자의 평균을 고려하여 정하는 것은 외국인 지역가입자의 평등권을 침해한다.","a":"X","e":"체류자격에 따라 소득 파악이 어려운 점을 고려한 것으로 합리적 이유가 있어 평등권을 침해하지 않는다(원자료 표시 (×)).","c":"헌재 2023.9.26. 2019헌마1165","o":63},{"id":"c1-049","no":"049","src":"d1","part":"본문","sec":"평등권","tag":"합헌","q":"행정소송은 진정한 권리자의 이익보다 거래안전을 우선시하기 위한 사정판결 등의 제도를 갖추고 있는 등 확정판결에 대한 법적 안정성이 강하게 요구되므로, 형사소송과 마찬가지로 재심 제기기간을 30일로 한 것이 합리적인 이유 없는 자의적인 입법이라고 할 수 없다.","a":"O","e":"행정소송의 특성상 확정판결의 법적 안정성이 강하게 요구되므로 재심 제기기간을 30일로 정한 것이 자의적 입법이라고 볼 수 없어 평등원칙에 위배되지 않는다.","c":"헌재 2023.9.26. 2020헌마258","o":64},{"id":"c1-049V","no":"049-2","src":"d1","part":"변형","sec":"평등권","tag":"변형지문","q":"형사소송과 달리 행정소송의 재심 제기기간을 30일로 정한 것은 행정소송에서 패소한 원고들을 합리적 이유 없이 차별하는 것으로서 평등원칙에 위배된다.","a":"X","e":"행정소송의 특성상 확정판결의 법적 안정성이 강하게 요구되므로 자의적 입법이라고 볼 수 없어 평등원칙에 위배되지 않는다(원자료 표시 (×)).","c":"헌재 2023.9.26. 2020헌마258","o":65},{"id":"c1-050","no":"050","src":"d1","part":"본문","sec":"평등권","tag":"합헌","q":"전기판매사업자에게 약관의 명시·교부의무를 면제한 '약관의 규제에 관한 법률' 해당 조항 중 '전기사업'에 관한 부분은 일반 사업자와 달리 전기판매사업자에 대하여 약관의 명시·교부의무를 면제하고 있더라도 평등원칙에 위배되지 아니한다.","a":"O","e":"전기사업의 공익성과 공급약관의 공표·인가 절차 등에 비추어 전기판매사업자에 대한 차별은 합리적 이유가 있다.","c":"헌재 2024.4.25. 2022헌바65","o":66},{"id":"c1-051","no":"051","src":"d1","part":"본문","sec":"평등권","tag":"합헌","q":"국가·지방자치단체·공공기관이 시행하는 개발사업과 달리 학교법인이 시행하는 개발사업은 그 일체를 개발부담금의 제외 또는 경감 대상으로 규정하지 않은 것은 평등원칙에 위반되지 않는다.","a":"O","e":"학교법인이 시행하는 개발사업이라고 하여 국가 등이 시행하는 사업과 반드시 동일하게 취급하여야 하는 것은 아니므로, 개발부담금의 제외·경감 대상에서 제외하였다고 하여 평등원칙에 위반된다고 볼 수 없다.","c":"헌재 2024.5.30. 2020헌바179","o":67},{"id":"c1-051V","no":"051-2","src":"d1","part":"변형","sec":"평등권","tag":"변형지문","q":"국가·지방자치단체·공공기관이 시행하는 개발사업과 달리 학교법인이 시행하는 개발사업은 그 일체를 개발부담금의 제외 또는 경감 대상으로 규정하지 않은 것은 평등원칙에 위반된다.","a":"X","e":"학교법인이 시행하는 개발사업을 국가 등이 시행하는 사업과 동일하게 취급하여야 하는 것은 아니므로 평등원칙에 위반되지 않는다(원자료 표시 (×)).","c":"헌재 2024.5.30. 2020헌바179","o":68},{"id":"c1-052","no":"052","src":"d1","part":"본문","sec":"평등권","tag":"합헌","q":"도시개발법상 도시개발사업 등에 대해서는 사업시행 결과 사업구역 내 가구 수가 증가하지 아니하는 경우 학교용지부담금을 부과하지 않으면서, 주택법에 따른 주택건설사업에 대해서는 가구 수 증가와 상관없이 개발사업의 결과로 지어지는 전체 가구 수에 대하여 학교용지부담금을 부과하는 구 '학교용지 확보 등에 관한 특례법' 제5조 제1항 단서는 평등원칙에 위반되지 않는다.","a":"O","e":"주택건설사업은 그 결과 신규 취학수요가 발생하는 점에서 도시개발사업 등과 본질적으로 다르므로, 이를 달리 취급하더라도 합리적 이유가 있다.","c":"헌재 2025.4.10. 2020헌마363 등","o":69},{"id":"c1-053","no":"053","src":"d1","part":"본문","sec":"평등권","tag":"합헌","q":"성폭력범죄 피해자가 국민참여재판을 원하지 아니하는 경우 법원이 국민참여재판 배제결정을 할 수 있도록 규정한 '국민의 형사재판 참여에 관한 법률' 제9조 제1항 제3호는 평등원칙에 위배되지 않고, 적법절차원칙에도 위배되지 않는다.","a":"O","e":"피해자의 의사를 고려한 배제결정은 피해자 보호를 위한 것으로 합리적 이유가 있고, 절차적 정당성도 갖추어 적법절차원칙에 위배되지 않는다.","c":"헌재 2025.2.27. 2023헌바155","o":70},{"id":"c1-054","no":"054","src":"d1","part":"본문","sec":"평등권","tag":"기각","q":"공무원 재직 중 음주운전으로 형사 처분을 받은 자를 퇴직공무원 포상 추천에서 제외하도록 한 것은 평등권을 침해한다.","a":"X","e":"포상은 공적에 대한 예우로서 그 추천 기준을 정하는 것은 입법형성의 범위에 속하고, 음주운전으로 처벌받은 자를 제외하더라도 합리적 이유 없는 차별이라고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2025.2.27. 2021헌마1414","o":71},{"id":"c1-055","no":"055","src":"d1","part":"본문","sec":"평등권","tag":"합헌","q":"농협법 제49조 제1항 제8호에 규정된 죄와 다른 죄의 경합범에 대하여 분리 선고하도록 규정한 것은 평등원칙에 위배되지 않는다.","a":"O","e":"조합의 민주적 운영과 선거의 공정성을 확보하기 위한 것으로, 다른 죄와 분리하여 선고하도록 한 데에 합리적 이유가 있다.","c":"헌재 2025.1.23. 2021헌바268","o":72},{"id":"c1-056","no":"056","src":"d1","part":"본문","sec":"평등권","tag":"합헌","q":"일정한 법무법인으로 하여금 변리사 업무를 수행할 수 있도록 한 변호사법 규정은 평등원칙에 위배되지 않는다.","a":"O","e":"법무법인의 규모·전문성 등에 비추어 일정한 요건을 갖춘 법무법인에 변리사 업무를 허용하는 것은 합리적 이유가 있다.","c":"헌재 2025.1.23. 2022헌바61","o":73},{"id":"c1-057","no":"057","src":"d1","part":"본문","sec":"평등권","tag":"기각","q":"정부조직법에 따른 각급 행정기관의 근로자가 가구원인 경우 해당 가구의 경리자를 생활지원비 지원제외 대상으로 정한 코로나19 관련 규정은 평등권을 침해한다.","a":"X","e":"공무원 등 안정적인 소득이 있는 가구를 지원에서 제외하는 것은 지원의 필요성과 재정 여건을 고려한 것으로 합리적 이유가 있다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.8.29. 2021헌마450","o":74},{"id":"c1-058","no":"058","src":"d1","part":"본문","sec":"평등권","tag":"합헌","q":"구성원의 필요적 해임사유를 규정하지 않은 '자원봉사활동 기본법', '새마을운동조직 육성법', '대한적십자사 조직법'에 따른 각 구성원은 의용소방대원과는 평등원칙과 관련하여 비교집단에 해당한다고 볼 수 없다.","a":"O","e":"각 구성원과 의용소방대원은 조직의 성격과 업무의 위험성 등이 달라 본질적으로 동일한 집단이라고 볼 수 없으므로, 비교집단이 될 수 없다.","c":"헌재 2025.7.17. 2021헌바345","o":75},{"id":"c1-059","no":"059","src":"d1","part":"본문","sec":"적법절차원칙","tag":"헌법불합치","q":"강제퇴거명령을 받은 사람을 보호할 수 있도록 하면서 보호기간의 상한을 마련하지 아니한 「출입국관리법」 조항은 보호의 개시 또는 연장 단계에서 그 집행기관인 출입국관리공무원으로부터 독립되고 중립적인 지위에 있는 기관이 보호의 타당성을 심사하여 이를 통제할 수 있어야 한다는 헌법적 요청에 부합하지 아니하여 신체의 자유를 침해한다.","a":"O","e":"보호기간의 상한 없이 보호를 허용하면 신체의 자유의 제한이 무한정 계속될 수 있으므로, 독립·중립적인 기관의 심사·통제를 마련하여야 한다. 헌법재판소는 헌법불합치결정을 하였다.","c":"헌재 2023.3.23. 2020헌가1 등","o":76},{"id":"c1-060","no":"060","src":"d1","part":"본문","sec":"적법절차원칙","tag":"합헌","q":"구 '도시 및 주거환경정비법' 조항이 정비예정구역 내 토지 등 소유자의 100분의 30 이상의 해제요청이라는 비교적 완화된 요건만으로 정비예정구역 해제절차에 나아갈 수 있도록 하였다고 하여 적법절차원칙에 위반된다고 보기는 어렵다.","a":"O","e":"정비예정구역의 해제는 주민의 재산권 보호를 위한 것으로, 100분의 30 이상의 요청이라는 요건은 절차적 정당성을 갖춘 것으로 적법절차원칙에 위반된다고 보기 어렵다.","c":"헌재 2023.6.29. 2020헌바63","o":77},{"id":"c1-061","no":"061","src":"d1","part":"본문","sec":"적법절차원칙","tag":"기각","q":"치료감호의 가종료 시 3년의 보호관찰이 시작되도록 한 '치료감호 등에 관한 법률' 조항은 적법절차원칙에 반하여 재판청구권을 침해한다.","a":"X","e":"가종료와 동시에 3년의 보호관찰이 시작되도록 한 것은 피치료감호자의 재사회화와 사회 보호를 위한 것으로, 적법절차원칙에 반하여 재판청구권을 침해한다고 볼 수 없다(원자료 결론은 '침해하지 않는다').","c":"헌재 2023.10.26. 2021헌마839","o":78},{"id":"c1-062","no":"062","src":"d1","part":"본문","sec":"적법절차원칙","tag":"기각","q":"헌법 해석상 변호인의 조력을 받을 권리로부터 70세 이상인 불복속 피의자에 대하여 피의자 신문을 할 때 법률구조제도에 대한 안내 등을 통해 피의자가 변호인의 조력을 받을 권리를 행사하도록 조치할 법무부장관의 작위의무가 곧바로 도출된다고 볼 수 없다.","a":"O","e":"입법자는 국선변호인 선정 등 변호인 조력의 구체적 내용을 형성할 재량이 있고, 헌법 해석상 위와 같은 작위의무가 곧바로 도출된다고 볼 수 없다.","c":"헌재 2023.2.23. 2020헌마1030","o":79},{"id":"c1-063","no":"063","src":"d1","part":"본문","sec":"변호인의 조력을 받을 권리","tag":"기각","q":"코로나19 관련 교도소장이 미결수용자인 청구인과 변호인의 접견을 일반접견실에서 실시하도록 한 행위는 변호인의 조력을 받을 권리를 제한하지만 침해하지 않는다.","a":"O","e":"감염병 확산 방지를 위한 조치로서 접견 자체를 금지한 것이 아니라 일반접견실에서 실시하도록 한 것이므로, 변호인의 조력을 받을 권리를 제한하지만 침해의 최소성과 법익의 균형성을 갖추어 침해하지 않는다.","c":"헌재 2021.12.27. 2021헌마1148","o":80},{"id":"c1-064","no":"064","src":"d1","part":"본문","sec":"변호인의 조력을 받을 권리","tag":"기각","q":"미결수용자가 가족과 접견하는 것은 헌법 제10조가 보장하는 인간으로서의 존엄과 가치 및 행복추구권에 포함되는 헌법상 기본권에 해당하며, 2020.12.8.부터 2021.1.15.까지 교도소장이 일반·화상접견을 제한한 행위는 접견교통권을 제한하지만 침해하지 않는다.","a":"O","e":"가족과의 접견은 인간의 존엄과 가치 및 행복추구권에서 도출되는 기본권이지만, 감염병 확산 방지를 위한 일시적 제한은 필요한 범위 내의 것으로 침해하지 않는다.","c":"헌재 2025.2.27. 2021헌마368","o":81},{"id":"c1-065","no":"065","src":"d1","part":"본문","sec":"신체의 자유","tag":"기각","q":"수형자가 민사재판에 출정하여 법정 대기실 내 쇠창살 격리실 안에 유치되어 있는 동안 교도소장이 출정계호·교도관을 통해 수형자에게 양손수갑 1개를 앞으로 사용한 행위는 수형자의 신체의 자유를 침해한다.","a":"X","e":"도주·자해 등의 위험을 방지하기 위한 계호로서 그 목적과 수단이 상응하고, 수갑 사용의 방법·시간 등에 비추어 필요한 범위를 넘지 않아 신체의 자유를 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.6.29. 2018헌마1215","o":82},{"id":"c1-066","no":"066","src":"d1","part":"본문","sec":"신체의 자유","tag":"합헌","q":"형법 제37조 후단 경합범에 관하여 노역장 유치명령을 선고함에 있어 판결이 확정된 죄와 동시에 재판받을 경우의 형평을 고려하여 노역장 유치기간의 하한에 관한 제한을 적용받지 않을 수 있도록 하는 예외조항을 두지 아니한 구 형법 제70조 제2항은 벌금 미납자의 신체의 자유를 침해하지 않는다.","a":"O","e":"노역장 유치기간의 하한을 두는 것은 형벌의 실효성을 확보하기 위한 것으로, 사후적 경합범에 대하여 예외를 두지 않았다고 하여 신체의 자유를 침해한다고 볼 수 없다.","c":"헌재 2025.2.27. 2024헌가8","o":83},{"id":"c1-067","no":"067","src":"d1","part":"본문","sec":"신체의 자유","tag":"합헌","q":"감염병예방법상 격리조치를 위반한 자를 1년 이하의 징역 또는 1천만 원 이하의 벌금에 처하도록 한 것은 격리 대상자의 신체의 자유를 제한하지만 침해하지 않는다.","a":"O","e":"감염병 확산 방지를 위한 격리조치는 입법목적의 정당성과 수단의 적합성이 있고, 위반에 대한 제재도 필요한 범위 내에 있어 신체의 자유를 침해하지 않는다(4인의 위헌의견이 있었다).","c":"헌재 2025.4.10. 2021헌바329","o":84},{"id":"c1-068","no":"068","src":"d1","part":"본문","sec":"신체의 자유","tag":"합헌","q":"폭력행위 등 처벌에 관한 법률상 수괴·간부 외의 사람으로서 그 구성원으로 활동한 사람을 2년 이상의 유기징역에 처하도록 한 조항은 헌법에 위반된다.","a":"X","e":"조직적 폭력범죄의 위험성과 그 구성원 활동의 의미에 비추어 법정형을 정한 것이 책임과 형벌 간의 비례원칙에 위배된다고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2025.6.27. 2024헌바210","o":85},{"id":"c1-069","no":"069","src":"d1","part":"본문","sec":"사생활의 비밀과 자유","tag":"기각","q":"교도소장이 수형자의 정신과진료 현장과 정신과 화상진료 현장에 각각 간호직교도관을 입회시킨 것은 수형자의 사생활의 비밀과 자유를 제한하지만 침해하지 않는다.","a":"O","e":"진료의 안전과 교정시설의 질서 유지를 위한 것으로, 간호직교도관의 입회는 필요한 최소한의 범위 내에 있어 사생활의 비밀과 자유를 침해하지 않는다.","c":"헌재 2024.1.25. 2020헌마1725","o":86},{"id":"c1-069V","no":"069-2","src":"d1","part":"변형","sec":"사생활의 비밀과 자유","tag":"변형지문","q":"교도소장이 수형자의 정신과진료 현장과 정신과 화상진료 현장에 각각 간호직교도관을 입회시킨 것은 수형자의 사생활의 비밀과 자유를 침해한다.","a":"X","e":"진료의 안전과 시설의 질서 유지를 위한 필요한 조치로서 사생활의 비밀과 자유를 제한하지만 침해한다고 볼 수 없다(원자료 표시 (×)).","c":"헌재 2024.1.25. 2020헌마1725","o":87},{"id":"c1-070","no":"070","src":"d1","part":"본문","sec":"사생활의 비밀과 자유","tag":"기각","q":"대체복무요원 생활관 내부의 공용공간에 CCTV를 설치하여 촬영하는 행위는 대체복무요원의 사생활의 비밀과 자유를 제한하지만 침해하지 않는다.","a":"O","e":"생활관의 공용공간은 사적인 공간이 아니고, 시설의 안전과 질서 유지를 위한 촬영으로 그 범위가 한정되어 있어 침해하지 않는다.","c":"헌재 2024.5.30. 2022헌마707 등","o":88},{"id":"c1-070V","no":"070-2","src":"d1","part":"변형","sec":"사생활의 비밀과 자유","tag":"변형지문","q":"대체복무요원 생활관 내부의 공용공간에 CCTV를 설치하여 촬영하는 행위는 대체복무요원의 사생활의 비밀과 자유를 침해한다.","a":"X","e":"공용공간에 대한 촬영은 사생활의 비밀과 자유를 제한하지만 침해한다고 볼 수 없다(원자료 표시 (×)).","c":"헌재 2024.5.30. 2022헌마707 등","o":89},{"id":"c1-071","no":"071","src":"d1","part":"본문","sec":"개인정보자기결정권","tag":"기각","q":"대한적십자사의 회비모금 목적으로 자료제공을 요청받은 국가와 지방자치단체는 특별한 사유가 없으면 그 자료를 제공하여야 한다고 규정한 '자료제공조항'과, 대한적십자사가 요청할 수 있는 자료로 세대주의 성명 및 주소를 규정한 것은 개인정보자기결정권을 제한하지만 침해하지 않는다.","a":"O","e":"적십자사의 인도주의 사업을 위한 최소한의 정보 제공으로서, 수집·이용되는 정보의 범위와 목적이 제한되어 있어 침해의 최소성과 법익의 균형성을 갖추었다.","c":"헌재 2023.2.23. 2019헌마1404 등","o":90},{"id":"c1-072","no":"072","src":"d1","part":"본문","sec":"개인정보자기결정권","tag":"기각","q":"개인정보 보호법상 재식별금지조항은 정보주체의 개인정보자기결정권을 침해한다.","a":"X","e":"가명정보의 재식별을 금지하는 것은 정보주체의 개인정보를 보호하기 위한 것으로, 개인정보자기결정권을 침해한다고 볼 수 없다(원자료 결론은 '침해하지 않는다').","c":"헌재 2023.10.26. 2020헌마1477 등","o":91},{"id":"c1-073","no":"073","src":"d1","part":"본문","sec":"개인정보자기결정권","tag":"기각","q":"통계작성, 과학적 연구, 공익적 기록보존 등을 위하여 정보주체의 동의 없이 가명정보를 처리할 수 있도록 한 것은 개인정보자기결정권을 침해한다.","a":"X","e":"가명처리를 전제로 하고, 처리 목적과 안전조치가 법률에 규정되어 있어 개인정보자기결정권을 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.10.26. 2020헌마1476","o":92},{"id":"c1-074","no":"074","src":"d1","part":"본문","sec":"개인정보자기결정권","tag":"기각","q":"혼인무효로 정정된 가족관계등록부의 재작성 신청을 제한하는 '가족관계등록부의 재작성에 관한 사무처리지침'은 청구인의 개인정보자기결정권을 침해한다.","a":"X","e":"가족관계등록부의 정정 기록을 보존하는 것은 등록부의 공신력과 법적 안정성을 위한 것으로, 개인정보자기결정권을 침해한다고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.1.25. 2020헌마65","o":93},{"id":"c1-074V1","no":"074-2","src":"d1","part":"변형","sec":"개인정보자기결정권","tag":"변형지문","q":"무효인 혼인의 기록사항 전체에 하나의 선을 긋고, 말소 내용과 사유를 각 해당 사항란에 기재하는 방식의 정정 표시는 청구인의 인격주체성을 식별할 수 있게 하는 개인정보에 해당하고, 이와 같은 정보를 보존하는 것은 개인정보자기결정권을 제한한다.","a":"O","e":"정정 표시 자체가 인격주체성을 식별할 수 있게 하는 개인정보에 해당하므로, 그 보존은 개인정보자기결정권을 제한한다(원자료 표시 (○)). 다만 그 제한이 침해인지는 별도로 판단한다.","c":"헌재 2024.1.25. 2020헌마65","o":94},{"id":"c1-074V2","no":"074-3","src":"d1","part":"변형","sec":"개인정보자기결정권","tag":"변형지문","q":"혼인무효로 정정된 가족관계등록부의 재작성 신청을 제한하는 것은 청구인의 개인정보자기결정권을 침해한다.","a":"X","e":"등록부의 공신력과 법적 안정성을 위한 것으로 개인정보자기결정권을 침해하지 않는다(원자료 표시 (×)).","c":"헌재 2024.1.25. 2020헌마65","o":95},{"id":"c1-075","no":"075","src":"d1","part":"본문","sec":"사생활의 비밀과 자유","tag":"기각","q":"경찰공무원 중 경사를 공직자 재산등록 의무자로 정한 것은 경사의 사생활의 비밀과 자유를 제한하지만 침해하지 않고, 합리적 이유가 있으므로 평등권을 침해한다고 볼 수 없다.","a":"O","e":"부패 방지와 공직의 청렴성 확보를 위한 것으로, 경사를 재산등록 의무자로 정한 데에는 합리적 이유가 있어 사생활의 비밀과 자유 및 평등권을 침해하지 않는다.","c":"헌재 2024.2.28. 2021헌마845","o":96},{"id":"c1-076","no":"076","src":"d1","part":"본문","sec":"사생활의 비밀과 자유","tag":"기각","q":"부동산 관련 업무나 정보를 취급하는 공직유관단체 직원들에 대한 재산등록의무·기재의무조항은 사생활의 비밀과 자유를 제한하지만 침해하지 않는다.","a":"O","e":"부동산 관련 업무의 특수성과 이해충돌 방지를 위한 것으로, 재산등록·기재의무는 필요한 범위 내에 있어 사생활의 비밀과 자유를 침해하지 않는다.","c":"헌재 2025.10.23. 2021헌마1598","o":97},{"id":"c1-077","no":"077","src":"d1","part":"본문","sec":"개인정보자기결정권","tag":"기각","q":"감염병 전파 차단을 위한 개인정보 수집의 수권조항인 구 「감염병의 예방 및 관리에 관한 법률」 제76조의2 제1항 제1호는 개인정보자기결정권을 침해하지 않는다.","a":"O","e":"감염병 확산 방지라는 중대한 공익을 위한 것으로, 수집되는 정보의 범위와 이용 목적이 법률에 특정되어 있어 개인정보자기결정권을 침해하지 않는다.","c":"헌재 2024.4.25. 2020헌마1028","o":98},{"id":"c1-077V","no":"077-2","src":"d1","part":"변형","sec":"개인정보자기결정권","tag":"변형지문","q":"감염병 전파 차단을 위한 개인정보 수집의 수권조항인 구 「감염병의 예방 및 관리에 관한 법률」 제76조의2 제1항 제1호는 정보주체의 동의 없이 개인정보를 수집할 수 있도록 하여 개인정보자기결정권을 침해한다.","a":"X","e":"감염병 확산 방지라는 중대한 공익을 위한 것으로, 침해의 최소성과 법익의 균형성을 갖추어 개인정보자기결정권을 침해하지 않는다(원자료 표시 (×)).","c":"헌재 2024.4.25. 2020헌마1028","o":99},{"id":"c1-078","no":"078","src":"d1","part":"본문","sec":"법률유보","tag":"기각","q":"시장·군수·구청장으로 하여금 주민등록증 발급신청서를 관할 경찰서 지구대장 등에게 보내도록 한 '주민등록법 시행규칙' 조항은 법률유보원칙에 위반된다.","a":"X","e":"주민등록증 발급신청서의 송부는 행정절차의 세부적 사항으로서 법률의 위임에 따른 시행규칙으로 정할 수 있는 사항이므로 법률유보원칙에 위반되지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.4.25. 2020헌마542","o":100},{"id":"c1-079","no":"079","src":"d1","part":"본문","sec":"개인정보자기결정권","tag":"기각","q":"아동에게 음란한 행위를 시키거나 이를 매개하는 행위 또는 아동에게 성적 수치심을 주는 성희롱 등의 성적 학대행위를 하였다는 범죄사실로 유죄판결이 확정된 자를 '신상정보 등록대상자'로 정한 '성폭력범죄의 처벌 등에 관한 특례법' 규정은 개인정보자기결정권을 제한하지만 침해하지 않는다.","a":"O","e":"아동 성적 학대범죄의 재범 방지와 아동 보호라는 중대한 공익을 위한 것으로, 등록정보의 범위와 이용이 제한되어 있어 개인정보자기결정권을 침해하지 않는다.","c":"헌재 2025.1.23. 2021헌마853 등","o":101},{"id":"c1-080","no":"080","src":"d1","part":"본문","sec":"개인정보자기결정권","tag":"기각","q":"법무부장관으로 하여금 신상정보 등록의 원인이 된 성범죄로 벌금형을 선고받은 사람의 등록정보를 10년간 보존·관리하도록 규정한 '성폭력범죄의 처벌 등에 관한 특례법' 제45조 제1항 본문 제4호 관리조항은 개인정보자기결정권을 제한하지만 침해하지 않는다.","a":"O","e":"벌금형이 선고된 성범죄자에 대하여 10년의 보존기간을 정한 것은 재범 방지와 수사·재판의 실효성 확보를 위한 것으로, 개인정보자기결정권을 침해하지 않는다.","c":"헌재 2025.1.23. 2021헌마853 등","o":102},{"id":"c1-081","no":"081","src":"d1","part":"본문","sec":"통신의 비밀","tag":"기각","q":"방송통신심의위원회가 주식회사 ○○ 외 9개 정보통신서비스제공자 등에 대하여 895개 웹사이트에 대한 접속차단의 시정을 요구한 행위는 정보통신서비스이용자의 통신의 비밀을 침해한다.","a":"X","e":"접속차단은 이용자의 통신 내용을 감청·검열하는 것이 아니라 유해정보에 대한 접근을 차단하는 것으로, 통신의 비밀을 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.10.26. 2019헌마158 등","o":103},{"id":"c1-082","no":"082","src":"d1","part":"본문","sec":"양심의 자유","tag":"합헌","q":"가해학생에 대한 조치로 피해학생에 대한 서면사과를 규정한 것은 가해학생의 양심의 자유와 인권을 제한하지만 침해하지 않는다.","a":"O","e":"서면사과는 학교폭력의 재발 방지와 피해 회복을 위한 것으로, 가해학생에게 진심으로 사과할 것을 강제하는 것이 아니어서 양심의 자유를 침해하지 않는다.","c":"헌재 2023.2.23. 2019헌바93 등","o":104},{"id":"c1-083","no":"083","src":"d1","part":"본문","sec":"양심의 자유","tag":"기각","q":"대체복무기관을 '교정시설'로 한정한 것, 대체복무요원의 복무기간을 '36개월'로 한 것, 대체복무요원으로 하여금 '합숙하여 복무하도록' 한 것은 양심의 자유를 침해한다.","a":"X","e":"병역의무 이행의 형평과 군 복무와의 균형을 고려한 것으로, 양심의 자유를 제한하지만 침해한다고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.5.30. 2022헌마707 등","o":105},{"id":"c1-084","no":"084","src":"d1","part":"본문","sec":"양심의 자유","tag":"기각","q":"대체복무요원의 정당가입을 금지한 것은 대체복무요원의 정당가입의 자유를 침해한다.","a":"X","e":"대체복무요원의 정치적 중립과 병역의무 이행의 형평을 위한 것으로, 정당가입의 자유를 침해한다고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.5.30. 2022헌마1146","o":106},{"id":"c1-084V1","no":"084-2","src":"d1","part":"변형","sec":"양심의 자유","tag":"변형지문","q":"대체복무요원의 정당가입을 금지한 것은 대체복무요원의 정당가입의 자유를 침해한다.","a":"X","e":"정치적 중립과 형평을 위한 것으로 정당가입의 자유를 침해한다고 볼 수 없다(원자료 표시 (×)).","c":"헌재 2024.5.30. 2022헌마1146","o":107},{"id":"c1-084V2","no":"084-3","src":"d1","part":"변형","sec":"양심의 자유","tag":"변형지문","q":"대체복무요원의 정당가입을 금지한 것은 헌법 제21조 제1항의 결사의 자유를 침해한다.","a":"X","e":"정당가입의 금지는 결사의 자유(정당가입의 자유)를 제한하지만, 그 제한은 정치적 중립 확보를 위한 것으로 침해한다고 볼 수 없다(원자료 표시 (×)).","c":"헌재 2024.5.30. 2022헌마1146","o":108},{"id":"c1-085","no":"085","src":"d1","part":"본문","sec":"종교의 자유","tag":"기각","q":"대부분의 지방자치단체에서 시험장소 임차 및 인력동원 등의 이유로 일요일 시험실시가 불가하거나 현실적으로 어려우므로, 연 2회 실시하는 간호조무사 국가시험의 시행일시를 모두 토요일로 일괄하여 정한 것은 제칠일안식일예수재림교를 믿는 응시자의 종교의 자유를 침해하지 아니한다.","a":"O","e":"시험 시행의 현실적 제약과 공정성 확보를 위한 것으로, 종교의 자유를 제한하지만 침해의 최소성과 법익의 균형성을 갖추어 침해하지 않는다.","c":"헌재 2023.6.29. 2021헌마171","o":109},{"id":"c1-085V","no":"085-2","src":"d1","part":"변형","sec":"종교의 자유","tag":"변형지문","q":"연 2회 실시하는 간호조무사 국가시험의 시행일시를 모두 토요일로 일괄하여 정한 것은 제칠일안식일예수재림교를 믿는 응시자의 종교의 자유를 침해한다.","a":"X","e":"시험 시행의 현실적 제약을 고려한 것으로, 종교의 자유를 제한하지만 침해한다고 볼 수 없다(원자료 표시 (×)).","c":"헌재 2023.6.29. 2021헌마171","o":110},{"id":"c1-086","no":"086","src":"d1","part":"본문","sec":"종교의 자유","tag":"합헌","q":"보건복지부장관, 시·도지사 또는 시장·군수·구청장 등이 감염병을 예방하기 위하여 종교집회를 제한하거나 금지하는 조치를 하도록 규정한 것은 명확성원칙에 위배되지 않고, 종교의 자유를 침해한다.","a":"X","e":"감염병 예방을 위한 제한·금지 조치는 그 요건과 범위가 법률에 규정되어 있어 명확하고, 입법목적에 부합하는 범위 내의 제한으로 종교의 자유를 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.6.27. 2021헌바178","o":111},{"id":"c1-087","no":"087","src":"d1","part":"본문","sec":"표현의 자유","tag":"위헌","q":"남북관계 발전에 관한 법률상 대북 전단 등의 살포를 금지하고 이를 위반한 자를 처벌하도록 한 조항은 표현의 자유를 침해하지 않는다.","a":"X","e":"대북 전단 살포는 북한 주민에게 정보를 전달하는 정치적 표현행위로서 그 금지는 표현의 자유를 과도하게 제한한다. 남북 간 긴장 완화라는 목적의 정당성은 인정되나 침해의 최소성과 법익의 균형성을 상실하였다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.9.26. 2020헌마1724 등","o":112},{"id":"c1-088","no":"088","src":"d1","part":"본문","sec":"표현의 자유","tag":"헌법불합치","q":"일정기간 동안 선거에 영향을 미치게 하기 위한 벽보의 게시, 인쇄물의 배부·게시를 금지하고 처벌하는 공직선거법 관련 규정은 정치적 표현의 자유를 침해한다.","a":"O","e":"선거에 영향을 미치는 것이라는 모호한 기준으로 벽보·인쇄물을 통한 표현을 전면 금지하는 것은 과잉금지원칙에 위배되어 정치적 표현의 자유를 침해한다.","c":"헌재 2023.3.23. 2023헌가4","o":113},{"id":"c1-089","no":"089","src":"d1","part":"본문","sec":"표현의 자유","tag":"헌법불합치","q":"선거일 전 180일부터 선거일까지 선거에 영향을 미치게 하기 위하여 화환의 설치를 금지하는 것은 정치적 표현의 자유를 침해한다.","a":"O","e":"화환 설치는 정치적 의사표현의 수단이 될 수 있는데, 이를 일률적으로 금지하는 것은 과잉금지원칙에 위배되어 정치적 표현의 자유를 침해한다.","c":"헌재 2023.6.29. 2023헌가12","o":114},{"id":"c1-089V","no":"089-2","src":"d1","part":"변형","sec":"표현의 자유","tag":"변형지문","q":"선거일 전 180일부터 선거일까지 선거에 영향을 미치게 하기 위하여 화환의 설치를 금지하는 것은 정치적 표현의 자유를 침해하지 않는다.","a":"X","e":"화환 설치를 일률적으로 금지하는 것은 과잉금지원칙에 위배되어 정치적 표현의 자유를 침해한다(원자료 표시 (×)).","c":"헌재 2023.6.29. 2023헌가12","o":115},{"id":"c1-090","no":"090","src":"d1","part":"본문","sec":"표현의 자유","tag":"위헌","q":"공직선거법 제251조 후보자 비방금지조항 중 '당선되거나 되게 하거나 되지 못하게 할 목적으로 연설·방송·신문·통신·잡지·벽보·선전문서 그 밖의 방법으로 공연히 사실을 적시하여 후보자(후보자가 되고자 하는 자 포함)를 비방한 자'에 관한 부분은 ① 명확성원칙에 위배되지 않지만 ② 과잉금지원칙에 위배되어 정치적 표현의 자유를 침해한다.","a":"O","e":"구성요건은 충분히 명확하나, 사실적시 비방행위를 선거 목적만 있으면 처벌하도록 하여 침해의 최소성과 법익의 균형성을 상실하였으므로 정치적 표현의 자유를 침해한다.","c":"헌재 2024.6.27. 2023헌바78","o":116},{"id":"c1-091","no":"091","src":"d1","part":"본문","sec":"표현의 자유","tag":"합헌","q":"공직선거법 제251조 제1항 허위사실공표금지조항은 명확성원칙에 위배되어 정치적 표현의 자유를 침해한다.","a":"X","e":"구성요건이 명확할 뿐 아니라, 허위사실 공표를 금지하는 것은 선거의 공정성을 확보하기 위한 것으로 과잉금지원칙에도 위배되지 않아 정치적 표현의 자유를 침해하지 않는다(원자료 결론은 '침해하지 않는다').","c":"헌재 2024.6.27. 2023헌바78","o":117},{"id":"c1-092","no":"092","src":"d1","part":"본문","sec":"표현의 자유","tag":"합헌","q":"공직선거법 중 '누구든지 이 법의 규정에 의한 공개장소에서의 연설·대담장소 외에는 기타 어떠한 방법으로도 연설·대담장소 등의 질서를 문란하게 하거나' 부분은 명확성원칙에 위배되지 않고, 정치적 표현의 자유를 침해한다.","a":"X","e":"규제대상이 연설·대담장소의 질서 문란행위로 한정되어 있어 명확하고, 선거운동의 기회균등과 질서 유지를 위한 것으로 표현의 자유를 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.5.25. 2019헌가13","o":118},{"id":"c1-093","no":"093","src":"d1","part":"본문","sec":"표현의 자유","tag":"합헌","q":"종교단체 내에서의 직무상 행위를 이용하여 그 구성원에 대한 선거운동을 금지하고 이를 위반한 자를 처벌하는 공직선거법 해당 조항은 명확성원칙에 위배되지 않고, 선거운동 등 정치적 표현의 자유를 침해하지 않는다.","a":"O","e":"종교단체의 조직을 이용한 선거운동을 금지하는 것은 선거의 공정성과 종교의 정치적 중립을 위한 것으로, 그 범위가 명확하고 표현의 자유를 침해하지 않는다.","c":"헌재 2024.1.25. 2021헌바233 등","o":119},{"id":"c1-094","no":"094","src":"d1","part":"본문","sec":"표현의 자유","tag":"합헌","q":"테러단체 가입을 타인에게 선동하는 사람을 처벌하는 테러방지법 제17조 제3항 중 '가입 선동'에 관한 부분은 명확성원칙에 위배되지 않고, 과잉금지원칙에 위배되어 표현의 자유를 침해하지 않는다.","a":"O","e":"'선동'의 의미가 통상적인 용법으로 예측 가능하고, 테러단체 가입 선동은 테러의 위험을 직접 초래하는 행위로서 그 처벌이 표현의 자유를 침해한다고 볼 수 없다.","c":"헌재 2025.1.23. 2019헌바317","o":120},{"id":"c1-095","no":"095","src":"d1","part":"본문","sec":"표현의 자유","tag":"","q":"명예훼손과 모욕적 표현은 구분해서 다루어야 하고, 공적 관심사에 대한 표현의 자유 보장과 개인의 사적 법익 및 인격권 보호라는 두 법익이 충돌했을 때에는 구체적인 경우에 표현의 자유로 얻어지는 가치와 인격권의 보호에 의하여 달성되는 가치를 비교형량하여 그 규제의 폭과 방법을 정하여야 한다.","a":"O","e":"공적 관심사에 관한 표현은 최대한 보장되어야 하지만, 표현행위의 형식과 내용이 모욕적이고 경멸적인 인신공격에 해당하거나 타인의 신상에 관하여 인격권을 침해한 경우에는 의견 표명으로서의 한계를 벗어난 것으로 허용되지 않는다.","c":"헌재 2025.5.29. 2022헌바154","o":121},{"id":"c1-095V","no":"095-2","src":"d1","part":"변형","sec":"표현의 자유","tag":"변형지문","q":"표현행위의 형식과 내용이 모욕적이고 경멸적인 인신공격에 해당하더라도 공적 관심사에 관한 것이라면 의견 표명으로서 허용된다.","a":"X","e":"모욕적·경멸적 인신공격이나 타인의 인격권을 침해한 경우에는 의견 표명으로서의 한계를 벗어난 것으로 허용되지 않는다(원자료 표시 (×)).","c":"헌재 2025.5.29. 2022헌바154","o":122},{"id":"c1-096","no":"096","src":"d1","part":"본문","sec":"알권리","tag":"합헌","q":"공정거래위원회의 처분과 관련된 자료를 대상으로 한 당사자의 열람·복사 요구에 대하여 공정위로 하여금 자료를 제출한 자의 동의가 있거나 공익상 필요하다고 인정할 때에는 이에 응하도록 하여 특정한 경우 열람·복사 요구를 거부할 수 있도록 한 것은 알권리를 제한하며 침해한다.","a":"X","e":"제출자의 영업비밀 보호와 사적 법익의 보호를 위한 것으로, 열람·복사가 허용되는 예외를 두고 있어 알권리를 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.7.20. 2019헌바417","o":123},{"id":"c1-097","no":"097","src":"d1","part":"본문","sec":"집회의 자유","tag":"헌법불합치","q":"국회의장 공관의 경계 지점으로부터 100미터 이내의 장소에서의 옥외집회 또는 시위를 일률적으로 금지하고, 이를 위반한 집회·시위의 참가자를 처벌하는 것은 과잉금지원칙에 반하여 집회의 자유를 침해한다.","a":"O","e":"목적의 정당성과 수단의 적합성은 인정되나, 100미터 이내 전면 금지는 침해의 최소성과 법익의 균형성을 상실하여 집회의 자유를 침해한다.","c":"헌재 2023.3.23. 2021헌가1","o":124},{"id":"c1-097V","no":"097-2","src":"d1","part":"변형","sec":"집회의 자유","tag":"변형지문","q":"국회의장 공관의 경계 지점으로부터 100미터 이내의 장소에서의 옥외집회 또는 시위를 일률적으로 금지하고 이를 위반한 집회·시위의 참가자를 처벌하는 것은 집회의 자유를 침해하지 않는다.","a":"X","e":"과잉금지원칙에 반하여 집회의 자유를 침해한다(원자료 표시 (×)).","c":"헌재 2023.3.23. 2021헌가1","o":125},{"id":"c1-098","no":"098","src":"d1","part":"본문","sec":"집회의 자유","tag":"위헌","q":"집회·시위를 하기 위하여 인쇄물(벽보·선전문) 중 잔디마당에 대한 사용허가 신청을 한 경우 시장이 이를 허가할 수 없도록 제한하는 조례는 법률유보원칙과 사전허가금지원칙에 위배되지는 않지만, 과잉금지원칙에 위배되어 집회의 자유를 침해한다.","a":"O","e":"조례가 상위법령의 위임 범위 내에 있어 법률유보·사전허가금지원칙에는 위배되지 않으나, 잔디마당 사용을 전면 불허하여 집회의 자유를 과도하게 제한한다.","c":"헌재 2023.9.26. 2019헌마1417","o":126},{"id":"c1-099","no":"099","src":"d1","part":"본문","sec":"집회의 자유","tag":"합헌","q":"국내 주재 외교기관 인근의 옥외집회 또는 시위를 예외적으로 허용하는 구 '집회 및 시위에 관한 법률' 관련규정은 명확성원칙에 위배되지 않고, 집회의 자유를 침해한다.","a":"X","e":"예외 허용의 요건이 비교적 명확하고, 외교기관의 기능 보호와 집회의 자유의 조화를 위한 것으로 집회의 자유를 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.7.20. 2020헌바131","o":127},{"id":"c1-100","no":"100","src":"d1","part":"본문","sec":"집회의 자유","tag":"합헌","q":"감염병을 예방하기 위하여 집회를 제한하거나 금지하는 구 '감염병의 예방 및 관리에 관한 법률' 규정들은 집회의 자유를 제한하며 이를 침해한다.","a":"X","e":"감염병 예방을 위한 집회의 제한·금지는 집회의 자유를 제한하지만, 감염병 확산이라는 중대한 위험을 방지하기 위한 것으로 침해한다고 볼 수 없다(원자료 결론은 '침해하지 않는다').","c":"헌재 2024.8.29. 2022헌바177 등","o":128},{"id":"c1-101","no":"101","src":"d1","part":"본문","sec":"집회의 자유","tag":"","q":"심판대상조항의 규율 대상은 일정한 내용과 형식을 갖춘 '행사 자체'가 아니라 '여러 사람의 집합'이고, 따라서 위 조항에 의하더라도 집회의 내용 자체를 제한한다고 보기는 어렵다.","a":"O","e":"규율 대상이 집회의 내용이 아니라 여러 사람의 집합이라는 사실적 상태이므로, 집회의 내용 자체를 제한하는 것으로 볼 수 없다.","c":"헌재 2024.8.29. 2022헌바177 등","o":129},{"id":"c1-101V","no":"101-2","src":"d1","part":"변형","sec":"집회의 자유","tag":"변형지문","q":"심판대상조항의 규율 대상은 일정한 내용과 형식을 갖춘 '행사 자체'이므로, 위 조항은 집회의 내용 자체를 제한한다.","a":"X","e":"규율 대상은 '여러 사람의 집합'이라는 사실적 상태이지 '행사 자체'가 아니므로 집회의 내용 자체를 제한한다고 볼 수 없다(원자료 표시 (×)).","c":"헌재 2024.8.29. 2022헌바177 등","o":130},{"id":"c1-102","no":"102","src":"d1","part":"본문","sec":"집회의 자유","tag":"합헌","q":"집회 및 시위에 관한 법률상 소음기준을 초과하는 경우 그 기준 이하의 소음 유지 또는 확성기 등의 사용 중지를 명할 수 있도록 한 조항은 과잉금지원칙에 위배되어 집회의 자유를 침해한다.","a":"X","e":"확성기 등의 사용을 규제하면서 합성·노래·박수 등을 규제대상에서 제외하고, 사회통념상 수인한도를 넘는 소음만을 규제하고 있어 집회의 자유를 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.3.28. 2020헌바586","o":131},{"id":"c1-103","no":"103","src":"d1","part":"본문","sec":"결사의 자유","tag":"합헌","q":"농협중앙회 회장선거의 관리를 농협중앙회의 자율에 맡기지 않고 「선거관리위원회법」에 따른 중앙선거관리위원회에 의무적으로 위탁하도록 한 「농업협동조합법」 조항은 농협중앙회 및 회원조합의 결사의 자유를 침해한다고 볼 수 없고, 평등원칙에 위반되지 않는다.","a":"O","e":"선거 관리의 공정성과 투명성을 확보하기 위한 것으로 결사의 자유를 침해한다고 볼 수 없고, 다른 단체와의 차별에도 합리적 이유가 있다.","c":"헌재 2023.5.25. 2021헌바136","o":132},{"id":"c1-104","no":"104","src":"d1","part":"본문","sec":"결사의 자유","tag":"합헌","q":"조합장선거에서 후보자가 아닌 사람의 선거운동을 금지하는 「공공단체등 위탁선거에 관한 법률」 조항은 조합장선거의 과열과 혼탁을 방지함으로써 선거의 공정성을 담보하고자 하는 것으로서, 조합장선거의 후보자 및 선거인인 조합원의 결사의 자유 등 기본권을 침해하지 아니한다.","a":"O","e":"선거의 공정성 확보를 위한 것으로, 후보자가 아닌 사람의 선거운동을 금지하는 것은 결사의 자유를 침해하지 않는다.","c":"헌재 2024.2.28. 2021헌가16","o":133},{"id":"c1-105","no":"105","src":"d1","part":"본문","sec":"대학의 자율성","tag":"","q":"대학의 자율성에서 교원에게 그와 관련된 영역에서 주도적인 역할을 인정한다고 하여, 교육과 연구에 관한 사항은 모두 교원이 전적으로 결정할 수 있어야 한다는 의미는 아니다.","a":"O","e":"대학의 자율성은 교원의 주도적 역할을 인정하는 것이지만, 교육·연구에 관한 모든 사항을 교원이 전적으로 결정하여야 한다는 뜻은 아니다.","c":"헌재 2023.10.26. 2018헌마872","o":134},{"id":"c1-105V","no":"105-2","src":"d1","part":"변형","sec":"대학의 자율성","tag":"변형지문","q":"대학의 자율성에서 교원에게 그와 관련된 영역에서 주도적인 역할을 인정하므로, 교육과 연구에 관한 사항은 모두 교원이 전적으로 결정할 수 있어야 한다.","a":"X","e":"교육·연구에 관한 모든 사항을 교원이 전적으로 결정하여야 한다는 의미는 아니다(원자료 표시 (×)).","c":"헌재 2023.10.26. 2018헌마872","o":135},{"id":"c1-106","no":"106","src":"d1","part":"본문","sec":"대학의 자율성","tag":"기각","q":"교원, 직원, 학생 등 대학평의원회의 각 구성단위에 속하는 평의원의 수가 전체 평의원 정수의 2분의 1을 초과할 수 없도록 규정한 것은 국·공립대학 교수회 및 교수들의 대학의 자율권을 침해하지 않는다.","a":"O","e":"대학평의원회의 균형 있는 구성을 위한 것으로, 각 구성단위의 평의원 수를 제한하더라도 대학의 자율권을 침해한다고 볼 수 없다.","c":"헌재 2023.10.26. 2018헌마872","o":136},{"id":"c1-107","no":"107","src":"d1","part":"본문","sec":"대학의 자율성","tag":"기각","q":"학칙의 제정 또는 개정에 관한 사항 등 대학평의원회의 심의사항을 규정한 「고등교육법」 조항은 국·공립대학 교수회 및 교수들의 대학의 자율권을 침해하지 않는다.","a":"O","e":"대학평의원회의 심의사항을 법률로 정한 것은 대학 운영의 민주성과 투명성을 위한 것으로, 대학의 자율권을 침해한다고 볼 수 없다.","c":"헌재 2023.10.26. 2018헌마872","o":137},{"id":"c1-107V","no":"107-2","src":"d1","part":"변형","sec":"대학의 자율성","tag":"변형지문","q":"학칙의 제정 또는 개정에 관한 사항 등 대학평의원회의 심의사항을 규정한 「고등교육법」 조항은 국·공립대학 교수회 및 교수들의 대학의 자율권을 침해한다.","a":"X","e":"대학 운영의 민주성·투명성을 위한 것으로 대학의 자율권을 침해하지 않는다(원자료 표시 (×)).","c":"헌재 2023.10.26. 2018헌마872","o":138},{"id":"c1-108","no":"108","src":"d1","part":"본문","sec":"직업의 자유","tag":"위헌","q":"아동학대관련범죄로 벌금형이 확정된 날부터 10년이 지나지 아니한 사람은 어린이집을 설치·운영하거나 어린이집에 근무할 수 없고, 같은 이유로 보육교사 자격이 취소되면 그 취소된 날부터 10년간 자격을 재교부받지 못하도록 한 영유아보육법과 아동복지법 관련 조항은 직업선택의 자유를 침해하지 않는다.","a":"X","e":"아동 보호라는 목적의 정당성은 인정되나, 벌금형이 확정된 경우까지 예외 없이 10년간 어린이집 설치·운영 및 보육교사 자격을 제한하는 것은 침해의 최소성과 법익의 균형성을 상실하여 직업선택의 자유를 침해한다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2022.9.29. 2019헌마813","o":139},{"id":"c1-109","no":"109","src":"d1","part":"본문","sec":"직업의 선택의 자유","tag":"인용(위헌)","q":"감염병 유행이 일률적이고 광범위한 기본권 제한을 허용하는 면죄부가 될 수 없고, 감염병의 확산으로 인하여 의료자원이 부족할 수 있다는 막연한 우려를 이유로 확진환자 등의 응시를 일률적으로 금지하는 것은 직업선택의 자유를 과도하게 제한한 것이다.","a":"O","e":"확진환자의 응시를 일률적으로 금지하는 것은 직업선택의 자유를 과도하게 제한하는 것으로 위헌이다.","c":"헌재 2023.2.23. 2020헌마1736","o":140},{"id":"c1-109V","no":"109-2","src":"d1","part":"변형","sec":"직업의 선택의 자유","tag":"변형지문","q":"감염병의 확산으로 인하여 의료자원이 부족할 수 있다는 우려를 이유로 확진환자 등의 응시를 일률적으로 금지하는 것은 직업선택의 자유를 과도하게 제한한 것으로 볼 수 없다.","a":"X","e":"막연한 우려를 이유로 응시를 일률적으로 금지하는 것은 직업선택의 자유를 과도하게 제한한 것이다(원자료 표시 (×)).","c":"헌재 2023.2.23. 2020헌마1736","o":141},{"id":"c1-110","no":"110","src":"d1","part":"본문","sec":"직업의 선택의 자유","tag":"기각","q":"집단급식소에 근무하는 영양사의 직무를 규정한 식품위생법 제52조 제2항(직무수행조항)을 위반한 자를 처벌하는 조항에 대하여, 헌법재판소는 명확성원칙 위반 5인, 과잉금지원칙 위반 2인의 의견이 있었으나 위헌결정에 이르지 아니하고 기각하였다.","a":"O","e":"명확성원칙 위반 의견 5인과 과잉금지원칙 위반 의견 2인으로 위헌의견이 다수였으나, 어느 의견도 위헌정족수에 이르지 못하여 기각되었다. 시험에서는 위헌 취지의 지문과 구별하여 정리하여야 한다.","c":"헌재 2023.3.23. 2019헌마141","o":142},{"id":"c1-111","no":"111","src":"d1","part":"본문","sec":"직업의 자유","tag":"헌법불합치","q":"시설경비업무를 허가받은 경비업자로 하여금 허가받은 경비업무 외의 업무에 경비원을 종사하게 하는 것을 금지하고, 이를 위반한 경비업자에 대한 허가를 취소하도록 정하고 있는 것은 경비업자의 직업의 자유를 침해한다.","a":"O","e":"허가받은 업무 외의 업무에 경비원을 종사하게 하는 것을 금지하고 허가를 취소하도록 하는 것은 침해의 최소성과 법익의 균형성을 상실하여 경비업자의 직업의 자유를 침해한다.","c":"헌재 2023.3.23. 2020헌가19","o":143},{"id":"c1-112","no":"112","src":"d1","part":"본문","sec":"직업의 자유","tag":"합헌","q":"코로나19 팬데믹 사태로 약사가 환자에게 의약품을 교부함에 있어 그 교부방식을 환자와 약사가 협의하여 결정할 수 있도록 한시적 예외를 인정하였다고 해도, 의약품의 판매장소를 약국 내로 제한하는 것은 국민의 건강과 직접 관련된 보건의료 분야라는 점을 고려할 때 과잉금지원칙에 위반하여 약국개설자의 직업수행의 자유를 침해한다고 볼 수 없다.","a":"O","e":"의약품의 안전한 사용과 국민 건강 보호를 위한 것으로, 판매장소를 약국 내로 제한하는 것이 직업수행의 자유를 침해한다고 볼 수 없다.","c":"헌재 2023.3.23. 2021헌바400","o":144},{"id":"c1-113","no":"113","src":"d1","part":"본문","sec":"직업의 자유","tag":"합헌","q":"아동학대관련범죄로 처벌받은 어린이집 원장 또는 보육교사의 자격을 행정청으로 하여금 취소할 수 있도록 규정한 「영유아보육법」상 조항은 직업의 자유를 침해하지 않는다.","a":"O","e":"아동 보호와 어린이집 운영의 적정성을 위한 것으로, 아동학대관련범죄로 처벌받은 자의 자격을 취소할 수 있도록 한 것은 직업의 자유를 침해하지 않는다.","c":"헌재 2023.5.25. 2021헌바234","o":145},{"id":"c1-113V","no":"113-2","src":"d1","part":"변형","sec":"직업의 자유","tag":"변형지문","q":"아동학대관련범죄로 처벌받은 어린이집 원장 또는 보육교사의 자격을 행정청으로 하여금 취소할 수 있도록 규정한 「영유아보육법」상 조항은 직업의 자유를 침해한다.","a":"X","e":"아동 보호를 위한 것으로 직업의 자유를 침해하지 않는다(원자료 표시 (×)).","c":"헌재 2023.5.25. 2021헌바234","o":146},{"id":"c1-114","no":"114","src":"d1","part":"본문","sec":"직업의 자유","tag":"합헌","q":"택시운송사업자는 생산고에 따른 임금을 제외한 고정급만으로 택시운전근로자에게 최저임금액 이상을 지급하도록 한 것은 택시운송사업자의 계약의 자유와 직업의 자유를 침해하지 않는다.","a":"O","e":"택시운전근로자의 최저임금 보장과 근로조건의 안정을 위한 것으로, 사업자의 계약의 자유와 직업의 자유를 침해하지 않는다.","c":"헌재 2023.2.23. 2020헌바11 등","o":147},{"id":"c1-115","no":"115","src":"d1","part":"본문","sec":"직업의 자유","tag":"기각","q":"사업주로부터 위임을 받아 고용보험 및 산재보험에 관한 보험사무를 대행할 수 있는 기관의 자격을 일정한 기준을 충족하는 단체 또는 법인, 공인노무사, 세무사로 한정하고 있는 「고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률」 조항은 개인 공인회계사의 직업의 자유를 침해한다고 볼 수 없다.","a":"O","e":"보험사무 대행의 전문성과 신뢰성을 확보하기 위한 것으로, 대행기관의 자격을 한정하더라도 개인 공인회계사의 직업의 자유를 침해한다고 볼 수 없다.","c":"헌재 2024.2.28. 2020헌마139","o":148},{"id":"c1-116","no":"116","src":"d1","part":"본문","sec":"직업의 자유","tag":"기각","q":"구 수산업법 시행령상 '외곽이대형저인망어업의 조업구역 부분'은 외곽이대형저인망어업을 영위하는 어업인들의 직업수행의 자유를 제한하지만 침해하지 않고, 청구인들의 평등권을 침해하지 않는다.","a":"O","e":"수산자원의 보호와 어업질서 유지를 위한 조업구역 제한은 필요한 범위 내의 것으로 직업수행의 자유를 침해하지 않고, 다른 어업과의 차별에도 합리적 이유가 있다.","c":"헌재 2024.8.29. 2021헌마146","o":149},{"id":"c1-117","no":"117","src":"d1","part":"본문","sec":"직업의 자유","tag":"합헌","q":"도시 및 주거환경정비법상 조합원 명부의 복사 요청에 조합 임원이 따르도록 한 규정은 조합 임원의 직업수행의 자유와 개인정보자기결정권을 침해하여 헌법에 위반된다.","a":"X","e":"조합원의 알 권리와 조합 운영의 투명성을 위한 것으로, 직업수행의 자유나 개인정보자기결정권을 침해하여 헌법에 위반된다고 볼 수 없다(원자료 결론은 '위반되지 않는다').","c":"헌재 2025.6.27. 2020헌바514","o":150},{"id":"c1-118","no":"118","src":"d1","part":"본문","sec":"직업의 자유","tag":"기각","q":"의료기관의 장으로 하여금 보건복지부장관에게 비급여 진료비용에 관한 사항을 보고하도록 한 의료법 규정은 의사의 직업수행의 자유와 환자의 개인정보자기결정권을 제한하지만 침해하지는 않는다.","a":"O","e":"비급여 진료비용의 투명한 공개와 환자의 알 권리를 위한 것으로, 보고 의무는 필요한 범위 내에 있어 기본권을 침해하지 않는다.","c":"헌재 2023.2.23. 2021헌마374 등","o":151},{"id":"c1-119","no":"119","src":"d1","part":"본문","sec":"직업의 자유","tag":"","q":"의원급 의료기관의 비급여 진료비용에 관한 항목·조사·분석 결과를 공개하도록 한 고시 조항은 의사의 직업수행의 자유와 환자의 개인정보자기결정권을 제한하지만 침해하지는 않는다.","a":"O","e":"진료비용 공개는 환자의 알 권리와 의료 선택의 자유를 위한 것으로, 의사의 직업수행의 자유와 환자의 개인정보자기결정권을 제한하지만 침해하지 않는다.","c":"헌재 2023.2.23. 2021헌마374 등","o":152},{"id":"c1-120","no":"120","src":"d1","part":"본문","sec":"직업의 자유","tag":"기각","q":"「근로기준법」상 근로시간에 대한 주 52시간 상한제 조항은 연장근로시간에 관한 사용자와 근로자 간의 계약 내용을 제한하는 측면에서는 사용자와 근로자의 계약의 자유를 제한하고, 근로자를 고용하여 재화나 용역을 제공하는 사용자의 활동을 제한하는 측면에서는 직업의 자유를 제한한다.","a":"O","e":"주 52시간 상한제는 계약의 자유와 직업의 자유를 제한하지만, 근로자의 건강과 휴식 보장을 위한 것으로 그 제한이 침해에 이르지는 않는다.","c":"헌재 2024.2.28. 2019헌마500","o":153},{"id":"c1-120V","no":"120-2","src":"d1","part":"변형","sec":"직업의 자유","tag":"변형지문","q":"「근로기준법」상 근로시간에 대한 주 52시간 상한제 조항은 연장근로시간에 관한 계약 내용을 제한하는 측면에서 사용자와 근로자의 계약의 자유를 제한하고, 사용자의 활동을 제한하는 측면에서 직업의 자유를 제한한다.","a":"O","e":"주 52시간 상한제는 계약의 자유와 직업의 자유를 제한한다(원자료 표시 (○)). 제한이 곧 침해를 의미하지는 않는다.","c":"헌재 2024.2.28. 2019헌마500","o":154},{"id":"c1-121","no":"121","src":"d1","part":"본문","sec":"직업의 자유","tag":"합헌","q":"중개법인의 임원이 「공인중개사법」을 위반하여 300만 원 이상의 벌금형의 선고를 받고 3년이 지나지 아니한 자에 해당하는 경우 중개법인의 등록을 필요적으로 취소하도록 하는 것은 해당 중개법인의 직업의 자유를 제한하며 침해한다.","a":"X","e":"부동산 중개업의 건전성과 거래의 안전을 위한 것으로, 등록을 필요적으로 취소하도록 한 것이 직업의 자유를 침해한다고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.2.28. 2022헌바109","o":155},{"id":"c1-121V","no":"121-2","src":"d1","part":"변형","sec":"직업의 자유","tag":"변형지문","q":"중개법인의 임원이 「공인중개사법」을 위반하여 300만 원 이상의 벌금형의 선고를 받고 3년이 지나지 아니한 자에 해당하는 경우 중개법인의 등록을 필요적으로 취소하도록 하는 것은 해당 중개법인의 직업의 자유를 침해한다.","a":"X","e":"부동산 중개업의 건전성과 거래 안전을 위한 것으로, 직업의 자유를 제한하지만 침해한다고 볼 수 없다(원자료 표시 (×)).","c":"헌재 2024.2.28. 2022헌바109","o":156},{"id":"c1-122","no":"122","src":"d1","part":"본문","sec":"직업의 자유","tag":"합헌","q":"「교육환경 보호에 관한 법률」상 상대보호구역에서 「게임산업진흥에 관한 법률」상 '복합유통게임제공업' 시설을 갖추고 영업을 하는 것을 원칙적으로 금지하는 것은 교육환경보호구역 안의 토지나 건물의 임차인 내지 복합유통게임제공업을 영위하고자 하는 자의 직업수행의 자유 및 재산권을 제한하지만, 침해하지 아니한다.","a":"O","e":"학생의 교육환경 보호라는 중대한 공익을 위한 것으로, 영업을 원칙적으로 금지하더라도 과잉금지원칙에 위배되어 직업수행의 자유나 재산권을 침해하지 않는다.","c":"헌재 2024.1.25. 2021헌바231","o":157},{"id":"c1-123","no":"123","src":"d1","part":"본문","sec":"직업의 자유","tag":"기각","q":"시내버스운송사업자가 사업계획 가운데 운행대수 또는 운행횟수를 증감하려는 때에는 국토교통부장관 또는 시·도지사의 인가를 받거나 신고하도록 하고 이를 위반한 경우 처벌하는 「여객자동차 운수사업법」 조항은 시내버스운송사업자의 직업수행의 자유를 침해한다고 볼 수 없다.","a":"O","e":"대중교통의 공공성과 이용자의 편익을 위한 것으로, 운행대수·횟수의 증감에 인가·신고를 요구하더라도 직업수행의 자유를 침해한다고 볼 수 없다.","c":"헌재 2024.1.25. 2020헌마1144","o":158},{"id":"c1-124","no":"124","src":"d1","part":"본문","sec":"직업의 자유","tag":"기각","q":"우선분양전환의 상대방인 임차인의 범위를 확대하고, 임대주택의 제3자 매각 시 임차인의 우선분양전환자격 유무와 관계없이 분양전환가격 이하의 가격으로 매각하도록 하는 것은 임대사업자의 영업의 자유를 제한하지만 침해하지 않는다.","a":"O","e":"임차인의 주거 안정을 위한 것으로, 임대사업자의 영업의 자유를 제한하지만 침해의 최소성과 법익의 균형성을 갖추어 침해하지 않는다.","c":"헌재 2025.9.25. 2021헌마728","o":159},{"id":"c1-125","no":"125","src":"d1","part":"본문","sec":"재산권","tag":"헌법불합치","q":"유류분상실사유를 별도로 규정하지 아니한 민법 제1112조 제1호부터 제3호 및 '영제자의 유류분'을 규정한 민법 제1112조 제4호는 재산권을 침해하여 헌법에 위반된다.","a":"O","e":"유류분권리자가 상속인에게 부당한 영향을 미친 경우 등에도 유류분을 상실시키는 규정이 없어, 피상속인의 유언의 자유와 다른 상속인의 재산권이 과도하게 침해된다. 헌법재판소는 헌법불합치결정을 하였다.","c":"헌재 2024.4.25. 2020헌가4 등","o":160},{"id":"c1-126","no":"126","src":"d1","part":"본문","sec":"재산권","tag":"잠정적용 헌법불합치","q":"기여분에 관한 민법 제1008조의2를 유류분에 준용하는 규정을 두지 아니한 민법 제1118조는 재산권을 침해하여 헌법에 위반된다.","a":"O","e":"공동상속인의 기여분을 유류분 산정에 반영할 수 없다면 실질적 공평에 반하게 되므로 헌법에 위반된다. 다만 혼란을 막기 위하여 잠정적용 헌법불합치결정을 하였다.","c":"헌재 2024.4.25. 2020헌가4 등","o":161},{"id":"c1-127","no":"127","src":"d1","part":"본문","sec":"재산권","tag":"합헌","q":"유류분 산정에 관한 민법 제1113조, 유류분 산정 기초재산에 산입되는 증여의 범위에 관한 민법 제1114조 전문은 재산권을 침해하지 않는다.","a":"O","e":"유류분 산정의 기준과 증여 산입의 범위를 정한 것은 상속인의 유류분을 보장하기 위한 것으로, 재산권을 침해하지 않는다.","c":"헌재 2024.4.25. 2020헌가4 등","o":162},{"id":"c1-128","no":"128","src":"d1","part":"본문","sec":"재산권","tag":"합헌","q":"증여와 유증이 병존하는 경우 그 순서와 관련하여 유류분권리자가 유증을 먼저 반환받은 후 그것으로도 부족한 경우에 비로소 증여에 대하여 반환청구를 할 수 있도록 규정하고 있는 「민법」 제1116조는 유류분반환청구로부터 거래의 안전을 최대한 보호하기 위한 것이므로 불합리하다고 볼 수 없다.","a":"O","e":"유증을 먼저 반환받도록 하는 것은 거래의 안전과 법적 안정성을 위한 것으로, 불합리하다고 볼 수 없다.","c":"헌재 2024.4.25. 2020헌가4 등","o":163},{"id":"c1-129","no":"129","src":"d1","part":"본문","sec":"재산권","tag":"기각","q":"상속개시 후 인지 또는 재판확정에 의하여 공동상속인이 된 자가 다른 공동상속인에 대해 상속분가액지급청구권을 행사하는 경우에도 상속회복청구권에 관한 10년의 제척기간을 적용하도록 한 「민법」 제999조 제2항의 관련 부분은 재산권과 재판청구권을 침해한다.","a":"O","e":"제척기간을 통한 법적 안정성만을 지나치게 중시한 나머지 권리구제의 실효성을 외면한 것으로서 입법형성의 한계를 일탈하여 재산권과 재판청구권을 침해한다.","c":"헌재 2024.6.27. 2021헌마1588","o":164},{"id":"c1-129V","no":"129-2","src":"d1","part":"변형","sec":"재산권","tag":"변형지문","q":"상속개시 후 인지 또는 재판확정에 의하여 공동상속인이 된 자가 상속분가액지급청구권을 행사하는 경우에도 상속회복청구권의 제척기간을 적용하도록 한 것은 재산권과 재판청구권을 침해한다.","a":"O","e":"권리구제의 실효성을 외면한 것으로 입법형성의 한계를 일탈하여 재산권과 재판청구권을 침해한다(원자료 표시 (○)).","c":"헌재 2024.6.27. 2021헌마1588","o":165},{"id":"c1-130","no":"130","src":"d1","part":"본문","sec":"재산권","tag":"헌법불합치","q":"살처분된 가축의 소유자가 축산계열화사업자인 경우에는 계약사육농가의 수급권 보호를 위하여 보상금을 계약사육농가에 지급한다고 규정한 것은 축산계열화사업자의 재산권을 침해한다.","a":"O","e":"가축의 소유자인 축산계열화사업자의 재산권을 침해하면서까지 계약사육농가에 보상금을 지급하는 것은 법익의 균형성을 상실한 것이다.","c":"헌재 2024.5.30. 2021헌가3","o":166},{"id":"c1-130V","no":"130-2","src":"d1","part":"변형","sec":"재산권","tag":"변형지문","q":"살처분된 가축의 소유자가 축산계열화사업자인 경우 계약사육농가에 보상금을 지급하도록 규정한 것은 축산계열화사업자의 재산권을 침해하지 않는다.","a":"X","e":"가축 소유자의 재산권을 침해하므로 헌법에 위반된다(원자료 표시 (×)).","c":"헌재 2024.5.30. 2021헌가3","o":167},{"id":"c1-131","no":"131","src":"d1","part":"본문","sec":"재산권","tag":"헌법불합치","q":"의료급여기관이 「의료법」 제33조 제2항을 위반하였다는 사실을 수사기관의 수사결과로 확인한 경우 시장·군수·구청장으로 하여금 해당 의료급여기관이 청구한 의료급여비용의 지급을 보류할 수 있도록 규정한 「의료급여법」 조항 중 '의료법 제33조 제2항'에 관한 부분은 과잉금지원칙에 반하여 의료급여기관 개설자의 재산권을 침해한다.","a":"O","e":"수사결과만으로 지급을 보류하도록 하는 것은 침해의 최소성과 법익의 균형성을 상실하여 재산권을 침해한다.","c":"헌재 2024.6.27. 2021헌가19","o":168},{"id":"c1-132","no":"132","src":"d1","part":"본문","sec":"재산권","tag":"기각","q":"금융위원회위원장이 투기지역·투기과열지구 내 초고가 아파트(시가 15억 원 초과)에 대한 주택구입용 주택담보대출을 금지한 조치는 청구인의 재산권 및 계약의 자유를 제한하며 침해한다.","a":"X","e":"가계부채의 억제와 주택시장의 안정을 위한 것으로, 대출 금지 조치는 필요한 범위 내에 있어 재산권과 계약의 자유를 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.3.23. 2019헌마1399","o":169},{"id":"c1-133","no":"133","src":"d1","part":"본문","sec":"재산권","tag":"합헌","q":"임차인이 3기의 차임액에 해당하는 금액에 이르도록 차임을 연체한 경우 임대인의 권리금 회수기회 보호의무가 발생하지 않도록 규정한 것은 임대인의 재산권을 제한하며 침해한다.","a":"X","e":"임대인의 재산권 행사를 보장하면서 임차인의 권리금을 보호하려는 것으로, 3기 연체 시 보호의무를 면제하더라도 재산권을 침해한다고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.6.29. 2021헌바264","o":170},{"id":"c1-133V","no":"133-2","src":"d1","part":"변형","sec":"재산권","tag":"변형지문","q":"임차인이 3기의 차임액에 해당하는 금액에 이르도록 차임을 연체한 경우 임대인의 권리금 회수기회 보호의무가 발생하지 않도록 규정한 것은 임대인의 재산권을 침해한다.","a":"X","e":"재산권을 제한하지만 침해한다고 볼 수 없다(원자료 표시 (×)).","c":"헌재 2023.6.29. 2021헌바264","o":171},{"id":"c1-134","no":"134","src":"d1","part":"본문","sec":"재산권","tag":"합헌","q":"임차인이 계약갱신을 요구할 경우 임대인이 정당한 사유 없이 이를 거절하지 못하도록 한 주택임대차보호법 해당 조항은 임대인의 재산권을 침해한다.","a":"X","e":"임차인의 주거 안정을 위한 것으로, 정당한 사유가 있으면 거절할 수 있으므로 재산권을 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.2.28. 2020헌마1343 등","o":172},{"id":"c1-135","no":"135","src":"d1","part":"본문","sec":"재산권","tag":"합헌","q":"임대인이 실제 거주를 이유로 갱신을 거절한 후 정당한 사유 없이 제3자에게 임대한 경우의 손해배상책임 및 손해액을 규정한 주택임대차보호법 조항은 과잉금지원칙에 반하여 임대인의 계약의 자유와 재산권을 침해한다고 볼 수 없다.","a":"O","e":"실거주를 이유로 갱신을 거절한 임대인의 배신행위를 규제하기 위한 것으로, 계약의 자유와 재산권을 침해한다고 볼 수 없다.","c":"헌재 2024.2.28. 2020헌마1343 등","o":173},{"id":"c1-136","no":"136","src":"d1","part":"본문","sec":"재산권","tag":"","q":"주택 임대차와 관련한 임차인의 보호 및 주택의 이용에 관한 정책은 입법자가 정책적으로 결정하여야 할 사항으로 원칙적으로 광범위한 입법형성의 자유가 인정되므로, 특단의 사정이 없는 한 구법상의 기대이익을 존중하여야 할 입법자의 의무가 있는 것은 아니라고 할 것이어서 신뢰보호원칙에 위배되는지 여부는 문제되지 않는다.","a":"X","e":"입법형성의 자유가 인정되더라도 신뢰보호원칙에 위배되는지 여부는 여전히 심사되어야 한다(원자료 표시 (×)).","c":"헌재 2024.2.28. 2020헌마1343 등","o":174},{"id":"c1-137","no":"137","src":"d1","part":"본문","sec":"재산권","tag":"합헌","q":"거주자가 건물을 신축하고 그 신축한 건물의 취득일부터 5년 이내에 해당 건물을 양도하는 경우로서 환산가액을 그 취득가액으로 하는 경우 양도소득 결산세액에 대하여 가산세를 부과하도록 하는 구 「소득세법」 조항은 재산권을 침해한다.","a":"X","e":"실지거래가액이 확인되지 아니한 경우의 과세 형평을 위한 것으로, 재산권을 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.2.28. 2020헌가15","o":175},{"id":"c1-137V","no":"137-2","src":"d1","part":"변형","sec":"재산권","tag":"변형지문","q":"거주자가 신축한 건물을 취득일부터 5년 이내에 양도하는 경우 환산가액을 취득가액으로 하여 양도소득 결산세액에 가산세를 부과하도록 하는 구 「소득세법」 조항은 재산권을 침해한다.","a":"X","e":"과세 형평을 위한 것으로 재산권을 침해하지 않는다(원자료 표시 (×)).","c":"헌재 2024.2.28. 2020헌가15","o":176},{"id":"c1-138","no":"138","src":"d1","part":"본문","sec":"재산권","tag":"기각","q":"구 「민간임대주택에 관한 특별법」의 등록말소 조항은 단기민간임대주택과 아파트 장기일반민간임대주택의 임대의무기간이 종료한 날 그 등록이 말소되도록 할 뿐이고, 종전 임대사업자가 이미 받은 세제혜택 등을 박탈하는 내용이 없으므로 재산권이 제한된다고 볼 수 없다.","a":"O","e":"등록이 말소되더라도 이미 받은 세제혜택을 박탈하지 않으므로 재산권 제한이 없다.","c":"헌재 2024.2.28. 2020헌마1482","o":177},{"id":"c1-139","no":"139","src":"d1","part":"본문","sec":"재산권","tag":"합헌","q":"장해급여 수급요건의 구체적인 내용은 법률에 의하여 비로소 정해지는 것이므로, 그 형성에 관해서는 일반적인 재산권에 비하여 입법자에게 상대적으로 넓은 재량이 허용된다고 볼 수 있다.","a":"O","e":"장해급여는 법률에 의하여 비로소 형성되는 권리이므로, 그 수급요건의 형성에는 입법자에게 넓은 재량이 인정된다.","c":"헌재 2023.10.26. 2020헌바310","o":178},{"id":"c1-139V","no":"139-2","src":"d1","part":"변형","sec":"재산권","tag":"변형지문","q":"장해급여 수급요건의 구체적인 내용은 법률에 의하여 비로소 정해지는 것이므로, 그 형성에 관해서도 일반적인 재산권과 동일하게 입법자의 재량이 인정되지 않는다.","a":"X","e":"일반적인 재산권에 비하여 입법자에게 상대적으로 넓은 재량이 허용된다(원자료 표시 (×)).","c":"헌재 2023.10.26. 2020헌바310","o":179},{"id":"c1-140","no":"140","src":"d1","part":"본문","sec":"재산권","tag":"합헌","q":"「공무원연금법」에서 19세 미만인 자녀에 대하여 아무런 제한 없이 퇴직유족연금일시금을 선택할 수 있게 하고 그 금액도 다른 유족과 동일한 계산식에 따라 산출하게 한 것은 다른 유족의 재산권을 침해한다.","a":"X","e":"19세 미만 자녀의 보호를 위한 것으로, 다른 유족의 재산권을 침해한다고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.2.28. 2021헌바141","o":180},{"id":"c1-140V","no":"140-2","src":"d1","part":"변형","sec":"재산권","tag":"변형지문","q":"「공무원연금법」에서 19세 미만인 자녀에 대하여 아무런 제한 없이 퇴직유족연금일시금을 선택할 수 있게 하고 그 금액도 다른 유족과 동일한 계산식에 따라 산출하게 한 것은 다른 유족의 재산권을 침해한다.","a":"X","e":"다른 유족의 재산권을 침해하지 않는다(원자료 표시 (×)).","c":"헌재 2024.2.28. 2021헌바141","o":181},{"id":"c1-141","no":"141","src":"d1","part":"본문","sec":"재산권","tag":"합헌","q":"대지사용권을 가지지 아니한 구분소유자가 있을 때 그 전유부분의 철거청구권자에게 구분소유권의 매도청구권을 부여한 「집합건물의 소유 및 관리에 관한 법률」 제7조는 구분소유자의 재산권을 침해한다.","a":"X","e":"집합건물의 법률관계를 안정시키고 철거청구권자를 보호하기 위한 것으로, 구분소유자의 재산권을 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.6.27. 2023헌나23","o":182},{"id":"c1-142","no":"142","src":"d1","part":"본문","sec":"재산권","tag":"기각","q":"투기과열지구 내 재건축사업에서 조합설립인가 후에 토지나 건축물을 양수한 자는 조합원이 될 수 없도록 하면서 일정한 예외만을 규정한 것은, 양도한 법인과 그로부터 부동산을 양수한 자의 재산권을 침해하지 않는다.","a":"O","e":"투기 억제와 주택시장의 안정을 위한 것으로, 조합원 자격을 제한하더라도 재산권을 침해한다고 볼 수 없다.","c":"헌재 2025.1.23. 2021헌마653","o":183},{"id":"c1-143","no":"143","src":"d1","part":"본문","sec":"재산권","tag":"기각","q":"가축을 살처분한 날을 기준으로 한 가축평가액의 전액을 보상금으로 지급하도록 한 것은 가축사육업자들의 재산권을 침해한다.","a":"X","e":"살처분으로 인한 손실을 전보하기 위한 것으로, 재산권을 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2025.1.23. 2021헌마1192","o":184},{"id":"c1-144","no":"144","src":"d1","part":"본문","sec":"재산권","tag":"기각","q":"AI 발병 기간에 오리에 대하여 해당 가축전염병이 최초로 발생한 날 전월 평균시세를 기준으로 살처분 보상금을 지급하도록 한 것은 가축사육업자들의 재산권을 침해한다.","a":"X","e":"보상 기준을 명확히 하여 형평을 도모하기 위한 것으로, 재산권을 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2025.1.23. 2021헌마1192","o":185},{"id":"c1-145","no":"145","src":"d1","part":"본문","sec":"재산권","tag":"기각","q":"정계에 의하여 파면된 경우에 해당하여 퇴직연금을 감액받은 사람이 퇴직 후 재임용되어 종전의 재직기간을 재임용 후의 재직기간에 합산하더라도 종전의 재직기간에 대한 퇴직연금을 합산 전과 동일하게 감액하여 지급하도록 정하고 있는 것은 청구인의 재산권과 인간다운 생활을 할 권리를 침해한다.","a":"X","e":"파면에 따른 감액의 취지를 유지하기 위한 것으로, 재산권과 인간다운 생활을 할 권리를 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2025.1.23. 2021헌마806","o":186},{"id":"c1-146","no":"146","src":"d1","part":"본문","sec":"재산권","tag":"합헌","q":"공표된 저작물을 학교교육목적으로 이용할 경우 (저작재산권자와 달리) 출판권자에게 보상금을 지급하도록 규정하지 아니한 저작권법 관련 규정은 출판권자의 재산권을 침해한다.","a":"X","e":"출판권자는 저작재산권자로부터 부여받은 권리의 범위 내에서 보호받는 지위에 있으므로, 보상금 지급 대상에서 제외하더라도 재산권을 침해한다고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2025.7.17. 2023헌가8","o":187},{"id":"c1-147","no":"147","src":"d1","part":"본문","sec":"재산권","tag":"","q":"도서관에 의한 저작물 이용과 달리 학교교육목적 저작물 이용의 경우 출판권자에게 보상금을 지급하지 않는 것은 평등원칙에 위반된다.","a":"X","e":"출판권자는 저작재산권자로부터 부여받은 권리의 범위 내에서 보호받는 지위에 있고, 도서관 이용과 학교교육목적 이용은 그 이용의 성격이 달라, 보상금을 지급하지 않는 것이 평등원칙에 위반된다고 볼 수 없다(원자료 표시 (×)).","c":"헌재 2025.7.17. 2023헌가8","o":188},{"id":"c1-148","no":"148","src":"d1","part":"본문","sec":"재산권","tag":"대법원 판례","q":"하천편입토지 보상 등에 관한 특례조치법이 정한 손실보상청구권은 헌법 제23조 제3항이 선언하고 있는 손실보상청구권을 구체화한 것으로서, 구 하천법의 시행에 의한 입법적 수용으로 인한 토지소유자의 손실을 보상하기 위한 것이므로, 손실보상을 받기 위해서는 그 사인에게 특별한 희생 내지 손실이 발생해야 하고, 재산상의 특별한 희생이나 손실이 발생했다고 할 수 없는 경우에는 손실보상을 청구할 수 없다.","a":"O","e":"손실보상은 특별한 희생에 대한 전보이므로, 재산상 특별한 희생이나 손실이 발생하지 않은 경우에는 손실보상을 청구할 수 없다.","c":"대판 2024.5.30. 2023두61707","o":189},{"id":"c1-149","no":"149","src":"d1","part":"본문","sec":"선거권","tag":"기각","q":"입법자가 사전투표제도를 형성함에 있어 국민의 선거권의 행사 등이 부당하게 제한되거나, 국민의 주권행사를 왜곡되게 반영하도록 하지 않는 한 헌법에 위반된다고 할 수 없다.","a":"O","e":"사전투표제도의 구체적 형성은 입법자의 재량에 속하므로, 선거권 행사가 부당하게 제한되거나 주권행사가 왜곡되지 않는 한 헌법에 위반된다고 할 수 없다.","c":"헌재 2023.10.26. 2022헌마231 등","o":190},{"id":"c1-150","no":"150","src":"d1","part":"본문","sec":"선거권","tag":"","q":"사전투표관리관이 투표용지의 일련번호를 배제하지 아니하고 선거인에게 교부하도록 정한 것은 선거권을 침해한다.","a":"X","e":"투표용지의 일련번호는 투표의 관리·확인을 위한 것으로, 그 교부 방식이 선거권을 침해한다고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.10.26. 2022헌마231 등","o":191},{"id":"c1-151","no":"151","src":"d1","part":"본문","sec":"선거권","tag":"기각","q":"사전투표관리관이 투표용지에 자신의 도장을 찍는 경우 도장의 날인을 인쇄날인으로 갈음할 수 있도록 한 「공직선거관리규칙」 조항은 헌법에 불합치하거나 불공정하여 사전투표자의 선거권을 침해한다고 볼 수 없다.","a":"O","e":"인쇄날인으로 갈음하더라도 투표의 진정성을 확인할 수 있어 선거권을 침해한다고 볼 수 없다.","c":"헌재 2023.10.26. 2022헌마232 등","o":192},{"id":"c1-152","no":"152","src":"d1","part":"본문","sec":"정치적 표현의 자유","tag":"합헌","q":"정치자금법에 정하지 않은 방법으로 정치자금을 기부받는 것을 금지하는 조항은 과잉금지원칙에 위배되어 정치인에게 기부하는 자의 정치활동 내지 정치적 표현의 자유를 침해한다.","a":"X","e":"정치자금의 투명성과 선거의 공정성을 위한 것으로, 기부 방법을 제한하더라도 정치적 표현의 자유를 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.10.26. 2020헌바402","o":193},{"id":"c1-153","no":"153","src":"d1","part":"본문","sec":"평등권","tag":"","q":"국회의원에 대해서는 상시 후원회를 통하여 정치자금을 모금할 수 있도록 한 반면, 국회의원이 아닌 원외 당협위원장 또는 국회의원선거를 준비하는 자 등은 후원회지정권자에서 제외하여 정치자금을 모금할 수 없도록 하고 이를 위반하면 처벌하는 것은 평등원칙에 위배되지 않는다.","a":"O","e":"후원회 지정권자의 범위는 정치자금 제도의 형성에 관한 입법재량에 속하고, 그 구별에 합리적 이유가 있어 평등원칙에 위배되지 않는다.","c":"헌재 2023.10.26. 2020헌바402","o":194},{"id":"c1-154","no":"154","src":"d1","part":"본문","sec":"선거권","tag":"합헌","q":"선거권제한사유를 규정한 공직선거법 제18조 제1항 제3호 중 '선거범으로서 형의 집행유예를 선고받고 그 형이 확정된 후 10년을 경과하지 아니한 자'에 관한 부분은 과잉금지원칙에 반하여 선거권을 침해한다.","a":"X","e":"선거범에 대한 선거권 제한은 선거의 공정성과 국민의 신뢰를 보호하기 위한 것으로, 필요한 범위 내에 있어 선거권을 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.10.26. 2020헌바402","o":195},{"id":"c1-155","no":"155","src":"d1","part":"본문","sec":"선거권","tag":"","q":"직무상 행위를 이용한 선거운동을 금지하는 공직선거법 제85조 제3항 중 '누구든지 종교적인 기관·단체 등의 조직 내에서의 직무상 행위를 이용하여 그 구성원에 대하여 선거운동을 하거나 하게 할 수 없다' 부분(직무이용금지조항)은 과잉금지원칙에 반하여 선거권을 침해한다.","a":"X","e":"직무상 행위를 이용한 선거운동을 금지하는 것은 선거의 공정성과 단체의 중립성을 위한 것으로, 선거권을 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.1.25. 2021헌바233 등","o":196},{"id":"c1-156","no":"156","src":"d1","part":"본문","sec":"정치적 표현의 자유","tag":"","q":"선거운동기간 전의 선거운동을 처벌하는 구 공직선거법 제254조 제2항 중 '그 밖의 집회의 방법으로 선거운동을 한 자'에 관한 부분(사전선거운동금지조항)은 과잉금지원칙에 반하여 선거운동 등 정치적 표현의 자유를 침해한다.","a":"X","e":"선거운동기간의 제한은 선거의 공정과 질서를 위한 것으로, 필요한 범위 내의 제한이어서 정치적 표현의 자유를 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2025.10.23. 2024헌바450","o":197},{"id":"c1-157","no":"157","src":"d1","part":"본문","sec":"공무담임권","tag":"","q":"과거 3년 이내의 모든 당원 경력을 법관 임용 결격사유로 정하는 「법원조직법」 해당 조항 중 '당원의 신분을 상실한 날부터 3년이 경과되지 아니한 사람'에 관한 부분은 과잉금지원칙에 반하여 공무담임권을 침해한다.","a":"O","e":"당원 경력이 있는 사람의 법관 임용을 3년간 전면적으로 배제하는 것은 침해의 최소성과 법익의 균형성을 상실하여 공무담임권을 침해한다.","c":"헌재 2024.7.18. 2021헌마460","o":198},{"id":"c1-158","no":"158","src":"d1","part":"본문","sec":"공무담임권","tag":"인용(위헌)","q":"아동·청소년이용음란물임을 알면서 이를 소지한 죄로 형을 선고받아 그 형이 확정된 사람은 일반직공무원으로 임용될 수 없도록 규정한 「국가공무원법」 및 「지방공무원법」 조항은 그 형이 확정된 사람의 공무담임권을 침해한다.","a":"O","e":"아동·청소년이용음란물 소지죄로 형이 확정된 사람을 일률적으로 공무원 임용에서 배제하는 것은 침해의 최소성과 법익의 균형성을 상실하여 공무담임권을 침해한다.","c":"헌재 2023.6.29. 2020헌마1605 등","o":199},{"id":"c1-158V","no":"158-2","src":"d1","part":"변형","sec":"공무담임권","tag":"변형지문","q":"아동·청소년이용음란물임을 알면서 이를 소지한 죄로 형을 선고받아 그 형이 확정된 사람은 일반직공무원으로 임용될 수 없도록 규정한 「국가공무원법」 및 「지방공무원법」 조항은 그 형이 확정된 사람의 공무담임권을 침해하지 않는다.","a":"X","e":"일률적으로 임용을 배제하는 것은 공무담임권을 침해한다(원자료 표시 (×)).","c":"헌재 2023.6.29. 2020헌마1605 등","o":200},{"id":"c1-159","no":"159","src":"d1","part":"본문","sec":"공무담임권","tag":"기각","q":"교육부 및 그 소속기관에서 근무하는 교육연구사 선발에 수석교사가 응시할 수 없도록 응시자격을 제한한 것은 수석교사의 공무담임권을 제한하지만 침해하지는 않는다.","a":"O","e":"수석교사의 전문성과 직무의 특수성을 고려한 것으로, 응시자격 제한이 공무담임권을 침해한다고 볼 수 없다.","c":"헌재 2023.2.23. 2017헌마604","o":201},{"id":"c1-160","no":"160","src":"d1","part":"본문","sec":"공무담임권","tag":"각하","q":"지방자치단체 공무원이 연구기관이나 교육기관 등에서 연수하기 위한 휴직기간은 2년 이내로 한다고 규정한 「지방공무원법」 조항은 연수휴직 기간의 상한을 제한하는 내용으로, 공직 취임의 기회를 배제하거나 공무원 신분을 박탈하는 것과는 관련이 없으므로, 휴직조항으로 인하여 공무담임권이 침해될 가능성을 인정하기 어렵다.","a":"O","e":"연수휴직 기간의 상한을 정한 것은 공무담임권과 관련성이 없어 기본권 침해 가능성을 인정할 수 없으므로 부적법하다.","c":"헌재 2024.2.28. 2020헌마1377","o":202},{"id":"c1-161","no":"161","src":"d1","part":"본문","sec":"청원권","tag":"기각","q":"국회에 제출한 청원서의 일반인에 대한 공개를 위해 30일 이내에 100명 이상의 찬성을 받도록 하고, 그 청원서가 일반인에게 공개되면 그로부터 30일 이내에 10만 명 이상의 동의를 받도록 한 「국회청원심사규칙」 규정들은 청원권을 제한하며 침해한다.","a":"X","e":"청원의 성립 요건을 정한 것으로, 청원권의 본질적 내용을 침해하지 않으므로 필요한 범위 내의 제한이다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.3.23. 2018헌마460 등","o":203},{"id":"c1-161V","no":"161-2","src":"d1","part":"변형","sec":"청원권","tag":"변형지문","q":"국회에 제출한 청원서의 일반인 공개를 위해 30일 이내에 100명 이상의 찬성을 받도록 하고 30일 이내에 10만 명 이상의 동의를 받도록 한 「국회청원심사규칙」 규정들은 청원권의 본질적 내용을 침해한다.","a":"X
