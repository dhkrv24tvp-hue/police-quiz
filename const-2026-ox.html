","e":"청원 성립의 요건을 정한 것으로 청원권을 제한하지만 침해하지 않는다(원자료 표시 (×)).","c":"헌재 2023.3.23. 2018헌마460 등","o":204},{"id":"c1-162","no":"162","src":"d1","part":"본문","sec":"재판청구권","tag":"","q":"헌법 제27조 제5항은 형사피해자의 재판절차진술권을 보장하고 있고, 형사피해자의 재판절차진술권을 어떠한 내용으로 구체화할 것인가에 관하여는 입법자에게 입법형성의 자유가 부여되어 있으므로, 그것이 재량의 범위를 넘어 명백히 불합리한 경우에 비로소 위헌의 문제가 생길 수 있다.","a":"O","e":"형사피해자의 재판절차진술권의 구체화는 입법형성의 자유에 속하고, 명백히 불합리한 경우에 비로소 위헌이 문제된다.","c":"헌재 2024.6.27. 2020헌마468 등","o":205},{"id":"c1-163","no":"163","src":"d1","part":"본문","sec":"재판청구권","tag":"헌법불합치","q":"친족상도례를 규정한 형법 제328조 제1항은 여러 사정들을 전혀 고려하지 아니한 채 법관으로 하여금 일정 범죄를 제외한 재산적 죄의 경우 형면제 판결을 선고하도록 획일적으로 규정하여, 대부분의 사안에서 기소가 이루어지지 않고 있어 형사피해자는 재판절차에 참여할 기회를 상실하고, 결국 형사피해자의 재판절차진술권을 침해한다.","a":"O","e":"친족상도례를 획일적으로 규정하여 형사피해자가 재판절차에 참여할 기회를 상실하게 한 것은 입법재량을 명백히 일탈하여 형사피해자의 재판절차진술권을 침해한다. 헌법재판소는 적용중지 헌법불합치결정을 하였다.","c":"헌재 2024.6.27. 2020헌마468 등","o":206},{"id":"c1-164","no":"164","src":"d1","part":"본문","sec":"재판청구권","tag":"합헌","q":"'직계혈족, 배우자, 동거친족, 동거가족 또는 그 배우자' 이외의 친족 사이의 재산범죄를 친고죄로 규정한 「형법」 제328조 제2항은 일정한 친족 사이에서 발생한 재산범죄의 경우 피해자의 고소를 소추조건으로 정하여 피해자의 의사에 따라 국가형벌권 행사가 가능하도록 한 것으로서 합리적 이유가 있다.","a":"O","e":"피해자의 의사에 따라 소추가 가능하도록 한 것은 친족 간의 화합과 피해자의 의사를 존중하기 위한 것으로 합리적 이유가 있다.","c":"헌재 2024.6.27. 2023헌바449","o":207},{"id":"c1-164V","no":"164-2","src":"d1","part":"변형","sec":"재판청구권","tag":"변형지문","q":"'직계혈족, 배우자, 동거친족, 동거가족 또는 그 배우자' 이외의 친족 사이의 재산범죄를 친고죄로 규정한 「형법」 제328조 제2항은 형사피해자의 재판절차진술권을 침해한다.","a":"X","e":"피해자의 고소를 소추조건으로 정한 것은 합리적 이유가 있어 재판절차진술권을 침해하지 않는다(원자료 표시 (×)).","c":"헌재 2024.6.27. 2023헌바449","o":208},{"id":"c1-165","no":"165","src":"d1","part":"본문","sec":"신체의 자유","tag":"각하","q":"외국인이 출입국관리법에 의하여 보호처분을 받아 수용되었다가 이후 난민인정을 받은 경우 및 법무상 근거 없이 송환대기실에 수용되었던 경우에 대하여 보상을 해주어야 할 입법의무를 헌법이 부여하고 있다거나 헌법해석상 그러한 입법의무가 발생하였다고 볼 수 없다.","a":"O","e":"보상에 관한 입법의무가 헌법상 도출되지 않으므로, 그 부작위에 대한 헌법소원은 허용되지 않는다.","c":"헌재 2024.1.25. 2020헌바475 등","o":209},{"id":"c1-166","no":"166","src":"d1","part":"본문","sec":"재판청구권","tag":"기각","q":"교정시설의 장이 미결수용자에게 교정시설 내 규율위반에 대해 징벌을 부과한 뒤 그 규율위반 내용 및 징벌처분 결과 등을 관할 법원에 양형 참고자료로 통보한 것은 재판청구권을 제한한다.","a":"X","e":"징벌처분 결과의 통보는 양형 참고자료 제공에 그치는 것으로, 재판청구권을 제한한다고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.9.26. 2022헌마926","o":210},{"id":"c1-166V","no":"166-2","src":"d1","part":"변형","sec":"재판청구권","tag":"변형지문","q":"교정시설의 장이 미결수용자의 규율위반 내용 및 징벌처분 결과 등을 관할 법원에 양형 참고자료로 통보한 것은 재판청구권을 제한한다.","a":"X","e":"양형 참고자료 제공에 그치는 것으로 재판청구권을 제한하지 않는다(원자료 표시 (×)).","c":"헌재 2023.9.26. 2022헌마926","o":211},{"id":"c1-167","no":"167","src":"d1","part":"본문","sec":"재판청구권","tag":"기각","q":"「조세범 처벌절차법」에 따른 통고처분을 행정쟁송의 대상에서 제외시킨 「국세기본법」 제55조 제1항 단서 제1호는 재판청구권을 침해한다고 할 수 없다.","a":"O","e":"통고처분은 그 자체로 납부를 강제하는 처분이 아니고 이의가 있으면 형사절차에서 다툴 수 있으므로, 행정쟁송에서 제외하더라도 재판청구권을 침해하지 않는다.","c":"헌재 2024.4.25. 2022헌마251","o":212},{"id":"c1-168","no":"168","src":"d1","part":"본문","sec":"재판청구권","tag":"합헌","q":"기피신청에 대한 결정이 확정되기 전에 기피신청을 당한 법관으로 하여금 소송절차를 정지시키지 않고 종국판결을 선고할 수 있도록 하는 「민사소송법」 제48조 단서 중 '종국판결을 선고하거나'에 관한 부분은 공정한 재판을 받을 권리를 침해한다.","a":"X","e":"기피신청이 남용되는 것을 막고 소송의 지연을 방지하기 위한 것으로, 공정한 재판을 받을 권리를 침해하지 않는다. 다만 기피신청인에게 불복의 기회가 보장된다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"","o":213},{"id":"c1-168V","no":"168-2","src":"d1","part":"변형","sec":"재판청구권","tag":"변형지문","q":"기피신청에 대한 결정이 확정되기 전에 기피신청을 당한 법관이 소송절차를 정지하지 않고 종국판결을 선고할 수 있도록 한 「민사소송법」 제48조는 기피신청인에게 불공정한 재판을 받을 위험을 감수하게 하여 기피신청인의 공정한 재판을 받을 권리를 침해한다.","a":"X","e":"소송 지연 방지를 위한 것으로, 기피신청인의 공정한 재판을 받을 권리를 침해하지 않는다(원자료 표시 (×)).","c":"","o":214},{"id":"c1-169","no":"169","src":"d1","part":"본문","sec":"재판청구권","tag":"합헌","q":"피고인이 정식재판을 청구한 사건에 대하여 약식명령의 형보다 중한 종류의 형을 선고하지 못하도록 하는 형사소송법 제457조의2 제1항은 공정한 재판을 받을 권리를 침해한다.","a":"X","e":"정식재판을 청구하였다는 이유로 불이익을 받지 않도록 한 것으로, 피고인의 방어권을 보장하기 위한 것이어서 공정한 재판을 받을 권리를 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.5.30. 2021헌바6 등","o":215},{"id":"c1-169V","no":"169-2","src":"d1","part":"변형","sec":"재판청구권","tag":"변형지문","q":"피고인이 정식재판을 청구한 사건에 대하여 약식명령의 형보다 중한 종류의 형을 선고하지 못하도록 한 형사소송법 제457조의2 제1항은, 피고인만이 정식재판을 청구할 수 있도록 하고 검사에게는 청구권을 주지 않아 검사의 공소권을 침해한다.","a":"X","e":"정식재판청구권은 피고인의 권리로, 그 제한에 관한 규정이 검사의 공소권을 침해한다고 볼 수 없다(원자료 표시 (×)).","c":"헌재 2024.5.30. 2021헌바6 등","o":216},{"id":"c1-170","no":"170","src":"d1","part":"본문","sec":"국가배상청구권","tag":"합헌","q":"순직한 군인의 유족이 다른 법령에 따라 보상을 지급받을 수 있을 때에는 국가에 대하여 손해배상을 청구할 수 없도록 규정한 국가배상법 제2조 제1항 단서 중 '직무 집행과 관련하여 순직한 군인의 유족'에 관한 부분은 헌법 제29조 제2항의 위임범위를 일탈한 것이 아니다.","a":"O","e":"군인 등의 이중배상을 금지하려는 헌법 제29조 제2항의 취지에 부합하는 것으로, 그 위임범위를 일탈하였다고 볼 수 없다.","c":"헌재 2024.8.29. 2021헌마86 등","o":217},{"id":"c1-171","no":"171","src":"d1","part":"본문","sec":"인간다운 생활을 할 권리","tag":"합헌","q":"육아휴직 급여 신청기간을 제한한 고용보험법 제70조 제2항 본문 중 '육아휴직이 끝난 날 이후 12개월 이내에 신청하여야 한다' 부분은 인간다운 생활을 할 권리와 재산권을 제한하지만 침해한다.","a":"X","e":"육아휴직 급여의 신청기간을 정하여 급여 제정의 안정성과 권리관계의 조기 확정을 도모하기 위한 것으로, 인간다운 생활을 할 권리와 재산권을 제한하지만 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.2.23. 2018헌바240","o":218},{"id":"c1-172","no":"172","src":"d1","part":"본문","sec":"인간다운 생활을 할 권리","tag":"기각","q":"일반인과 달리 공무원에게 재해보상을 위하여 실시되는 급여의 종류로 휴업급여 또는 상병보상연금 규정을 두고 있지 않은 것은 인간다운 생활을 할 권리를 침해하지 않고, 평등권을 침해하지도 않는다.","a":"O","e":"공무원 재해보상제도는 일반 근로자와 다른 체계로 운영되고 있어 그 차이에 합리적 이유가 있으므로, 인간다운 생활을 할 권리나 평등권을 침해하지 않는다.","c":"헌재 2024.2.28. 2020헌마1587","o":219},{"id":"c1-173","no":"173","src":"d1","part":"본문","sec":"인간다운 생활을 할 권리","tag":"기각","q":"재요양을 받는 경우에 재요양 당시의 임금을 기준으로 휴업급여를 산정하도록 한 구 「산업재해보상보험법」 조항은 전 직 근로자의 인간다운 생활을 할 권리를 침해하지 아니한다.","a":"O","e":"재요양 당시의 임금을 기준으로 급여를 산정하는 것은 급여의 형평과 재정의 건전성을 위한 것으로, 인간다운 생활을 할 권리를 침해하지 않는다.","c":"헌재 2024.4.25. 2021헌마316","o":220},{"id":"c1-174","no":"174","src":"d1","part":"본문","sec":"인간다운 생활을 할 권리","tag":"기각","q":"자동차사고 피해가족 중 유자녀에 대한 대출을 규정한 구 「자동차손해배상 보장법 시행령」 중 '유자녀의 경우에는 생계유지 및 학업을 위한 자금의 대출' 부분은 인간다운 생활을 할 권리를 침해한다.","a":"X","e":"대출의 방식으로 유자녀를 지원하는 것은 입법형성의 범위 내에 있고, 유자녀의 이동·생계에 불이익이 생긴다고 볼 수 없어 인간다운 생활을 할 권리를 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.4.25. 2021헌마473","o":221},{"id":"c1-174V","no":"174-2","src":"d1","part":"변형","sec":"인간다운 생활을 할 권리","tag":"변형지문","q":"자동차사고 피해가족 중 유자녀에 대한 대출을 규정한 구 「자동차손해배상 보장법 시행령」 조항 중 '유자녀의 경우에는 생계유지 및 학업을 위한 자금의 대출' 부분은, 대출을 신청한 법정대리인이 상환의무를 부담하지 않으므로 유자녀의 이동으로서의 인간다운 생활을 할 권리를 침해한다.","a":"X","e":"법정대리인이 상환의무를 부담하지 않는 점 등에 비추어 유자녀의 인간다운 생활을 할 권리를 침해한다고 볼 수 없다(원자료 표시 (×)).","c":"헌재 2024.4.25. 2021헌마473","o":222},{"id":"c1-175","no":"175","src":"d1","part":"본문","sec":"인간다운 생활을 할 권리","tag":"","q":"공영방송은 사회·문화·경제적 약자나 소외계층이 마땅히 누려야 할 문화에 대한 접근기회를 보장하여 인간다운 생활을 할 권리를 실현하는 기능을 수행하므로 우리 헌법상 그 존립가치와 책무가 크다.","a":"O","e":"공영방송은 소외계층의 문화 접근기회를 보장하는 기능을 수행하므로 헌법상 존립가치와 책무가 크다.","c":"헌재 2024.5.30. 2023헌마820 등","o":223},{"id":"c1-176","no":"176","src":"d1","part":"본문","sec":"인간다운 생활을 할 권리","tag":"대법원 판례","q":"장애인의 접근권은 헌법상 인간의 존엄과 가치 및 행복을 추구할 권리를 장애인에게도 동등하게 보장하고, 사회적 약자인 장애인이 인간다운 생활을 하는 데 필수적인 전제가 되는 권리로서, 비록 헌법에 명시되지는 않았으나 헌법 규정들로부터 도출되는 기본권으로서의 지위를 가지며, 국가는 제한된 재정 능력과 사회·경제적 발전 수준 등을 고려하여 장애인에 대한 접근권이 적절히 보장되도록 필요한 조치를 취할 의무가 있다.","a":"O","e":"장애인의 접근권은 헌법 규정들로부터 도출되는 기본권으로서의 지위를 가지고, 국가는 재정 능력 등을 고려하여 필요한 조치를 취할 의무가 있다.","c":"대판[전] 2024.12.19. 2022다289051","o":224},{"id":"c1-177","no":"177","src":"d1","part":"본문","sec":"인간다운 생활을 할 권리","tag":"","q":"장애인의 접근권은 비장애인과 동등한 수준의 접근을 보장할 수 있는 특정 시설과 설비를 설치할 것을 국가나 사인에게 적극적으로 요구할 수 있는 권리를 포함하므로, 그와 같은 권리의 내용을 구체화하는 법률은 필요하지 않다.","a":"X","e":"장애인의 접근권이 사인에게 적극적으로 요구할 수 있는 권리로 구체화되기 위해서는 이를 위한 법률이 필요하다(원자료 표시 (×)).","c":"대판[전] 2024.12.19. 2022다289051","o":225},{"id":"c1-178","no":"178","src":"d1","part":"본문","sec":"교육을 받을 권리","tag":"각하","q":"헌법 제31조 제1항과 제6항은 변호사시험을 준비하는 법학전문대학원 졸업생에 대하여 법학전문대학원에서의 보수교육을 시행하도록 하는 내용의 구체적이고 명시적인 입법의무를 입법자에게 부여하고 있다고 볼 수 없다.","a":"O","e":"헌법 규정만으로는 위와 같은 명시적 입법의무를 도출할 수 없으므로 부작위에 대한 헌법소원은 허용되지 않는다.","c":"헌재 2024.1.25. 2021헌마113 등","o":226},{"id":"c1-179","no":"179","src":"d1","part":"본문","sec":"교육을 받을 권리","tag":"기각","q":"지방대학 한의과대학의 입학자 중 해당지역출신자의 최소 입학 비율을 규정한 것은 과잉금지원칙에 반하여 직업선택의 자유와 균등하게 교육을 받을 권리를 침해하지 않는다. 또한 신뢰보호원칙에 반하지도 않는다.","a":"O","e":"지역 인재의 양성과 의료 불균형 해소를 위한 것으로, 기본권을 침해한다고 볼 수 없고 신뢰보호원칙에도 반하지 않는다.","c":"헌재 2025.7.17. 2021헌마1572","o":227},{"id":"c1-180","no":"180","src":"d1","part":"본문","sec":"교육을 받을 권리","tag":"기각","q":"부모가 자신의 자녀들이 재학 중인 공립 초등학교 교정에 설치된 단군상을 철거해 줄 것을 요청하였으나 이를 거부한 피청구인(초등학교장)의 거부행위는 정교분리원칙을 위반하여 자녀교육권을 침해한다고 볼 수 없다.","a":"O","e":"단군상은 역사적·문화적 상징으로 보존될 수 있고, 이를 활용한 종교교육이나 종교단체의 포교 사실이 발견되지 않았으므로 정교분리원칙 위반도 교육권 침해도 아니다.","c":"헌재 2025.9.25. 2022헌마124","o":228},{"id":"c1-181","no":"181","src":"d1","part":"본문","sec":"근로의 권리·근로3권","tag":"기각","q":"특수경비원의 파업·태업 그 밖에 경비업무의 정상적인 운영을 저해하는 일체의 쟁의행위를 금지하는 경비업법 제15조 제3항은 청구인들의 단체행동권을 침해한다.","a":"X","e":"특수경비업무의 공공성과 국가안전보장·질서유지의 필요에 비추어 쟁의행위를 금지하더라도 단체행동권을 침해한다고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.3.23. 2019헌마937","o":229},{"id":"c1-182","no":"182","src":"d1","part":"본문","sec":"근로의 권리·근로3권","tag":"기각","q":"특수형태근로종사자들을 위해 '고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률'의 위임에 따른 대통령령을 제정하지 아니한 행정입법부작위는 근로의 권리를 침해한다.","a":"X","e":"입법자와 행정청에게는 제도 형성의 재량이 있고, 대통령령을 제정하지 않은 것이 근로의 권리를 침해한다고 볼 수 없다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2023.10.26. 2020헌마93","o":230},{"id":"c1-183","no":"183","src":"d1","part":"본문","sec":"근로의 권리·근로3권","tag":"","q":"단체행동권은 단체행동권 보장 자체만으로 헌법적 보장의 목적을 달성할 수 있는 자기 목적적인 기본권이 아니다.","a":"O","e":"단체행동권은 국가가 직접 노사관계에 개입하여 근로자들의 협상력을 대등하게 만들어 줌으로써 집단적 노사관계의 자율적 형성과 실질적 자치를 달성하기 위하여 인정되는 기본권이므로, 자기 목적적 기본권이 아니다.","c":"헌재 2022.5.26. 2012헌바66","o":231},{"id":"c1-183V","no":"183-2","src":"d1","part":"변형","sec":"근로의 권리·근로3권","tag":"변형지문","q":"단체행동권은 단체행동권 보장 자체만으로 헌법적 보장의 목적을 달성할 수 있는 자기 목적적인 기본권에 해당한다.","a":"X","e":"단체행동권은 자기 목적적 기본권이 아니다(원자료 표시 (×)).","c":"헌재 2022.5.26. 2012헌바66","o":232},{"id":"c1-184","no":"184","src":"d1","part":"본문","sec":"환경권","tag":"헌법불합치","q":"정부가 '국가 온실가스 배출량을 2030년까지 2018년의 국가 온실가스 배출량 대비 35퍼센트 이상의 범위에서 대통령령으로 정하는 비율만큼 감축하는 것'을 '중장기 국가 온실가스 감축 목표'로 하도록 규정한 '기후위기 대응을 위한 탄소중립·녹색성장 기본법' 제8조 제1항은 환경권을 침해한다.","a":"O","e":"2031년부터 2049년까지의 감축목표에 관하여 어떤 형태의 정량적 기준도 제시하지 않은 것은 과소보호금지원칙 및 법률유보원칙에 반하여 기본권 보호의무를 위반한 것으로 환경권을 침해한다.","c":"헌재 2024.8.29. 2020헌마389 등","o":233},{"id":"c1-185","no":"185","src":"d1","part":"본문","sec":"환경권","tag":"","q":"국가가 국민의 건강하고 쾌적한 환경에서 생활할 권리에 관한 보호의무를 다하지 않았는지를 헌법재판소가 심사할 때에는 이른바 '과소보호금지원칙'의 위반 여부를 기준으로 삼아야 하는바, 개별 사례에서 과소보호금지원칙 위반 여부는 기본권 침해가 예상되어 보호가 필요한 '위험상황'에 대응하는 '보호조치'의 내용이 문제 되는 위험상황의 성격에 상응하는 보호조치로서 필요한 최소한의 성격을 갖고 있는지에 따라 판단한다.","a":"O","e":"환경권에 관한 국가의 보호의무는 과소보호금지원칙에 따라 심사하고, 위험상황에 상응하는 최소한의 보호조치인지를 기준으로 판단한다.","c":"헌재 2024.8.29. 2020헌마389 등","o":234},{"id":"c1-186","no":"186","src":"d1","part":"본문","sec":"환경권","tag":"","q":"이러한 위험상황의 성격 등은 '과학적 사실'과 '국제기준'에 근거하여 객관적으로 검토되어야 한다.","a":"O","e":"기후위기와 같은 위험상황의 성격은 과학적 사실과 국제기준에 근거하여 객관적으로 검토되어야 한다.","c":"헌재 2024.8.29. 2020헌마389 등","o":235},{"id":"c1-186V","no":"186-2","src":"d1","part":"변형","sec":"환경권","tag":"변형지문","q":"개별 사례에서 기본권 침해가 예상되어 보호가 필요한 위험상황의 성격은 전지구적 기후 위기를 고려하여 국제기준에 근거하여 검토하여야 하고, 과학적 사실에 근거하여 판단할 필요는 없다.","a":"X","e":"위험상황의 성격은 과학적 사실과 국제기준 모두에 근거하여 객관적으로 검토되어야 한다(원자료 표시 (×)).","c":"헌재 2024.8.29. 2020헌마389 등","o":236},{"id":"c1-187","no":"187","src":"d1","part":"본문","sec":"환경권","tag":"기각","q":"'일상생활에서 접하게 되는 토양에서 유해중금속 등의 유해물질을 제거·방지하여 건강한 환경에서 생활할 권리'는 환경권의 한 내용을 구성한다.","a":"O","e":"토양의 유해물질로부터 건강한 환경에서 생활할 권리는 환경권의 한 내용을 구성한다.","c":"헌재 2024.4.25. 2020헌마107","o":237},{"id":"c1-188","no":"188","src":"d1","part":"본문","sec":"환경권","tag":"","q":"학교시설에서의 유해중금속 등 유해물질의 예방 및 관리 기준을 규정한 학교보건법 시행규칙에 마사토 운동장에 대한 규정을 두지 아니한 것은 청구인의 환경권을 침해한다.","a":"X","e":"마사토 운동장에 대한 기준이 없다는 사정만으로 국가의 보호의무가 과소하게 이행되었다고 평가할 수 없어 환경권을 침해하지 않는다. (이 지문은 결론 부분만 뒤집어 낸 변형으로 X이다.)","c":"헌재 2024.4.25. 2020헌마107","o":238},{"id":"c1-189","no":"189","src":"d1","part":"본문","sec":"혼인과 가족생활","tag":"헌법불합치","q":"'혼인 중 여자와 남편 아닌 남자 사이에서 출생한 자녀에 대한 생부의 출생신고'를 허용하도록 규정하지 아니한 것은 혼인 외 출생자인 청구인들의 태어난 즉시 '출생등록될 권리'를 침해한다.","a":"O","e":"혼인 외 출생자가 출생신고를 할 수 있는 방법이 마련되어 있지 않아 태어난 즉시 출생등록될 권리를 침해한다.","c":"헌재 2023.3.23. 2021헌마975","o":239},{"id":"c1-190","no":"190","src":"d1","part":"본문","sec":"혼인과 가족생활","tag":"","q":"'혼인 중 여자와 남편 아닌 남자 사이에서 출생한 자녀에 대한 생부의 출생신고'를 허용하도록 규정하지 아니한 것은 생부인 청구인들의 평등권을 침해하는 것은 아니다.","a":"O","e":"생부는 출생자와의 혈연관계에 대한 확인이 필요할 수 있고, 가족관계등록법은 모를 중심으로 출생신고를 규정하고 있어 합리적 이유가 있으므로 생부의 평등권을 침해하지 않는다.","c":"헌재 2023.3.23. 2021헌마975","o":240},{"id":"c1-190V","no":"190-2","src":"d1","part":"변형","sec":"혼인과 가족생활","tag":"변형지문","q":"태어난 즉시 '출생등록될 권리'는 헌법상의 기본권이 아니라 법률상 권리이므로, '혼인 중 여자와 남편 아닌 남자 사이에서 출생한 자녀에 대한 생부의 출생신고'를 허용하도록 규정하지 아니한 것은 헌법상 문제되지 않는다.","a":"X","e":"태어난 즉시 출생등록될 권리는 헌법상 기본권이므로, 그를 침해하는 것은 헌법상 문제된다(원자료 표시 (×)).","c":"헌재 2023.3.23. 2021헌마975","o":241},{"id":"c1-191","no":"191","src":"d1","part":"본문","sec":"혼인과 가족생활","tag":"기각","q":"국가에게 혼인과 가족생활의 보호자로서 부모의 자녀양육을 지원할 헌법상 과제가 부여되어 있다 하더라도, 그로부터 곧바로 헌법이 국가에게 자녀를 양육하는 모든 병역의무 이행자들의 출퇴근 복무를 보장하여 자녀가 있는 대체복무요원들까지 합숙복무의 예외를 인정하여야 할 명시적인 입법의무를 부여하였다고 할 수는 없다.","a":"O","e":"자녀 양육 지원의 헌법상 과제로부터 자녀가 있는 대체복무요원에게 합숙복무의 예외를 인정할 명시적 입법의무가 곧바로 도출되지는 않는다.","c":"헌재 2024.5.30. 2021헌마117 등","o":242},{"id":"c2-001","no":"001","src":"d2","part":"본문","sec":"법치주의","tag":"합헌","q":"공급대상자 지위의 사전 전매계약이 무효임에도 불구하고, 그에 기초하여 공급대상자의 지위를 양수받은 자가 사업시행자로부터 소유권이전등기를 완료한 경우에는 해당 택지에 대한 소유권을 취득한 것으로 보는 택지개발촉진법 관련조항은 명확성원칙에 위배되지 않고, 진정소급입법으로서 헌법 제13조 제2항에 반하지 않는다.","a":"O","e":"심판대상조항은 소유권 취득에 대한 법적 평가를 시행 전 시점으로 소급하여 변경하므로 진정소급입법에 해당하나, 수범자가 예측했던 법적 결과가 실현되고 복잡한 원상회복관계가 간명하게 종료되며 침해되는 신뢰이익이 사실상 없거나 극히 경미한 반면 공익은 중대하다.","c":"헌재 2026.1.29. 2021헌바109 등","o":243},{"id":"c2-002","no":"002","src":"d2","part":"본문","sec":"법치주의","tag":"합헌","q":"대리점을 상대로 한 불공정행위의 제재에 대하여 '대리점거래의 공정화에 관한 법률'을 소급적용하도록 한 부칙조항은 진정소급입법에 해당하지만, 헌법 제13조 제2항의 소급입법금지원칙에 위배되지는 않는다.","a":"O","e":"이미 종료된 사실관계·법률관계에 대하여 독점규제법 대신 대리점법을 적용하기로 한 것은 진정소급입법이나, 진정소급입법을 허용할 중대한 공익적 사유가 인정되고 당사자에게 발생하는 재산적 손실은 경미하다.","c":"헌재 2026.4.29. 2020헌가18","o":244},{"id":"c2-003","no":"003","src":"d2","part":"본문","sec":"법치주의","tag":"합헌","q":"일정한 특정경제범죄로 징역형의 집행유예를 받은 사람에 대하여, 일정 기간 동안 '유죄판결된 범죄행위와 밀접한 관련이 있는 기업체'에 취업을 금지하면서 법무부장관의 승인을 받은 경우에만 취업할 수 있도록 규정한 취업제한조항은 법률유보원칙에 반하지 않고, 과잉금지원칙에 위반되지 않으므로 직업선택의 자유를 침해하지 않는다.","a":"O","e":"취업승인은 이미 발생한 취업제한의 효과를 예외적 승인으로 해제하는 것으로 수혜적 측면이 있어 그 요건·기준이 반드시 법률로 정해져야 하는 본질적 사항이라고 보기 어렵다. 과잉금지원칙에도 위배되지 않는다.","c":"헌재 2026.2.26. 2021헌바46","o":245},{"id":"c2-004","no":"004","src":"d2","part":"본문","sec":"권력분립원칙","tag":"합헌","q":"환경부령으로 정하는 재활용시설 운영 기준을 위반하여 재활용시설을 운영한 자를 300만 원 이하의 벌금에 처하도록 한 구 '가축분뇨의 관리 및 이용에 관한 법률' 관련조항은 포괄위임금지원칙에 반하지 않는다.","a":"O","e":"재활용시설의 운영 기준은 고도의 전문적·기술적 판단이 필요하여 입법기술상 일일이 규정하기 곤란하고, 처리 현황이나 기술 변화에 탄력적으로 대응할 필요가 있어 하위법령에 위임할 필요성이 인정된다.","c":"헌재 2026.2.26. 2023헌바60","o":246},{"id":"c2-005","no":"005","src":"d2","part":"본문","sec":"헌법의 기본원리","tag":"합헌","q":"수신된 전자문서가 작성자 또는 그 대리인과의 관계에 의하여 수신자가 그것이 작성자 또는 그 대리인의 의사에 기한 것이라고 믿을 만한 정당한 이유가 있는 자에 의하여 송신된 경우 해당 전자문서의 수신자는 전자문서에 포함된 의사표시를 작성자의 것으로 보아 행위할 수 있다고 규정한 것은 명확성원칙, 사적자치의 원칙, 자기책임의 원리, 과잉금지원칙에 위배되지 않는다.","a":"O","e":"전자문서의 의사표시 귀속에 관한 위 규정은 명확성원칙과 사적자치·자기책임의 원리, 과잉금지원칙에 위배되지 않는다.","c":"헌재 2026.2.26. 2020헌바583","o":247},{"id":"c2-006","no":"006","src":"d2","part":"본문","sec":"책임과 형벌간의 비례원칙","tag":"위헌","q":"병역의무자 본인 부재 시 병력동원훈련소집 통지서를 수령하여 이를 전달할 의무가 있는 사람이 정당한 사유 없이 병역의무자에게 소집 통지서를 전달하지 아니한 경우 형사처벌을 하는 구 병역법 조항 중 해당 부분은 책임과 형벌 간의 비례원칙에 위반된다.","a":"O","e":"정부의 공적 의무와 책임을 행정사무의 편의를 위하여 개인에게 전가하고, 행정절차적 협력의무 위반에 과태료가 아닌 형사처벌을 부과하여 형벌의 보충성에 반하며 책임에 비하여 처벌이 과도하다.","c":"헌재 2026.3.26. 2023헌가14","o":248},{"id":"c2-007","no":"007","src":"d2","part":"본문","sec":"책임과 형벌간의 비례원칙","tag":"위헌","q":"아동·청소년대상 성범죄의 신고의무자가 자기의 보호·감독 또는 진료를 받는 13세 미만의 미성년자에 대하여 강제추행죄를 범한 경우 그 죄에 정한 형의 2분의 1까지 가중처벌하도록 정한 '아동·청소년의 성보호에 관한 법률' 제18조는 책임과 형벌 간의 비례원칙에 위배된다.","a":"O","e":"강제추행죄는 행위 태양과 불법성의 경중이 다양함에도 법정형의 하한을 높게 정하여, 경미한 경우에도 정상참작감경으로는 충분한 형벌개별화가 불가능하게 되어 책임주의와 형벌개별화원칙에 반한다.","c":"헌재 2026.5.21. 2023헌가15","o":249},{"id":"c2-008","no":"008","src":"d2","part":"본문","sec":"책임과 형벌간의 비례원칙","tag":"합헌","q":"13세 미만의 사람에 대하여 강제추행죄를 범한 사람을 5년 이상의 유기징역에 처한다고 정한 '성폭력범죄의 처벌 등에 관한 특례법' 해당 조항은 보호법익과 죄질을 달리하는 다른 범죄들과 그 법정형을 비교하여 볼 때 형벌체계상의 정당성과 균형성을 상실하여 평등원칙에 반한다고 볼 수 없다.","a":"O","e":"13세 미만 미성년자에 대한 강제추행은 그 보호법익과 죄질이 중대하여, 다른 범죄와의 법정형 비교에서 형벌체계상 균형을 잃었다고 볼 수 없다.","c":"헌재 2025.11.27. 2022헌가39 등","o":250},{"id":"c2-009","no":"009","src":"d2","part":"본문","sec":"책임과 형벌간의 비례원칙","tag":"합헌","q":"뇌물로 약속한 액수가 1억 원 이상인 때에 무기 또는 10년 이상의 징역으로 처벌하도록 한 '특정범죄 가중처벌 등에 관한 법률' 제2조 제1항 제1호는 책임과 형벌 간의 비례원칙에 위배되지 않는다.","a":"O","e":"뇌물액 1억 원 이상은 그 불법성이 중대하여 무기 또는 10년 이상의 징역으로 처벌하더라도 책임과 형벌 간의 비례원칙에 위배되지 않는다.","c":"헌재 2025.12.18. 2023헌바40","o":251},{"id":"c2-010","no":"010","src":"d2","part":"본문","sec":"책임과 형벌간의 비례원칙","tag":"합헌","q":"구 '아동·청소년의 성보호에 관한 법률' 제11조 제5항 중 '아동·청소년이 등장하는 아동·청소년성착취물임을 알면서 이를 소지한 자'에 관한 부분은 명확성원칙에 위배되지 않고, 책임과 형벌 간의 비례원칙에 위반되지 않는다.","a":"O","e":"구성요건이 명확하고, 아동·청소년성착취물 소지를 처벌하는 것은 그 유통·수요를 억제하기 위한 것으로 책임과 형벌 간의 비례원칙에도 위반되지 않는다.","c":"헌재 2026.3.26. 2023헌바324","o":252},{"id":"c2-011","no":"011","src":"d2","part":"본문","sec":"책임과 형벌간의 비례원칙","tag":"합헌","q":"전자장치부착법 제39조 제3항이 피부착자가 준수사항을 위반한 때 형사처벌하도록 한 부분은 책임과 형벌 간의 비례원칙에 위반되지 않는다.","a":"O","e":"준수사항 위반에 대한 형사처벌은 전자장치 부착제도의 실효성을 확보하기 위한 것으로, 책임과 형벌 간의 비례원칙에 위반되지 않는다.","c":"","o":253},{"id":"c2-012","no":"012","src":"d2","part":"본문","sec":"책임과 형벌간의 비례원칙","tag":"","q":"보호관찰법상 보호관찰제도와 전자장치부착법상 전자장치 부착명령 및 준수사항 제도는 제도의 목적, 법적 성질, 대상자, 처분 내용 등에 현저한 차이가 있어 보호관찰법상 보호관찰 대상자와 전자장치부착법상 준수사항 대상자는 본질적으로 동일한 집단으로 보기 어렵다.","a":"O","e":"두 제도는 목적·법적 성질·대상자·처분 내용이 달라 본질적으로 동일한 집단으로 볼 수 없으므로 평등원칙의 비교집단이 되지 않는다.","c":"헌재 2026.5.21. 2024헌바421","o":254},{"id":"c2-013","no":"013","src":"d2","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"기각","q":"개인형 이동장치 운전자에게 원동기장치자전거 면허 이상의 운전면허 취득을 요구하고 이를 위반하면 벌금 등을 부과하는 도로교통법 규정과, 개인형 이동장치 운전자에게 그 운전자와 동승자의 인명보호 장구 착용 의무를 규정하고 그 위반 시 벌금 또는 과태료 등을 부과하는 도로교통법 규정은 일반적 행동의 자유와 평등권을 제한하지만 침해하지 않는다.","a":"O","e":"개인형 이동장치의 안전사고 방지를 위한 것으로, 일반적 행동의 자유와 평등권을 제한하지만 침해의 최소성과 법익의 균형성을 갖추어 침해하지 않는다.","c":"헌재 2025.12.18. 2021헌마946","o":255},{"id":"c2-014","no":"014","src":"d2","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"합헌","q":"음주운전 금지규정을 위반한 사람이 다시 이를 위반하여 운전면허 정지 사유에 해당된 경우 운전면허를 필요적으로 취소하도록 규정한 구 도로교통법 규정은 직업의 자유 및 일반적 행동자유권을 침해하지 않는다.","a":"O","e":"음주운전의 위험성과 재범 방지를 위한 필요적 취소는 직업의 자유와 일반적 행동자유권을 침해하지 않는다.","c":"헌재 2026.1.29. 2024헌바323 등","o":256},{"id":"c2-015","no":"015","src":"d2","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"","q":"취소조항 적용 시 음주운전 금지규정 위반행위의 횟수를 산정할 때에는 2001. 6. 30. 이후의 위반행위부터 산정한다고 규정한 것은 직업의 자유 및 일반적 행동자유권을 침해하지 않는다.","a":"O","e":"위반행위 횟수의 산정 기준일을 정한 것은 법적 안정성과 예측가능성을 위한 것으로, 직업의 자유나 일반적 행동자유권을 침해하지 않는다.","c":"헌재 2026.1.29. 2024헌바323 등","o":257},{"id":"c2-016","no":"016","src":"d2","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"합헌","q":"음주운전 금지규정을 위반하여 자동차를 운전한 사람이 다시 음주운전 금지규정을 위반하여 개인형 이동장치를 운전해서 운전면허 정지 사유에 해당된 경우 필요적으로 운전면허를 취소하도록 한 구 도로교통법 규정은 직업의 자유 및 일반적 행동자유권을 침해하지 않는다. 또한 평등원칙에 위반되지 않는다.","a":"O","e":"개인형 이동장치 음주운전도 도로에서의 위험을 초래하는 점에서 자동차 음주운전과 본질적으로 같으므로, 필요적 취소가 기본권을 침해하지 않고 평등원칙에도 위반되지 않는다.","c":"헌재 2026.1.29. 2023헌바42 등","o":258},{"id":"c2-017","no":"017","src":"d2","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"합헌","q":"모집·채용에서 합리적인 이유 없이 연령을 이유로 근로자 등을 차별한 사업주를 처벌하는 '고용상 연령차별금지 및 고령자고용촉진에 관한 법률' 관련 규정은 명확성원칙에 위배되지 않고, 과잉금지원칙을 위반하여 계약의 자유를 침해하지 않는다.","a":"O","e":"연령차별 금지라는 입법목적이 명확하고, 차별행위를 처벌하는 것이 계약의 자유를 침해한다고 볼 수 없다.","c":"헌재 2026.1.29. 2021헌바404 등","o":259},{"id":"c2-018","no":"018","src":"d2","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"기각","q":"지상파방송광고를 대행하는 광고판매대행자로 하여금 네트워크 지역지상파방송사업자 및 중소지상파방송사업자의 방송광고를 다른 지상파방송사업자의 방송광고와 일정 비율 이상 결합하여 판매하도록 규정한 '방송광고판매대행 등에 관한 법률' 관련규정은 과잉금지원칙을 위반하여 지상파방송사업자의 방송광고를 구매하고자 하는 광고주의 계약의 자유를 침해하지 않는다.","a":"O","e":"지역·중소 방송사의 재정 지원과 방송의 공익성 확보를 위한 것으로, 광고주의 계약의 자유를 제한하지만 침해한다고 볼 수 없다.","c":"헌재 2026.2.26. 2020헌마600","o":260},{"id":"c2-019","no":"019","src":"d2","part":"본문","sec":"인간의 존엄과 가치·행복추구권","tag":"기각","q":"출생신고 시 자녀의 이름에 사용할 수 있는 한자의 범위를 '통상 사용되는 한자'로 제한하고, 그 구체적인 범위는 대법원규칙에서 열거하도록 정한 것은 부모의 자녀의 이름을 지을 자유를 제한하지만 침해하지 않는다.","a":"O","e":"가족관계등록의 정확성과 전산 처리의 편의를 위한 것으로, 자녀의 이름을 지을 자유를 제한하지만 침해의 최소성과 법익의 균형성을 갖추어 침해하지 않는다.","c":"헌재 2026.4.29. 2023헌마282","o":261},{"id":"c2-020","no":"020","src":"d2","part":"본문","sec":"평등권","tag":"합헌","q":"지역가입자가 임대사업자이거나 은퇴자인 경우에도 직장가입자와 달리 지역가입자에 대하여 소득 외에 재산까지 고려하여 건강보험료를 부과하도록 한 것은 평등원칙에 위배되지 않는다.","a":"O","e":"소득 파악이 어려운 지역가입자의 특성상 재산을 고려하여 보험료를 부과하는 것은 합리적 이유가 있다.","c":"헌재 2026.2.26. 2022헌바84 등","o":262},{"id":"c2-021","no":"021","src":"d2","part":"본문","sec":"평등권","tag":"기각","q":"수업연한을 초과한 졸업유예자를 학생보류 대상에서 제외하여 지역예비군부대에 편성한다고 규정한 구 예비군 교육훈련 훈령 관련규정은 수업연한을 초과한 졸업유예자인 청구인의 평등권을 침해하지 않는다.","a":"O","e":"졸업유예자와 재학생은 예비군 편성의 기초가 되는 지위가 달라 본질적으로 동일한 집단이 아니므로 평등권을 침해하지 않는다.","c":"헌재 2026.2.26. 2024헌마838","o":263},{"id":"c2-022","no":"022","src":"d2","part":"본문","sec":"평등권","tag":"합헌","q":"'감염병의 예방 및 관리에 관한 법률' 제24조 제1항 각 호의 질병에 대한 예방접종 중 '필수예방접종'으로 사망한 사람의 유족만 국가보상의 대상으로 규정함으로써 '필수예방접종이 아닌 예방접종'으로 사망한 사람의 유족을 국가보상의 대상에서 제외하고 있는 것은 평등원칙에 반하지 않는다.","a":"O","e":"필수예방접종은 국가 차원에서 사실상 강제되고 있어 그 피해에 대한 국가의 보상 필요성이 크지만, 필수예방접종이 아닌 접종은 국가의 책임 이행이나 접종률 제고의 필요성이 상대적으로 높지 않아 차별에 합리적 이유가 있다.","c":"헌재 2026.4.29. 2023헌바420","o":264},{"id":"c2-023","no":"023","src":"d2","part":"본문","sec":"신체의 자유","tag":"기각","q":"기피신청으로 인하여 공판절차가 정지된 기간을 구속기간에 산입하지 아니하도록 하는 형사소송법 제92조 제3항 중 제22조 본문에 관한 부분은 신체의 자유를 제한하지만 침해하지 않는다.","a":"O","e":"구속 상태에서 본안재판을 심리할 수 있는 기간을 충분히 확보하고 기피제도와 구속재판제도의 실효성을 조화시키기 위한 것으로, 신체의 자유를 침해하지 않는다.","c":"헌재 2026.4.29. 2023헌마1253","o":265},{"id":"c2-024","no":"024","src":"d2","part":"본문","sec":"신체의 자유","tag":"인용(위헌확인)","q":"국가보안법위반 혐의로 체포되어 교도소에 구금된 청구인을 위해 변호인이 토요일 18:30경 체포적부심사 준비를 위한 변호인 접견을 신청하였으나, 근무시간이 아니며 사전 예약도 하지 않았고 체포적부심사가 휴일에 이루어지는 경우 수용자를 미리 법원에 출석시켜 변호인의 조력을 받을 수 있도록 하고 있음을 이유로 신청을 거부한 것은 청구인의 변호인의 조력을 받을 권리를 침해한다.","a":"O","e":"체포 상태가 종료되기 전 변호인의 조력을 받는 것이 특히 긴요하고, 방어권 행사에 불이익이 초래되었으므로 과잉금지원칙에 반하여 변호인의 조력을 받을 권리를 침해한다.","c":"헌재 2026.1.29. 2023헌마370","o":266},{"id":"c2-025","no":"025","src":"d2","part":"본문","sec":"신체의 자유","tag":"","q":"체포적부심사를 청구하고자 하는 피의자의 변호인 접견권은 변호인의 조력을 받을 권리의 필수적 내용이므로, 미결 수용자가 체포적부심사를 청구하기 위하여 변호인과 접견하려는 경우 '미결수용자의 처우를 위하여 접견이 특히 필요한 경우'로 보아 접견 시간대 외에도 접견할 수 있도록 하여야 한다.","a":"O","e":"체포적부심사 청구를 위한 변호인 접견권은 변호인의 조력을 받을 권리의 필수적 내용이므로 접견 시간대 외에도 허용되어야 한다.","c":"헌재 2026.1.29. 2023헌마370","o":267},{"id":"c2-026","no":"026","src":"d2","part":"본문","sec":"변호인의 조력을 받을 권리","tag":"대법원 판례","q":"누구든지 '체포 또는 구속을 당한 때 즉시 변호인의 조력을 받을 권리'를 가진다고 정한 헌법 제12조 제4항 등의 취지를 고려하면, 국선변호인을 반드시 선정할 상황으로 입법자가 상정한 '피고인이 구속된 때'에는 '해당 형사사건에서 구속되어 재판을 받는 경우'뿐만 아니라 별건으로 구속되었거나 다른 형사사건에서 유죄판결이 확정되어 그 판결의 집행으로 구금 상태에 있는 경우 또한 포함된다.","a":"O","e":"형사소송법 제33조 제1항 제1호의 '피고인이 구속된 때'는 해당 사건에서 구속된 경우에 한정되지 않고, 별건 구속이나 유죄판결 확정 후 구금 상태도 포함한다.","c":"대판[전] 2024.5.23. 2021도6357","o":268},{"id":"c2-027","no":"027","src":"d2","part":"본문","sec":"변호인의 조력을 받을 권리","tag":"대법원 판례","q":"피의자·피고인과 변호인 사이에 의사교환 등을 하는 과정에서 생성된 형사사건에 관한 법률자문 또는 법률상담 등이 기재된 서류나 자료 또는 물건 등에 대한 압수는 헌법상 변호인의 조력을 받을 권리 등을 침해할 소지가 있으므로, 원칙적으로 허용되어서는 아니 된다.","a":"O","e":"변호인의 조력을 받을 권리의 실효적 보장을 위한 비밀보장의 중요성에 비추어 원칙적으로 허용되지 않으며, 다만 승낙이 있거나 변호인이 공범관계에 있는 등 중대한 공익상 필요가 있는 경우에 예외적으로 허용된다.","c":"대결 2026.2.20. 2024모730","o":269},{"id":"c2-028","no":"028","src":"d2","part":"본문","sec":"집회·결사의 자유","tag":"헌법불합치","q":"집회 및 시위에 관한 법률 제6조 제1항의 사전신고조항을 위반한 것을 일률적으로 처벌하는 집회 및 시위에 관한 법률 제22조 제2항 중 제6조 제1항 본문 가운데 '옥외집회'에 관한 부분은 과잉금지원칙에 위배되어 집회의 자유를 침해한다.","a":"O","e":"타인의 기본권이나 공공의 안녕질서를 침해할 위험성이 적은 옥외집회까지 신고 위반만으로 일률 처벌하는 것은 침해의 최소성과 법익의 균형성을 상실하여 집회의 자유를 침해한다.","c":"헌재 2026.2.26. 2021헌바168 등","o":270},{"id":"c2-029","no":"029","src":"d2","part":"본문","sec":"집회·결사의 자유","tag":"","q":"구 집회 및 시위에 관한 법률 중 옥외집회를 주최하려는 자는 사전에 이를 신고하도록 하는 조항은 집회의 자유를 침해하지 아니하지만, 이를 위반한 경우 예외 없이 일률적으로 2년 이하의 징역 또는 200만 원 이하의 벌금에 처하는 조항은 과잉금지원칙에 위배되어 집회의 자유를 침해한다.","a":"O","e":"사전신고조항 자체는 합헌이나, 신고 위반을 예외 없이 형벌로 처벌하는 조항은 침해의 최소성과 법익의 균형성을 상실하여 집회의 자유를 침해한다. 위반된 것은 '처벌조항'이지 신고조항이 아니다.","c":"헌재 2026.2.26. 2021헌바168 등","o":271},{"id":"c2-030","no":"030","src":"d2","part":"본문","sec":"집회·결사의 자유","tag":"헌법불합치","q":"모든 변리사로 하여금 대한변리사회에 의무적으로 가입하도록 규정한 변리사법 제11조 중 '제5조 제1항에 따라 등록한 변리사'에 관한 부분은 과잉금지원칙에 위배되어 결사의 자유 및 직업의 자유를 침해한다.","a":"O","e":"비변호사 변리사와 변호사 변리사의 구조적 갈등에도 불구하고 단일 변리사회 의무가입을 강제하여 변호사 변리사의 의사와 이익이 소외되게 하였고, 별도 단체 설립·의무가입이라는 덜 침해적인 대안이 존재한다.","c":"헌재 2026.4.29. 2020헌바21 등","o":272},{"id":"c2-031","no":"031","src":"d2","part":"본문","sec":"집회·결사의 자유","tag":"기각","q":"단일협회로서 대한건축사협회를 두도록 하는 건축사법 관련 규정(단일협회조항)과, 건축사들에게 가입의무를 부과하는 건축사법 관련 규정(의무가입조항)은 건축사들의 결사의 자유 및 직업수행의 자유를 제한하지만 침해하지 않는다.","a":"O","e":"건축물의 안전 확보와 질적 향상이라는 입법목적이 정당하고, 단일협회를 통한 통일된 교육·규제는 이에 적합한 수단이며, 국토교통부장관의 관리·감독으로 자의적 운영을 방지하고 있어 침해하지 않는다.","c":"헌재 2025.12.18. 2022헌마279","o":273},{"id":"c2-032","no":"032","src":"d2","part":"본문","sec":"집회·결사의 자유","tag":"","q":"이미 건축사사무소개설신고가 되어 있는 건축사에게도 소급적으로 가입의무를 부과하는 의무가입조항 부칙규정은 신뢰보호원칙에 위반되지 않는다.","a":"O","e":"과거에는 협회 가입이 재량이었으나 건축물의 안전 확보를 위한 사회적 필요성이 커져 법률이 개정되었고, 그로 인한 신뢰이익의 침해는 미미하다.","c":"헌재 2025.12.18. 2022헌마279","o":274},{"id":"c2-033","no":"033","src":"d2","part":"본문","sec":"직업의 자유","tag":"기각","q":"세무사 자격 보유 변호사로 하여금 세무사로서 장부작성대행업무와 성실신고확인업무를 할 수 없도록 규정한 「세무사법」 해당 조항은 신뢰보호원칙을 위반하여 세무사 자격 보유 변호사의 직업선택의 자유를 침해한다.","a":"X","e":"세무대리업무에는 전문적 회계지식이 필요하고 변호사와 세무사의 자격 취득에 필요한 전문지식에 차이가 있어, 입법자의 판단은 수긍할 만하다. 실무교육 강화 등으로는 같은 정도의 목적을 달성하기 어려워 덜 침해적인 수단도 없고, 불이익이 공익보다 크다고 볼 수 없어 과잉금지원칙을 위반하여 직업선택의 자유를 침해하지 않는다(원자료 표시 (×), 결론은 '침해하지 않는다').","c":"헌재 2025.12.18. 2021헌마1464","o":275},{"id":"c2-034","no":"034","src":"d2","part":"본문","sec":"직업의 자유","tag":"기각","q":"대여사업용 자동차의 임차인이 임차 후 운전자가 주취, 신체부상 등의 사유로 직접 운전이 불가능한 경우에 한하여 운전자 알선이 가능하도록 한 '여객자동차 운수사업법' 관련규정은 직업의 자유를 제한하지만 침해하지 않는다.","a":"O","e":"대여사업용 자동차가 운전자 알선을 통해 사실상 택시처럼 운영되는 것을 막기 위한 것으로, 직업의 자유를 제한하지만 침해하지 않는다.","c":"헌재 2026.3.26. 2022헌마1418 등","o":276},{"id":"c2-035","no":"035","src":"d2","part":"본문","sec":"재산권","tag":"합헌","q":"투기과열지구로 지정된 구역에서 재건축사업을 시행하는 경우 조합설립인가 이후부터는 정비사업의 대상인 건축물이나 토지를 양수하더라도 조합원이 될 수 없도록 규정하면서, 이를 상속받은 경우엔 조합원이 될 수 있도록 예외로 규정한 것과 달리, 증여받은 경우는 예외로 규정하지 않는 '도시 및 주거환경정비법' 관련규정은 재산권을 침해하지 않는다.","a":"O","e":"투기 억제와 조합원 자격의 형평을 위한 것으로, 증여의 경우 예외를 두지 않았다고 하여 재산권을 침해한다고 볼 수 없다.","c":"헌재 2026.1.29. 2024헌바482","o":277},{"id":"c2-036","no":"036","src":"d2","part":"본문","sec":"재산권","tag":"합헌","q":"부적정처리폐기물이 발생한 경우 수탁자의 폐기물처리능력을 확인하지 아니하고 위탁한 사업장폐기물배출자에게 폐기물의 처리방법 변경, 폐기물의 처리 또는 반입 정지 등 필요한 조치를 명할 수 있도록 규정한 것은 사업장폐기물배출자의 재산권을 침해하지 않는다.","a":"O","e":"폐기물의 적정 처리를 확보하기 위한 것으로, 배출자에게 조치명령을 할 수 있도록 하더라도 재산권을 침해한다고 볼 수 없다.","c":"헌재 2026.2.26. 2022헌바207 등","o":278},{"id":"c2-037","no":"037","src":"d2","part":"본문","sec":"재산권","tag":"","q":"구 지적재조사에 관한 특별법 제20조 제1항에 따라 징수되는 조정금은 정책실현목적의 유도적·조정적 부담금에 해당한다.","a":"O","e":"지적재조사사업으로 특별한 경제적 이익을 얻은 사람과 그 외의 사람 사이의 형평성 문제를 조정하여 사업의 원활한 추진을 유도하기 위한 것으로, 정책실현목적의 유도적·조정적 부담금에 해당한다.","c":"헌재 2026.2.26. 2019헌바529 등","o":279},{"id":"c2-038","no":"038","src":"d2","part":"본문","sec":"재산권","tag":"","q":"지적재조사사업의 시행에 따른 경계 확정으로 지적공부상 면적이 증가된 경우, 필지별 면적 증가내역을 기준으로 조정금을 징수하도록 규정한 지적재조사법 제20조 제1항 중 '징수'에 관한 부분은 재산권을 침해하지 않는다.","a":"O","e":"객관적으로 평가된 토지면적 증가에 따른 가치 상승분에 대하여 조정금을 징수하는 것은 이해관계를 합리적으로 조정하는 것으로 재산권을 침해하지 않는다.","c":"헌재 2026.2.26. 2019헌바529 등","o":280},{"id":"c2-039","no":"039","src":"d2","part":"본문","sec":"재산권","tag":"합헌","q":"공익법인등 출연자의 특수관계인이 그 공익법인등의 임직원이 되는 경우 가산세를 부과하도록 규정한 '상속세 및 증여세법' 관련규정은 공익법인 등의 재산권을 침해하지 않는다.","a":"O","e":"공익법인이 출연자의 특수관계인에게 사적 이익을 이전하는 것을 막기 위한 것으로, 가산세 부과가 공익법인의 재산권을 침해한다고 볼 수 없다.","c":"헌재 2026.3.26. 2022헌바225 등","o":281},{"id":"c2-040","no":"040","src":"d2","part":"본문","sec":"재산권","tag":"합헌","q":"평균임금을 기준으로 유족구조금을 산정하도록 규정하고 있는 '범죄피해자 보호법' 제22조 제1항 중 '평균임금'에 관한 부분은 과잉금지원칙에 위배되어 가해자의 재산권을 침해한다고 할 수 없다.","a":"O","e":"범죄피해자의 유족을 보호하기 위한 것으로, 평균임금을 기준으로 유족구조금을 산정하더라도 가해자의 재산권을 침해한다고 볼 수 없다.","c":"헌재 2026.4.29. 2022헌바157","o":282},{"id":"c2-041","no":"041","src":"d2","part":"본문","sec":"재산권","tag":"합헌","q":"사후양자를 포함한 형사보상 청구 당시 상속인에게 형사보상금을 지급받을 권리가 귀속되도록 한 '제주 4·3사건 진상규명 및 희생자 명예회복에 관한 특별법' 제18조의2 제2항은 친생자의 재산권(상속권)을 제한하지만 침해하지는 않는다.","a":"O","e":"사후양자의 봉제사·묘소관리를 통한 희생자 예우라는 필요성이 인정되어, 친생자의 상속권을 제한하지만 침해하지 않는다.","c":"헌재 2026.4.29. 2024헌바46","o":283},{"id":"c2-042","no":"042","src":"d2","part":"본문","sec":"재산권","tag":"합헌","q":"지방자치단체가 소유하는 일반재산을 임차목적물로 하는 임대차에는 권리금 회수기회 보호에 관한 규정의 적용을 배제하도록 한 '상가건물 임대차보호법' 제10조의5 제2호 관련규정은 상가임차인의 재산권을 침해하지 않는다.","a":"O","e":"공유재산의 공익적 보호·관리 필요성을 감안한 입법으로, 입법형성권의 한계를 일탈하였다고 단정하기 어려워 재산권을 침해하지 않는다.","c":"헌재 2026.4.29. 2022헌바118","o":284},{"id":"c2-043","no":"043","src":"d2","part":"본문","sec":"재산권","tag":"합헌","q":"자산의 양도차익을 계산할 때 그 취득시기 및 양도시기에 대하여, 대금을 청산한 날이 분명하지 아니한 경우 등 대통령령으로 정하는 경우를 제외하고는 해당 자산의 '대금을 청산한 날'로 규정한 소득세법 관련규정은 재산권을 침해하지 않는다.","a":"O","e":"과세의 기준이 되는 취득·양도시기를 대금청산일로 정한 것은 과세의 명확성과 형평을 위한 것으로 재산권을 침해하지 않는다.","c":"헌재 2026.4.29. 2022헌바113","o":285},{"id":"c2-044","no":"044","src":"d2","part":"본문","sec":"재산권","tag":"합헌","q":"환경부장관 등으로 하여금 폐기물의 처리 기준과 방법 등에 맞지 아니하게 처리되는 경우 등에 기간을 정하여 폐기물의 처리방법 변경, 폐기물의 처리 등 필요한 조치를 명할 수 있도록 하는 조치명령조항과 위 조치명령을 받은 자가 그 명령을 이행하지 아니하면 행정대집행법에 따라 대집행을 하고 그 비용을 징수할 수 있도록 하는 비용징수조항은 토지소유자의 재산권을 침해한다고 할 수 없다.","a":"O","e":"폐기물의 적정 처리와 환경 보전을 위한 것으로, 조치명령과 대집행 비용의 징수는 재산권을 침해한다고 볼 수 없다.","c":"헌재 2026.5.21. 2020헌바559 등","o":286},{"id":"c2-045","no":"045","src":"d2","part":"본문","sec":"재산권","tag":"합헌","q":"근로소득을 '근로를 제공함으로써 받는 봉급·급료·보수·세비·임금·상여·수당과 이와 유사한 성질의 급여'라고 규정하고, '이와 유사한 성질의 급여'에 복지포인트가 포함되어 과세대상인 근로소득에 해당함을 전제로 하는 것은 과세요건명확주의에 위반된다고 볼 수 없다.","a":"O","e":"복지포인트가 근로의 대가로 지급되는 급여에 해당한다는 점이 충분히 예측 가능하여 과세요건명확주의에 위반되지 않는다.","c":"헌재 2026.6.24. 2024헌바83","o":287},{"id":"c2-046","no":"046","src":"d2","part":"본문","sec":"선거권과 선거제도","tag":"위헌","q":"구 공직선거법 중 비례대표국회의원선거에서 전국 유효투표 총수의 100분의 3 이상을 득표한 정당에게만 비례대표국회의원 의석을 배분하도록 한 조항(저지조항)은 우리 정치상황 등을 고려할 때 평등선거원칙에 위배하여 선거권, 피선거권, 평등권을 침해한다.","a":"O","e":"우리나라는 원내 군소정당의 난립을 막을 필요성이 적고, 저지조항은 저지선을 넘지 못한 정당에 대한 투표를 사표로 만들어 투표의 성과가치를 차별하며 정치적 다양성과 개방성을 훼손한다.","c":"헌재 2026.1.29. 2020헌마956 등","o":288},{"id":"c2-047","no":"047","src":"d2","part":"본문","sec":"선거권과 선거제도","tag":"헌법불합치","q":"문자메시지를 이용한 조합장 선거운동에서 문자 외의 음성·화상·동영상 등을 문자메시지에 포함하지 못하도록 규정한 구 '공공단체 등 위탁선거에 관한 법률' 관련규정은 과잉금지원칙을 위반하여 단체의 기관 구성에 관한 결사의 자유 및 조합장선거 후보자의 표현의 자유를 침해한다.","a":"O","e":"정보 전달에 유용한 멀티메시지를 일률적으로 금지하는 것은 과도한 제한이고, 전송횟수 제한 등 덜 침해적인 대안이 존재한다.","c":"헌재 2026.4.29. 2020헌바349 등","o":289},{"id":"c2-048","no":"048","src":"d2","part":"본문","sec":"선거권과 선거제도","tag":"합헌·기각","q":"선거운동기간 내에만 문자메시지를 이용한 지지 호소를 허용하고 위반 시 이를 처벌하도록 한 농업협동조합법 제50조 제7항 중 제4항 제4호 가운데 '비상임이사 선거와 관련하여 문자메시지를 이용한 지지 호소' 부분은 결사의 자유 및 표현의 자유를 제한하지만 침해하지 않는다.","a":"O","e":"선거운동기간 내의 문자메시지 지지 호소를 허용하고 기간 외의 것만 규제하는 것은 선거의 공정성을 위한 것으로, 결사의 자유와 표현의 자유를 침해하지 않는다.","c":"헌재 2026.3.26. 2022헌바188","o":290},{"id":"c2-049","no":"049","src":"d2","part":"본문","sec":"선거권과 선거제도","tag":"","q":"선거운동기간조항을 위반한 죄로 100만 원 이상의 벌금형을 선고받은 때 당선이 무효로 되도록 규정한 농업협동조합법 관련 규정은 결사의 자유를 제한하지만 침해하지 않는다.","a":"O","e":"선거의 공정성을 확보하기 위한 것으로, 결사의 자유를 제한하지만 침해의 최소성과 법익의 균형성을 갖추어 침해하지 않는다.","c":"헌재 2026.3.26. 2022헌바188","o":291},{"id":"c2-050","no":"050","src":"d2","part":"본문","sec":"재판청구권","tag":"합헌","q":"영상물에 수록된 신체적인 또는 정신적인 장애로 사물을 변별하거나 의사를 결정할 능력이 미약한 성폭력범죄 피해자 진술에 관하여 조사 과정에 동석하였던 신뢰관계인 또는 진술조력인의 법정진술에 의하여 그 성립의 진정함이 인정된 경우에도 증거능력을 인정할 수 있도록 정한 구 '성폭력범죄의 처벌 등에 관한 특례법' 관련 부분은 과잉금지원칙에 위반하여 공정한 재판을 받을 권리를 침해하는 것은 아니다.","a":"O","e":"장애인 피해자의 특성상 대면 반대신문은 진술의 정확성을 저해할 우려가 있고, 영상물은 사후 검증을 가능하게 하며 원진술자를 증인으로 소환할 수도 있어, 방어권 제한이 최소한에 그치고 절차적 보완장치도 확보되어 있다.","c":"헌재 2026.3.26. 2023헌가20","o":292},{"id":"c2-051","no":"051","src":"d2","part":"본문","sec":"재판청구권","tag":"헌법불합치","q":"유죄의 선고를 받은 자가 사망한 경우 재심을 청구할 수 있는 자를 그 배우자, 직계친족 또는 형제자매로 한정하고 있는 형사소송법 제424조 제4호 중 '유죄의 선고를 받은 자가 사망한 경우' 부분이 과거사정리법 제2조 제1항 제3호, 제4호에 규정된 사건에 적용되는 것은 재판청구권을 침해한다.","a":"O","e":"민간인 집단희생사건과 중대한 인권침해사건·조작의혹사건의 특수성을 고려하지 않고 재심청구권자의 범위를 그대로 적용하는 것은 입법형성권의 한계를 일탈하여 재판청구권을 침해한다.","c":"헌재 2026.6.24. 2021헌바145 등","o":293},{"id":"c2-052","no":"052","src":"d2","part":"본문","sec":"재판청구권","tag":"합헌","q":"원심재판장이 상고장에 대하여 보정을 명하거나, 법원사무관등으로 하여금 보정명령을 하게 할 수 있도록 하고, 상고장 각하명령을 할 수 있도록 한 「민사소송법」 조항은 법관이 아닌 자에 의하여 재판을 받게 하거나 상고심 재판장이 아닌 원심재판장이 재판을 하게 하는 것으로 청구인의 법관에 의한 재판을 받을 권리를 침해한다.","a":"X","e":"원심재판장의 상고장심사권은 신속한 재판과 소송경제를 위한 것으로 형식적·절차적 판단만을 맡기고 재항고로 불복할 수 있어, 법관에 의한 재판을 받을 권리를 침해한다고 볼 수 없다(원자료 표시 (×), 결론은 '침해하지 않는다').","c":"헌재 2025.6.27. 2023헌바173","o":294},{"id":"c2-054","no":"054","src":"d2","part":"본문","sec":"인간다운 생활을 할 권리","tag":"합헌","q":"구 공무원연금법상 공무상 장해연금의 급여액을 예외 없이 수급권자가 퇴직한 날의 전날이 속하는 달의 기준소득월액을 기초로 산정하도록 하여, '퇴직 후에 공무상 질병 또는 부상으로 인해 장애 상태로 된 장해연금수급권자'에 대해서도 퇴직한 날로부터 이후 장애확정일 사이의 기간을 고려하지 않고 일률적으로 급여액 산정의 기초를 정하고 있는 것은 인간다운 생활을 할 권리와 재산권을 침해하지 않는다.","a":"O","e":"급여액 산정의 기초를 퇴직 전 기준소득월액으로 일률적으로 정한 것은 연금재정의 안정과 형평을 위한 것으로, 기본권을 침해하지 않는다.","c":"헌재 2026.1.29. 2021헌바76 등","o":295},{"id":"c2-055","no":"055","src":"d2","part":"본문","sec":"국가배상","tag":"대법원 판례","q":"행정청이 구 장애인·노인·임산부 등의 편의증진 보장에 관한 법률 제7조의 위임에 따라 행정입법을 통해 장애인 편의시설 설치의무 대상시설의 범위를 정할 재량이 있다고 하더라도, 행정입법에서 정한 편의시설 설치의무 대상시설의 범위가 지나치게 좁아 사회·경제적 발전 정도 및 장애인 편의시설 설치에 관한 사회적 공감대를 따라가지 못함에도 정당한 이유 없이 개선입법의무를 이행하지 않는다면 그 행정입법부작위는 위법하다.","a":"O","e":"재량이 있다 하더라도 개선입법의무를 정당한 이유 없이 이행하지 않으면 그 행정입법부작위는 위법하다.","c":"대판 2024.12.19. 2022다289051","o":296},{"id":"c2-056","no":"056","src":"d2","part":"본문","sec":"국가배상","tag":"대법원 판례","q":"공무원이 고의 또는 과실로 그에게 부과된 직무상 의무를 위반한 경우라도 국가는 그러한 직무상 의무 위반과 피해자가 입은 손해 사이에 상당인과관계가 인정되는 범위 내에서만 배상책임을 지는 것이고, 행정청의 개선입법의무 불이행에 따라 그 의무가 보호하고자 했던 장애인이 입은 손해는 상당인과관계가 인정되는 손해라고 볼 수 없다.","a":"X","e":"장애인의 접근권이 침해된 경우 그로 인한 정신적 손해에 대한 국가의 위자료 지급의무가 배제되지 않으므로, 상당인과관계가 인정된다(원자료 표시 (×)).","c":"대판 2024.12.19. 2022다289051","o":297}];
const KEY = 'const_ox_2026_v1';
let state = JSON.parse(localStorage.getItem(KEY) || '{}');
if(!state || typeof state !== 'object') state = {};

let filter = {src:'all', part:'all', wrongOnly:false};
const $ = s => document.querySelector(s);

/* ---------- grouping / rendering ---------- */
function groupOf(it){
  if(it.part==='보충') return '자료1 · 2026년 1월 중순 최신판례 보충 (보충 001 · 006)';
  if(it.src==='d1') return '자료1 · 경찰 헌법도약 최근 3개년 헌법판례정리 (001~191 + 변형지문)';
  return '자료2 · 2026년 일반경찰 2차대비 최신판례특강 (001~056)';
}
function numClass(it){
  if(it.part==='보충') return 'num sup';
  if(it.part==='변형') return 'num var';
  if(it.src==='d2') return 'num d2';
  return 'num';
}
/* 자료 구분만 — 결론(합헌/위헌/인용/기각)을 알려주는 표시는 풀기 전 화면에 넣지 않는다 */
function partLabel(it){
  if(it.part==='변형') return '자료1 · 변형';
  if(it.part==='보충') return '자료1 · 보충';
  if(it.src==='d2') return '자료2';
  return '자료1 · 원지문';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function feedbackHTML(it, ok){
  let h = '<div class="verdict '+(ok?'ok':'no')+'">'
      + '<span class="pill '+(ok?'ok':'no')+'">'+(ok?'정답':'오답')+'</span>'
      + '정답은 '+it.a;
  if(it.tag) h += '<span class="pill dec">'+esc(it.tag)+'</span>';
  h += '</div>';
  h += '<p>'+esc(it.e)+'</p>';
  if(it.c) h += '<div class="cs"><b>'+esc(it.c)+'</b></div>';
  return h;
}

function match(it){
  if(filter.src!=='all' && it.src!==filter.src) return false;
  if(filter.part!=='all' && it.part!==filter.part) return false;
  if(filter.wrongOnly){
    const p = state[it.id];
    if(!p || p===it.a) return false;
  }
  return true;
}

let rendered = [];
function render(){
  const list = $('#list');
  const items = DATA.filter(match);
  rendered = items;
  if(!items.length){
    list.innerHTML = '<div class="empty">조건에 맞는 문항이 없습니다.<br>오답이 없거나 필터를 확인해 주세요.</div>';
    updateStats(); return;
  }
  let out = '', lastGroup = '';
  for(const it of items){
    const g = groupOf(it);
    if(g!==lastGroup){ out += '<div class="grouphead">'+esc(g)+'</div>'; lastGroup = g; }
    const p = state[it.id];
    const answered = !!p;
    const ok = answered && p===it.a;
    out += '<section class="card'+(it.part==='변형'?' var':'')+'" id="c_'+esc(it.id)+'" data-id="'+esc(it.id)+'">';
    out += '<div class="meta"><span class="'+numClass(it)+'">'+esc(it.no)+'</span>';
    out += '<span class="tag mk">'+esc(partLabel(it))+'</span>';
    if(it.sec) out += '<span class="tag sec">'+esc(it.sec)+'</span>';
    out += '</div>';
    out += '<div class="q">'+esc(it.q)+'</div>';
    const selO = p==='O' ? ' sel':'', selX = p==='X' ? ' sel':'';
    out += '<div class="ox'+(answered?' locked':'')+'">'
        +  '<button class="o'+selO+'" data-ans="O">O</button>'
        +  '<button class="x'+selX+'" data-ans="X">X</button></div>';
    out += '<div class="fb'+(answered?' show':'')+'">';
    if(answered) out += feedbackHTML(it, ok);
    out += '</div></section>';
  }
  list.innerHTML = out;
  updateStats();
}

/* ---------- answer handling ---------- */
$('#list').addEventListener('click', ev=>{
  const btn = ev.target.closest('.ox button');
  if(!btn) return;
  const card = btn.closest('.card');
  const id = card.dataset.id;
  const it = DATA.find(x=>x.id===id);
  const pick = btn.dataset.ans;
  const before = state[id];
  state[id] = pick;                            // 다시 눌러 정정 가능
  localStorage.setItem(KEY, JSON.stringify(state));
  const ox = card.querySelector('.ox');
  ox.querySelector('.o').classList.toggle('sel', pick==='O');
  ox.querySelector('.x').classList.toggle('sel', pick==='X');
  const ok = pick===it.a;
  const fb = card.querySelector('.fb');
  fb.classList.add('show');
  fb.innerHTML = feedbackHTML(it, ok);
  updateStats();
  if(before!==pick && ok===false) toast('오답 — 해설을 확인하세요');
  else if(before && before!==pick) toast('정답으로 정정했습니다');
});

function updateStats(){
  const total = DATA.length;
  let done=0, right=0, wrong=0;
  for(const it of DATA){
    const p = state[it.id];
    if(p){ done++; if(p===it.a) right++; else wrong++; }
  }
  $('#sProg').textContent = done+'/'+total;
  $('#sRight').textContent = right;
  $('#sWrong').textContent = wrong;
  $('#sRate').textContent = done? Math.round(right/done*100)+'%' : '-';
  $('#pbar').style.width = (total? done/total*100:0)+'%';
  $('#hsub').textContent = '총 '+total+'문항';
}

/* ---------- filters ---------- */
function wireChips(sel, key){
  document.querySelectorAll(sel+' .chip').forEach(ch=>{
    ch.addEventListener('click', ()=>{
      document.querySelectorAll(sel+' .chip').forEach(c=>c.classList.remove('on'));
      ch.classList.add('on');
      filter[key] = ch.dataset.v;
      render();
    });
  });
}
wireChips('#fSrc','src');
wireChips('#fPart','part');

$('#btnWrong').addEventListener('click', ()=>{
  filter.wrongOnly = !filter.wrongOnly;
  $('#btnWrong').classList.toggle('pri', filter.wrongOnly);
  $('#btnWrong').textContent = filter.wrongOnly ? '전체 보기' : '오답만';
  render();
});

$('#btnReset').addEventListener('click', ()=>{
  if(!confirm('모든 풀이 기록(진행률·점수)을 지웁니다. 계속할까요?')) return;
  state = {};
  localStorage.removeItem(KEY);
  render();
  toast('초기화했습니다');
});

/* ---------- number search / jump ---------- */
function normalizeNo(raw){
  const c = String(raw||'').replace(/\s+/g,'');
  if(!c) return null;
  let m = c.match(/^보충(\d{1,3})$/);
  if(m) return {type:'sup', label:'보충 '+String(+m[1]).padStart(3,'0')};
  m = c.match(/^(\d{1,3})-(\d{1,2})$/);
  if(m) return {type:'exact', label:String(+m[1]).padStart(3,'0')+'-'+(+m[2])};
  m = c.match(/^(\d{1,3})$/);
  if(m) return {type:'any', n:+m[1]};
  return null;
}
function baseNoOf(it){
  return String(it.no).replace(/^보충\s*/,'').split('-')[0];
}
function jump(){
  const raw = $('#q').value;
  const t = normalizeNo(raw);
  if(!t){ toast('번호를 입력해 주세요 (예: 54, 54-2, 보충 6)'); return; }
  let cands;
  if(t.type==='sup') cands = DATA.filter(it=>it.part==='보충' && it.no===t.label);
  else if(t.type==='exact') cands = DATA.filter(it=>it.no===t.label);
  else cands = DATA.filter(it=>it.part!=='보충' && String(+baseNoOf(it))===String(t.n));
  if(!cands.length){ toast('해당 번호의 문항이 없습니다: '+raw); return; }
  // 필터와 무관하게 보이도록 필터 초기화
  filter.src='all'; filter.part='all'; filter.wrongOnly=false;
  document.querySelectorAll('#fSrc .chip,#fPart .chip').forEach(c=>c.classList.remove('on'));
  document.querySelector('#fSrc .chip[data-v="all"]').classList.add('on');
  document.querySelector('#fPart .chip[data-v="all"]').classList.add('on');
  $('#btnWrong').classList.remove('pri'); $('#btnWrong').textContent='오답만';
  render();
  const first = cands[0];
  const el = document.getElementById('c_'+first.id);
  if(el){
    el.scrollIntoView({behavior:'smooth', block:'center'});
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
  if(cands.length>1) toast('같은 번호 문항 '+cands.length+'개 — 자료1·자료2 구분해서 보세요');
}
$('#btnGo').addEventListener('click', jump);
$('#q').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); jump(); }});

/* ---------- toast ---------- */
let tTimer=null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(tTimer); tTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

render();
</script>
</body>
