<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>11월 23일 경찰 암기 데일리 퀴즈</title>
<style>
  :root {
    --bg-page: #f2f4f7;
    --bg-card: #ffffff;
    --text-main: #111827;
    --text-sub: #4b5563;
    --text-muted: #9ca3af;
    --primary: #2563eb;
    --primary-bg: #eff6ff;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --border: #e5e7eb;
    --radius-card: 20px;
    --radius-btn: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg-page);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    max-width: 520px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px 14px 4px;
  }
  .header h1 {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .score-badge {
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
  }
  .progress-wrap {
    width: 100%;
    height: 7px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .progress-bar {
    height: 100%;
    background: var(--primary);
    width: 25%;
    transition: width 0.3s ease;
  }
  .quiz-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 24px 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
  }
  .badge-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cat-badge {
    background: var(--primary-bg);
    color: var(--primary);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
  }
  .cat-badge.review {
    background: #fef3c7;
    color: #b45309;
  }
  .q-num {
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
  }
  .question-body {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.55;
    color: var(--text-main);
    word-break: keep-all;
    min-height: 85px;
    padding-top: 4px;
  }
  .choice-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 8px;
  }
  .btn-ox {
    padding: 18px 0;
    font-size: 26px;
    font-weight: 900;
    border-radius: var(--radius-btn);
    border: 2px solid var(--border);
    background: #ffffff;
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.12s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    user-select: none;
  }
  .btn-ox:active { transform: scale(0.95); opacity: 0.85; }
  .btn-ox.correct {
    background: var(--success-bg) !important;
    border-color: var(--success) !important;
    color: var(--success) !important;
  }
  .btn-ox.wrong {
    background: var(--danger-bg) !important;
    border-color: var(--danger) !important;
    color: var(--danger) !important;
  }
  .explanation-card {
    display: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 14px;
    line-height: 1.55;
    animation: fadeIn 0.2s ease;
  }
  .explanation-card.correct {
    background: var(--success-bg);
    border: 1.5px solid rgba(22, 163, 74, 0.3);
  }
  .explanation-card.wrong {
    background: var(--danger-bg);
    border: 1.5px solid rgba(220, 38, 38, 0.3);
  }
  .exp-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-weight: 800;
    font-size: 15px;
  }
  .explanation-card.correct .exp-header { color: var(--success); }
  .explanation-card.wrong .exp-header { color: var(--danger); }
  .schedule-badge {
    font-size: 11px;
    font-weight: 700;
    background: #ffffff;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid currentColor;
  }
  .exp-content {
    color: var(--text-sub);
    font-weight: 500;
    word-break: keep-all;
  }
  .btn-next {
    display: none;
    background: var(--primary);
    color: #ffffff;
    font-size: 16px;
    font-weight: 800;
    padding: 16px;
    border-radius: var(--radius-btn);
    border: none;
    cursor: pointer;
    text-align: center;
    margin-top: auto;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    transition: opacity 0.15s ease;
  }
  .btn-next:active { opacity: 0.85; }

  .complete-box {
    display: none;
    text-align: center;
    padding: 30px 10px 10px 10px;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation: fadeIn 0.3s ease;
  }
  .complete-icon { font-size: 52px; }
  .complete-title { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
  .complete-desc { font-size: 14px; color: var(--text-sub); line-height: 1.5; margin-bottom: 8px; }
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    margin-bottom: 12px;
  }
  .stat-card {
    background: var(--bg-page);
    border-radius: 12px;
    padding: 16px 12px;
  }
  .stat-card .val { font-size: 26px; font-weight: 900; color: var(--primary); }
  .stat-card .lbl { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-top: 4px; }
  .wrong-review-box {
    width: 100%;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 12px;
    padding: 14px;
    text-align: left;
    margin-bottom: 12px;
  }
  .wrong-review-title {
    font-size: 13px;
    font-weight: 800;
    color: var(--danger);
    margin-bottom: 8px;
  }
  .wrong-review-item {
    font-size: 12px;
    color: #7f1d1d;
    line-height: 1.45;
    padding: 6px 0;
    border-bottom: 1px dashed #fca5a5;
  }
  .wrong-review-item:last-child { border-bottom: none; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body ontouchstart="">

<div class="header">
  <h1>📝 오늘의 암기 퀴즈</h1>
  <div class="score-badge" id="score-badge">진행 1 / 12</div>
</div>

<div class="progress-wrap">
  <div class="progress-bar" id="p-bar" style="width: 25%;"></div>
</div>

<div class="quiz-card" id="quiz-card">
  <!-- Active Question Area -->
  <div id="play-area">
    <div class="badge-row">
      <span class="cat-badge" id="cat-text">경찰학 · 법령 형식 [FSRS 신규]</span>
      <span class="q-num" id="q-num">1 / 12</span>
    </div>

    <div class="question-body" id="q-text">
      경찰관 직무집행법(경직법)의 위임 사항 중 복제에 관한 사항은 행정안전부령으로 정하고, 그 외 대다수 사항은 대통령령으로 정한다.
    </div>

    <div class="choice-grid" id="choice-grid">
      <button type="button" class="btn-ox" id="btn-o" onclick="choose('O')">⭕️ O</button>
      <button type="button" class="btn-ox" id="btn-x" onclick="choose('X')">❌ X</button>
    </div>

    <div class="explanation-card" id="exp-card">
      <div class="exp-header">
        <span id="exp-title">정답입니다!</span>
        <span class="schedule-badge" id="schedule-badge" style="display:none;">내일 점심 재출제 큐에 저장</span>
      </div>
      <div class="exp-content" id="exp-body">해설 내용</div>
    </div>

    <button type="button" class="btn-next" id="btn-next" onclick="goNext()">다음 문제로 ➔</button>
  </div>

  <!-- Complete Screen -->
  <div class="complete-box" id="complete-box">
    <div class="complete-icon" id="res-icon">🎯</div>
    <div class="complete-title" id="res-title">오늘의 14문제 완료!</div>
    <div class="complete-desc" id="res-desc">수고하셨습니다! 틀린 문제는 내일 점심 1시 퀴즈에 자동 재출제됩니다.</div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="val" id="res-correct">0</div>
        <div class="lbl">정답</div>
      </div>
      <div class="stat-card">
        <div class="val" id="res-wrong">0</div>
        <div class="lbl">오답 (내일 재출제)</div>
      </div>
    </div>

    <div class="wrong-review-box" id="wrong-box" style="display:none;">
      <div class="wrong-review-title">📌 내일 점심 1시에 다시 도전할 오답 목록</div>
      <div id="wrong-list"></div>
    </div>

    <button type="button" class="btn-next" id="btn-copy-result" style="display:block; background:#374151; margin-bottom:8px;" onclick="copyResult()">📋 결과 복사하기</button>
    <button type="button" class="btn-next" style="display:block;" onclick="restart()">처음부터 다시 풀기 ↺</button>
  </div>
</div>

<script>
const QUESTIONS = [
{
  "cat": "경찰학 · 청문·공청회·예고 기한 [오답 1순위 복습]",
  "isReview": true,
  "q": "행정절차법상 청문은 개최 10일 전까지 당사자에게(청문주재자는 7일 전), 공청회는 개최 14일 전까지(예외 7일 전) 통지해야 하며, 법령의 입법예고 기간은 특별한 사정이 없으면 40일 이상, 자치법규의 입법예고 및 행정예고 기간은 20일 이상으로 한다.",
  "ans": "O",
  "point": "청문(당사자 10일/주재자 7일) · 공청회(14일, 예외 7일) · 입법예고(법령 40일 이상 / 자치법규·행정예고 20일 이상)",
  "exp": "정확합니다! 청문은 당사자 10일 전·청문주재자 7일 전, 공청회는 14일 전(예외 7일 전), 입법예고는 법령 40일 이상·자치법규 20일 이상(행정예고도 20일 이상)입니다."
},
{
  "cat": "경찰학 · 행정행위 성질 [오답 1순위 복습]",
  "isReview": true,
  "q": "행정행위 중 '특허'는 법규특허가 가능하고 신청 없는 특허나 수정특허는 허용되지 않으며, '허가'는 법규허가가 불가능하지만 신청 없는 허가와 수정허가는 모두 가능하다.",
  "ans": "O",
  "point": "특허(법규 O, 신청없는 X, 수정 X) / 허가(법규 X, 신청없는 O, 수정허가 O)",
  "exp": "정확합니다! 채령 님 정정 기준대로 허가는 법규허가 X, 신청 없는 허가 O, 수정허가 O이며, 특허는 법규특허 O, 신청 없는 특허 X, 수정특허 X입니다. (인가는 모두 X, 하명은 법규하명 O)"
},
{
  "cat": "경찰학 · 경찰윤리(Cohen & Feldberg) [오답 1순위 복습]",
  "isReview": true,
  "q": "Cohen & Feldberg의 경찰윤리 원칙에서 개인적 경험이나 감정에 치우쳐 절도범에게 분풀이하거나 가정폭력 현장에서 일방 탓으로 단정하는 행위는 '냉정하고 객관적인 접근' 원칙 위반에 해당하며, 동료에게 면박을 주는 행위는 '역할 한계와 팀워크' 원칙 위반에 해당한다.",
  "ans": "O",
  "point": "개인 감정·분풀이 → '냉정하고 객관적인 접근' / 동료 면박주기 → '역할 한계·팀워크'",
  "exp": "정확합니다! 개인적 경험·감정 배제는 '냉정하고 객관적인 접근', 동료 면박주기 등 팀워크 저해 행위는 '역할 한계와 팀워크', 취약계층 신고 무시는 '공정한 접근 보장'에 해당합니다."
},
{
  "cat": "형소법 · 증거동의와 증거능력 [오답 1순위 복습]",
  "isReview": true,
  "q": "위법수집증거(위수증), 증언번복조서, 증거보전절차에서 피고인·변호인에게 참여권 통지를 누락한 증인신문조서는 피고인이 공판정에서 증거로 함에 동의하더라도 증거능력을 취득할 수 없다.",
  "ans": "O",
  "point": "위수증·증언번복조서·참여권 통지 누락 증거보전조서 → 증거동의해도 증거능력 X",
  "exp": "정확합니다! 위법수집증거, 증언번복조서, 그리고 증거보전절차 참여권 통지 누락 증인신문조서는 피고인이 증거동의를 하더라도 증거능력을 인정받을 수 없습니다."
},
{
  "cat": "경찰학 · 청탁금지법 과태료 [신규]",
  "isReview": false,
  "q": "청탁금지법상 제3자를 위하여 부정청탁을 한 공직자등은 3천만원 이하의 과태료, 제3자를 위하여 부정청탁을 한 일반인은 2천만원 이하의 과태료에 처하지만, 제3자를 통하여 부정청탁을 한 자는 1천만원 이하의 과태료에 처한다.",
  "ans": "O",
  "point": "제3자를 위한 부정청탁: 공직자등 3천 / 일반인 2천 / 제3자를 통한 자 1천",
  "exp": "정확합니다! 주체에 따라 공직자등(제3자를 위한 부정청탁) 3천만원, 일반인(제3자를 위한 부정청탁) 2천만원, 제3자를 통하여 부정청탁을 한 자 1천만원 이하 과태료로 구분됩니다."
},
{
  "cat": "경찰학 · 경찰활동 모델 [신규]",
  "isReview": false,
  "q": "Eck & Spelman이 제시한 문제지향적 경찰활동(POP)의 SARA 모델은 '조사(Scanning) → 분석(Analysis) → 대응(Response) → 평가(Assessment)'의 4단계로 구성되며, 범죄정보·통계 분석과 GIS를 결합해 범죄다발지역에 집중 순찰하는 모델은 정보주도적 경찰활동(ILP)이다.",
  "ans": "O",
  "point": "문제지향(SARA: 조사-분석-대응-평가) / 정보주도(ILP: 통계·GIS·Hotspot)",
  "exp": "정확합니다! SARA 4단계는 문제지향적 경찰활동, 범죄정보·통계·GIS 기반 핫스팟 집중 순찰은 정보주도적 경찰활동(ILP), 과학적·임상실험적 연구 결과 중시는 증거기반 경찰활동(Sherman)입니다."
},
{
  "cat": "경찰학 · CPTED 원칙 [신규]",
  "isReview": false,
  "q": "범죄예방 환경설계(CPTED) 5원칙 중 울타리나 펜스를 설치하여 사적 공간과 공적 공간의 경계를 명확히 구분하는 것은 '자연적 접근통제'에 해당하고, 출입구를 최소화하고 차량 차단기를 설치하는 것은 '영역성의 강화'에 해당한다.",
  "ans": "X",
  "point": "자연적 접근통제(출입구 최소화·차단기·방범창) / 영역성의 강화(울타리·펜스·경계 구분)",
  "exp": "틀렸습니다! 서로 바뀌었습니다. 울타리·펜스로 사적/공적 공간 경계를 명확히 구분하는 것이 '영역성의 강화'이고, 통행로 설계·출입구 최소화·차량 차단기·방범창 설치가 '자연적 접근통제'입니다."
},
{
  "cat": "경찰학 · 법령 형식 위임 [FSRS 복습]",
  "isReview": false,
  "q": "경찰관 직무집행법(경직법)의 위임 사항은 100% 대통령령으로 정하도록 되어 있으나, 경찰공무원법(경공법)에서는 경찰공무원의 복제에 관한 사항만 행정안전부령으로 정하고 나머지 대다수는 대통령령으로 정한다.",
  "ans": "O",
  "point": "경직법 100% 대통령령 / 경공법 복제만 행안부령",
  "exp": "정확합니다! 경직법은 100% 대통령령 위임이고, 경공법은 복제 관련 사항만 행안부령(시행규칙)으로 정하며 대다수는 대통령령입니다."
},
{

let cur = 0;
let correctCount = 0;
let wrongItems = [];
let answered = false;

function loadQuestion() {
  if (cur >= QUESTIONS.length) {
    showResult();
    return;
  }
  answered = false;
  const item = QUESTIONS[cur];

  const catBadge = document.getElementById('cat-text');
  catBadge.innerText = item.cat;
  if (item.isReview) {
    catBadge.className = 'cat-badge review';
  } else {
    catBadge.className = 'cat-badge';
  }

  document.getElementById('q-num').innerText = `${cur + 1} / ${QUESTIONS.length}`;
  document.getElementById('q-text').innerText = item.q;
  document.getElementById('score-badge').innerText = `진행 ${cur + 1} / ${QUESTIONS.length}`;
  document.getElementById('p-bar').style.width = `${((cur + 1) / QUESTIONS.length) * 100}%`;

  const btnO = document.getElementById('btn-o');
  const btnX = document.getElementById('btn-x');
  btnO.className = 'btn-ox';
  btnX.className = 'btn-ox';
  btnO.disabled = false;
  btnX.disabled = false;

  document.getElementById('exp-card').style.display = 'none';
  document.getElementById('schedule-badge').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
}

function choose(pick) {
  if (answered) return;
  answered = true;

  const item = QUESTIONS[cur];
  const isRight = (pick === item.ans);

  const btnO = document.getElementById('btn-o');
  const btnX = document.getElementById('btn-x');
  btnO.disabled = true;
  btnX.disabled = true;

  if (pick === 'O') {
    btnO.classList.add(isRight ? 'correct' : 'wrong');
  } else {
    btnX.classList.add(isRight ? 'correct' : 'wrong');
  }

  const expCard = document.getElementById('exp-card');
  const expTitle = document.getElementById('exp-title');
  const expBody = document.getElementById('exp-body');
  const schedBadge = document.getElementById('schedule-badge');

  expCard.style.display = 'block';
  expBody.innerText = item.exp;

  if (isRight) {
    correctCount++;
    expCard.className = 'explanation-card correct';
    expTitle.innerText = `⭕️ 정답입니다! (${item.point})`;
    schedBadge.style.display = 'none';
  } else {
    wrongItems.push(item);
    expCard.className = 'explanation-card wrong';
    expTitle.innerText = `❌ 오답입니다! (정답: ${item.ans})`;
    schedBadge.style.display = 'inline-block';
  }

  const btnNext = document.getElementById('btn-next');
  btnNext.style.display = 'block';
  if (cur === QUESTIONS.length - 1) {
    btnNext.innerText = '결과 보기 ➔';
  } else {
    btnNext.innerText = '다음 문제로 ➔';
  }
}

function goNext() {
  cur++;
  loadQuestion();
}

function showResult() {
  document.getElementById('play-area').style.display = 'none';
  const compBox = document.getElementById('complete-box');
  compBox.style.display = 'flex';

  document.getElementById('res-correct').innerText = `${correctCount}개`;
  document.getElementById('res-wrong').innerText = `${wrongItems.length}개`;

  const resIcon = document.getElementById('res-icon');
  const resTitle = document.getElementById('res-title');

  if (correctCount === QUESTIONS.length) {
    resIcon.innerText = '💯';
    resTitle.innerText = `${QUESTIONS.length}/${QUESTIONS.length} 전원 만점 마스터!`;
  } else {
    resIcon.innerText = '🎯';
    resTitle.innerText = `${QUESTIONS.length}문제 중 ${correctCount}문제 정답!`;
  }

  const wrongBox = document.getElementById('wrong-box');
  const wrongList = document.getElementById('wrong-list');
  if (wrongItems.length > 0) {
    wrongBox.style.display = 'block';
    wrongList.innerHTML = wrongItems.map((w, idx) => `
      <div class="wrong-review-item">
        <strong>${idx + 1}. [${w.cat}]</strong><br>
        ${w.q}<br>
        👉 <em>정답: ${w.ans} (${w.point})</em>
      </div>
    `).join('');
  } else {
    wrongBox.style.display = 'none';
  }
}

function restart() {
  cur = 0;
  correctCount = 0;
  wrongItems = [];
  document.getElementById('play-area').style.display = 'block';
  document.getElementById('complete-box').style.display = 'none';
  loadQuestion();
}

function copyResult() {
  let text = '';
  if (wrongItems.length === 0) {
    text = '오늘 퀴즈 다 맞음!';
  } else {
    text = `오늘 퀴즈 ${wrongItems.length}개 오답: ` + wrongItems.map(w => w.cat).join(', ');
  }
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('btn-copy-result');
    btn.innerText = '✅ 복사 완료! 대화창에 붙여넣기 해 주세요';
    setTimeout(() => {
      btn.innerText = '📋 결과 복사하기';
    }, 2500);
  }).catch(() => {
    alert(text);
  });
}

// Initial render
loadQuestion();
</script>
