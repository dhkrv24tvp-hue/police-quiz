<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>11월 21일 경찰 암기 데일리 퀴즈</title>
<style>
  :root {
    --bg-page: #f2f4f7;
    --bg-card: #ffffff;
    --text-main: #111827;
    --text-sub: #4b5563;
    --text-muted: #9ca3af;
    --primary: #2563eb;
    --primary-bg: #eff6ff;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --border: #e5e7eb;
    --radius-card: 20px;
    --radius-btn: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg-page);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    max-width: 520px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px 14px 4px;
  }
  .header h1 {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .score-badge {
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
  }
  .progress-wrap {
    width: 100%;
    height: 7px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .progress-bar {
    height: 100%;
    background: var(--primary);
    width: 25%;
    transition: width 0.3s ease;
  }
  .quiz-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 24px 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
  }
  .badge-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cat-badge {
    background: var(--primary-bg);
    color: var(--primary);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
  }
  .cat-badge.review {
    background: #fef3c7;
    color: #b45309;
  }
  .q-num {
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
  }
  .question-body {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.55;
    color: var(--text-main);
    word-break: keep-all;
    min-height: 85px;
    padding-top: 4px;
  }
  .choice-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 8px;
  }
  .btn-ox {
    padding: 18px 0;
    font-size: 26px;
    font-weight: 900;
    border-radius: var(--radius-btn);
    border: 2px solid var(--border);
    background: #ffffff;
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.12s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    user-select: none;
  }
  .btn-ox:active { transform: scale(0.95); opacity: 0.85; }
  .btn-ox.correct {
    background: var(--success-bg) !important;
    border-color: var(--success) !important;
    color: var(--success) !important;
  }
  .btn-ox.wrong {
    background: var(--danger-bg) !important;
    border-color: var(--danger) !important;
    color: var(--danger) !important;
  }
  .explanation-card {
    display: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 14px;
    line-height: 1.55;
    animation: fadeIn 0.2s ease;
  }
  .explanation-card.correct {
    background: var(--success-bg);
    border: 1.5px solid rgba(22, 163, 74, 0.3);
  }
  .explanation-card.wrong {
    background: var(--danger-bg);
    border: 1.5px solid rgba(220, 38, 38, 0.3);
  }
  .exp-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-weight: 800;
    font-size: 15px;
  }
  .explanation-card.correct .exp-header { color: var(--success); }
  .explanation-card.wrong .exp-header { color: var(--danger); }
  .schedule-badge {
    font-size: 11px;
    font-weight: 700;
    background: #ffffff;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid currentColor;
  }
  .exp-content {
    color: var(--text-sub);
    font-weight: 500;
    word-break: keep-all;
  }
  .btn-next {
    display: none;
    background: var(--primary);
    color: #ffffff;
    font-size: 16px;
    font-weight: 800;
    padding: 16px;
    border-radius: var(--radius-btn);
    border: none;
    cursor: pointer;
    text-align: center;
    margin-top: auto;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    transition: opacity 0.15s ease;
  }
  .btn-next:active { opacity: 0.85; }

  .complete-box {
    display: none;
    text-align: center;
    padding: 30px 10px 10px 10px;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation: fadeIn 0.3s ease;
  }
  .complete-icon { font-size: 52px; }
  .complete-title { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
  .complete-desc { font-size: 14px; color: var(--text-sub); line-height: 1.5; margin-bottom: 8px; }
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    margin-bottom: 12px;
  }
  .stat-card {
    background: var(--bg-page);
    border-radius: 12px;
    padding: 16px 12px;
  }
  .stat-card .val { font-size: 26px; font-weight: 900; color: var(--primary); }
  .stat-card .lbl { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-top: 4px; }
  .wrong-review-box {
    width: 100%;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 12px;
    padding: 14px;
    text-align: left;
    margin-bottom: 12px;
  }
  .wrong-review-title {
    font-size: 13px;
    font-weight: 800;
    color: var(--danger);
    margin-bottom: 8px;
  }
  .wrong-review-item {
    font-size: 12px;
    color: #7f1d1d;
    line-height: 1.45;
    padding: 6px 0;
    border-bottom: 1px dashed #fca5a5;
  }
  .wrong-review-item:last-child { border-bottom: none; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body ontouchstart="">

<div class="header">
  <h1>📝 오늘의 암기 퀴즈</h1>
  <div class="score-badge" id="score-badge">진행 1 / 12</div>
</div>

<div class="progress-wrap">
  <div class="progress-bar" id="p-bar" style="width: 25%;"></div>
</div>

<div class="quiz-card" id="quiz-card">
  <!-- Active Question Area -->
  <div id="play-area">
    <div class="badge-row">
      <span class="cat-badge" id="cat-text">경찰학 · 법령 형식 [FSRS 신규]</span>
      <span class="q-num" id="q-num">1 / 12</span>
    </div>

    <div class="question-body" id="q-text">
      경찰관 직무집행법(경직법)의 위임 사항 중 복제에 관한 사항은 행정안전부령으로 정하고, 그 외 대다수 사항은 대통령령으로 정한다.
    </div>

    <div class="choice-grid" id="choice-grid">
      <button type="button" class="btn-ox" id="btn-o" onclick="choose('O')">⭕️ O</button>
      <button type="button" class="btn-ox" id="btn-x" onclick="choose('X')">❌ X</button>
    </div>

    <div class="explanation-card" id="exp-card">
      <div class="exp-header">
        <span id="exp-title">정답입니다!</span>
        <span class="schedule-badge" id="schedule-badge" style="display:none;">내일 점심 재출제 큐에 저장</span>
      </div>
      <div class="exp-content" id="exp-body">해설 내용</div>
    </div>

    <button type="button" class="btn-next" id="btn-next" onclick="goNext()">다음 문제로 ➔</button>
  </div>

  <!-- Complete Screen -->
  <div class="complete-box" id="complete-box">
    <div class="complete-icon" id="res-icon">🎯</div>
    <div class="complete-title" id="res-title">오늘의 12문제 완료!</div>
    <div class="complete-desc" id="res-desc">수고하셨습니다! 틀린 문제는 내일 점심 1시 퀴즈에 자동 재출제됩니다.</div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="val" id="res-correct">0</div>
        <div class="lbl">정답</div>
      </div>
      <div class="stat-card">
        <div class="val" id="res-wrong">0</div>
        <div class="lbl">오답 (내일 재출제)</div>
      </div>
    </div>

    <div class="wrong-review-box" id="wrong-box" style="display:none;">
      <div class="wrong-review-title">📌 내일 점심 1시에 다시 도전할 오답 목록</div>
      <div id="wrong-list"></div>
    </div>

    <button type="button" class="btn-next" id="btn-copy-result" style="display:block; background:#374151; margin-bottom:8px;" onclick="copyResult()">📋 결과 복사하기</button>
    <button type="button" class="btn-next" style="display:block;" onclick="restart()">처음부터 다시 풀기 ↺</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    "cat": "경찰학 · 청탁금지법 과태료 [오답 1순위 복습]",
    "isReview": true,
    "q": "청탁금지법상 제3자를 위하여 부정청탁을 한 공직자등은 3천만원 이하의 과태료, 일반인은 2천만원 이하의 과태료에 처하며, 신분과 무관하게 제3자를 통하여 부정청탁을 한 자는 1천만원 이하의 과태료에 처한다.",
    "ans": "O",
    "point": "제3자를 위한 청탁(공직자등 3천 / 일반인 2천) · 제3자를 통한 자(신분 불문 1천)",
    "exp": "정확합니다! 주체와 행위 유형별로 ① 제3자를 위하여 부정청탁을 한 공직자등(3천만원 이하), ② 제3자를 위하여 부정청탁을 한 일반인(2천만원 이하), ③ 제3자를 통하여 부정청탁을 한 자(신분 불문 1천만원 이하)로 구분됩니다."
  },
  {
    "cat": "형법 총론 · 죄수론(법조경합) [오답 1순위 복습]",
    "isReview": true,
    "q": "존속살해죄와 보통살인죄의 관계는 법조경합 중 '특별관계'에 해당하고, 현주건조물방화죄와 일반건조물방화죄의 관계 및 간첩죄와 전시군수이적죄의 관계는 '보충관계'에 해당한다.",
    "ans": "O",
    "point": "특별관계(존속살해>보통살인) vs 보충관계(현주>일반방화, 간첩>전시군수이적)",
    "exp": "정확합니다! 기본 구성요건에 가중·감경 요소가 결합된 존속살해>보통살인은 특별관계이고, 보충적 보호관계인 현주건조물방화>일반건조물방화, 간첩죄>전시군수이적죄, 기수>미수>예비는 보충관계입니다."
  },
  {
    "cat": "경찰학 · 행정입법 [신규]",
    "isReview": false,
    "q": "상위법령에서 세부사항을 대통령령으로 정하도록 위임하였음에도, 이를 총리령이나 부령으로 정한 경우에는 위임입법의 한계를 일탈한 것으로서 무효이다.",
    "ans": "O",
    "point": "위임된 법형식(대통령령)을 어겨 부령으로 정하면 무효",
    "exp": "정확합니다! 상위법령이 위임한 법형식(대통령령)을 준수하지 않고 하위 법형식(총리령·부령)으로 정한 경우 위임입법의 한계를 일탈해 무효가 됩니다."
  },
  {
    "cat": "경찰학 · 행정행위의 부관 [신규]",
    "isReview": false,
    "q": "행정기본법상 행정청은 처분에 재량이 없는 기속행위의 경우에도 법률에 명문의 근거가 없더라도 당사자의 동의가 있으면 부관을 붙일 수 있다.",
    "ans": "X",
    "point": "기속행위는 법률 근거 필수 (당사자 동의만으로 부관 불가)",
    "exp": "틀렸습니다! 재량행위는 법률 근거 또는 당사자 동의가 있으면 부관을 붙일 수 있지만, 기속행위는 오직 '법률에 근거가 있는 경우'에만 부관을 붙일 수 있습니다."
  },
  {
    "cat": "경찰학 · 청문·공청회·예고 기한 [신규]",
    "isReview": false,
    "q": "행정절차법상 청문은 개최 10일 전까지 당사자에게(청문주재자는 7일 전), 공청회는 개최 14일 전까지(예외 7일) 통지하며, 법령의 입법예고 기간은 특별한 사정이 없으면 40일 이상으로 한다.",
    "ans": "O",
    "point": "청문(당사자 10일/주재자 7일) · 공청회(14일) · 입법예고(법령 40일/자치 20일)",
    "exp": "정확합니다! 청문 10일(주재자 7일), 공청회 14일(예외 7일), 법령 입법예고 40일 이상(자치법규·행정예고 20일 이상) 숫자를 정확히 기억하셨네요."
  },
  {
    "cat": "경찰학 · 보호 법익 구분 [신규]",
    "isReview": false,
    "q": "112 신고 접수·처리와 범죄피해자 구조청구권의 보호 법익에는 국민의 '생명·신체·재산'이 모두 포함된다.",
    "ans": "X",
    "point": "112 신고·감금자 구호·범죄피해자 구조청구권 → 생명·신체만 (재산 X)",
    "exp": "틀렸습니다! 112 신고 접수·처리, 감금된 자의 구호, 범죄피해자 구조청구권, 직접적 사람 통제·억제 작용은 '생명·신체'만 포함되며 재산은 제외됩니다."
  },
  {
    "cat": "형법 총론 · 미수범 감면 체계 [FSRS 복습]",
    "isReview": false,
    "q": "형법상 중지미수는 형을 필요적으로 감경 또는 면제하고, 불능미수는 형을 임의적으로 감경 또는 면제하며, 방조범(종범)과 농아자는 형을 필요적으로 감경한다.",
    "ans": "O",
    "point": "중지미수(필요적 감면) / 불능미수(임의적 감면) / 방조범·농아자·심신미약(필요적 감경)",
    "exp": "정확합니다! 중지미수는 필요적 감면, 불능미수는 임의적 감면, 방조범·농아자·심신미약자는 필요적 감경(면제 불가), 장애미수는 임의적 감경입니다."
  },
  {
    "cat": "형법 총론 · 정당방위 vs 긴급피난 [신규]",
    "isReview": false,
    "q": "정당방위는 현재의 부당한 침해에 대하여 자기 또는 타인의 개인적 법익뿐만 아니라 국가적·사회적 법익을 방위하기 위해서도 성립할 수 있다.",
    "ans": "X",
    "point": "정당방위(개인적 법익만) vs 긴급피난(개인·사회·국가적 법익 모두 가능)",
    "exp": "틀렸습니다! 정당방위는 자기 또는 타인의 '개인적 법익'에 한해 인정되며, 국가적·사회적 법익을 위한 방위는 허용되지 않습니다(긴급피난은 모두 가능)."
  },
  {
    "cat": "형법 각론 · 해방감경 [FSRS 복습]",
    "isReview": false,
    "q": "인질강도죄나 인질살해·치사죄를 범한 자가 인질을 안전한 장소로 풀어준 때에도 형법상 임의적 해방감경 규정이 적용된다.",
    "ans": "X",
    "point": "인질상해·치상죄만 임의적 해방감경 (인질강도·살해·체포감금 X)",
    "exp": "틀렸습니다! 형법상 해방감경은 오직 '인질상해·치상죄'에만(임의적 감경) 규정되어 있으며, 체포·감금죄, 인질강도죄, 인질살해·치사죄에는 해방감경이 없습니다."
  },
  {
    "cat": "형소법 · 항고 및 불복 체계 [신규]",
    "isReview": false,
    "q": "법원의 구속취소 결정에 대해서는 즉시항고할 수 있고, 구속집행정지 결정에 대해서는 보통항고할 수 있으며, 체포·구속적부심사의 석방 결정에 대해서도 검사는 즉시항고할 수 있다.",
    "ans": "X",
    "point": "구속취소(즉시항고) · 구속집행정지(보통항고) · 적부심 기각/석방(항고 불가)",
    "exp": "틀렸습니다! 체포·구속적부심사의 기각 결정 및 석방 결정에 대해서는 모두 항고(불복)할 수 없습니다."
  },
  {
    "cat": "형소법 · 긴급체포 재체포 제한 [신규]",
    "isReview": false,
    "q": "긴급체포된 피의자에 대하여 구속영장을 청구하지 아니하고 석방한 경우, 수사기관은 다른 중요한 증거를 발견한 때에 한하여 영장 없이 동일한 범죄사실로 재차 긴급체포할 수 있다.",
    "ans": "X",
    "point": "긴급체포 석방 후: 영장 없이 재체포 절대 불가 (현행범은 제한 없음)",
    "exp": "틀렸습니다! 긴급체포 후 구속영장 미청구 석방 시에는 다른 중요한 증거를 발견하더라도 영장 없이는 재체포할 수 없습니다(반드시 법관의 영장을 발부받아야 함)."
  },
  {
    "cat": "헌법 · 사회계약론 비교 [신규]",
    "isReview": false,
    "q": "로크(Locke)의 사회계약론은 자연법이 지배하나 시비 판단 기준과 집행력이 결여된 자연상태를 상정하고, 권리의 일부를 신탁하여 제한군주정을 취하며 저항권을 인정한다.",
    "ans": "O",
    "point": "로크: 일부 양도(신탁) · 제한군주정 · 저항권 인정 (홉스 X)",
    "exp": "정확합니다! 홉스(전부 양도·절대군주정·저항권 X), 로크(일부 양도·제한군주정·저항권 O), 루소(일반의지·직접민주정)를 명확히 구분해 두세요."
  }
];

let cur = 0;
let correctCount = 0;
let wrongItems = [];
let answered = false;

function loadQuestion() {
  if (cur >= QUESTIONS.length) {
    showResult();
    return;
  }
  answered = false;
  const item = QUESTIONS[cur];

  const catBadge = document.getElementById('cat-text');
  catBadge.innerText = item.cat;
  if (item.isReview) {
    catBadge.className = 'cat-badge review';
  } else {
    catBadge.className = 'cat-badge';
  }

  document.getElementById('q-num').innerText = `${cur + 1} / ${QUESTIONS.length}`;
  document.getElementById('q-text').innerText = item.q;
  document.getElementById('score-badge').innerText = `진행 ${cur + 1} / ${QUESTIONS.length}`;
  document.getElementById('p-bar').style.width = `${((cur + 1) / QUESTIONS.length) * 100}%`;

  const btnO = document.getElementById('btn-o');
  const btnX = document.getElementById('btn-x');
  btnO.className = 'btn-ox';
  btnX.className = 'btn-ox';
  btnO.disabled = false;
  btnX.disabled = false;

  document.getElementById('exp-card').style.display = 'none';
  document.getElementById('schedule-badge').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
}

function choose(pick) {
  if (answered) return;
  answered = true;

  const item = QUESTIONS[cur];
  const isRight = (pick === item.ans);

  const btnO = document.getElementById('btn-o');
  const btnX = document.getElementById('btn-x');
  btnO.disabled = true;
  btnX.disabled = true;

  if (pick === 'O') {
    btnO.classList.add(isRight ? 'correct' : 'wrong');
  } else {
    btnX.classList.add(isRight ? 'correct' : 'wrong');
  }

  const expCard = document.getElementById('exp-card');
  const expTitle = document.getElementById('exp-title');
  const expBody = document.getElementById('exp-body');
  const schedBadge = document.getElementById('schedule-badge');

  expCard.style.display = 'block';
  expBody.innerText = item.exp;

  if (isRight) {
    correctCount++;
    expCard.className = 'explanation-card correct';
    expTitle.innerText = `⭕️ 정답입니다! (${item.point})`;
    schedBadge.style.display = 'none';
  } else {
    wrongItems.push(item);
    expCard.className = 'explanation-card wrong';
    expTitle.innerText = `❌ 오답입니다! (정답: ${item.ans})`;
    schedBadge.style.display = 'inline-block';
  }

  const btnNext = document.getElementById('btn-next');
  btnNext.style.display = 'block';
  if (cur === QUESTIONS.length - 1) {
    btnNext.innerText = '결과 보기 ➔';
  } else {
    btnNext.innerText = '다음 문제로 ➔';
  }
}

function goNext() {
  cur++;
  loadQuestion();
}

function showResult() {
  document.getElementById('play-area').style.display = 'none';
  const compBox = document.getElementById('complete-box');
  compBox.style.display = 'flex';

  document.getElementById('res-correct').innerText = `${correctCount}개`;
  document.getElementById('res-wrong').innerText = `${wrongItems.length}개`;

  const resIcon = document.getElementById('res-icon');
  const resTitle = document.getElementById('res-title');

  if (correctCount === QUESTIONS.length) {
    resIcon.innerText = '💯';
    resTitle.innerText = `${QUESTIONS.length}/${QUESTIONS.length} 전원 만점 마스터!`;
  } else {
    resIcon.innerText = '🎯';
    resTitle.innerText = `${QUESTIONS.length}문제 중 ${correctCount}문제 정답!`;
  }

  const wrongBox = document.getElementById('wrong-box');
  const wrongList = document.getElementById('wrong-list');
  if (wrongItems.length > 0) {
    wrongBox.style.display = 'block';
    wrongList.innerHTML = wrongItems.map((w, idx) => `
      <div class="wrong-review-item">
        <strong>${idx + 1}. [${w.cat}]</strong><br>
        ${w.q}<br>
        👉 <em>정답: ${w.ans} (${w.point})</em>
      </div>
    `).join('');
  } else {
    wrongBox.style.display = 'none';
  }
}

function restart() {
  cur = 0;
  correctCount = 0;
  wrongItems = [];
  document.getElementById('play-area').style.display = 'block';
  document.getElementById('complete-box').style.display = 'none';
  loadQuestion();
}

function copyResult() {
  let text = '';
  if (wrongItems.length === 0) {
    text = '오늘 퀴즈 다 맞음!';
  } else {
    text = `오늘 퀴즈 ${wrongItems.length}개 오답: ` + wrongItems.map(w => w.cat).join(', ');
  }
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('btn-copy-result');
    btn.innerText = '✅ 복사 완료! 대화창에 붙여넣기 해 주세요';
    setTimeout(() => {
      btn.innerText = '📋 결과 복사하기';
    }, 2500);
  }).catch(() => {
    alert(text);
  });
}

// Initial render
loadQuestion();
</script>
</body>
</html>
